ariable as 1, 2, 3 assumes the gaps between categories are equal, which may not be true.","explanation":"Ordinal encoding preserves order but not necessarily equal intervals. The gap between first and second class need not equal the gap between second and third.","concept":"Order is not the same as equal spacing.","source":"Lec 2.1, slide 45","answer":true},{"id":"L2-B02-5","lesson":2,"block":2,"topic":"Variable roles","type":"mcq","difficulty":"hard","skill":"scenario","question":"A delivery company predicts whether an order will be late (Late = 0/1). Columns: OrderID, Distance_km, VehicleType (bike, van, truck), Priority (standard, express, same-day), CustomerNotes (free text, almost every value unique). Which preprocessing plan is most appropriate for an introductory workflow?","explanation":"Identifiers are excluded as features, nominal categories are one-hot encoded, ordinal categories can keep their order with caution, high-cardinality text is excluded in a simple workflow, and the target stays as the 0/1 label.","concept":"Assign each column a role and a scale before choosing its treatment.","source":"Lec 2.1, slide 8, Lec 2.1, slide 49, Lec 2.1, slide 51","options":["OrderID for checks only; one-hot VehicleType; ordinal Priority; exclude CustomerNotes; Late as target","Keep OrderID as a numeric feature, label-encode VehicleType as 1/2/3, one-hot encode CustomerNotes","One-hot encode every column, including Distance_km and Late, so all inputs are treated equally","Drop VehicleType and Priority because they are not numeric, and keep OrderID as a feature"],"answer":0,"whyWrong":[null,"OrderID is an identifier, label-encoding a nominal variable implies a false order, and one-hot encoding near-unique text creates thousands of useless columns.","Distance_km is a ratio variable that should stay numeric, and the target must not be included in feature preprocessing.","Categorical variables can be encoded rather than dropped, and the identifier is the column that should be excluded."]},{"id":"L2-B03-1","lesson":2,"block":3,"topic":"Data quality dimensions","type":"match","difficulty":"easy","skill":"recall","question":"Match each data-quality dimension to its meaning.","explanation":"These are five of the six dimensions in the lecture; the sixth is relevance (whether a variable helps answer the question).","concept":"Each dimension names a different way data can fail.","source":"Lec 2.1, slide 12","pairs":[{"left":"Completeness","right":"Required values are present"},{"left":"Validity","right":"Values obey acceptable rules"},{"left":"Consistency","right":"Categories use common labels"},{"left":"Uniqueness","right":"Records are not duplicated"},{"left":"Timeliness","right":"Data reflects the correct period"}]},{"id":"L2-B03-2","lesson":2,"block":3,"topic":"Cleaning principles","type":"tf","difficulty":"easy","skill":"recall","question":"A cleaning rule is valid only if it is based on statistical evidence; domain knowledge and documentation are not acceptable bases.","explanation":"The lecture says a valid cleaning rule can be based on domain knowledge, documentation or statistical evidence.","concept":"Cleaning rules need a justification, and domain knowledge is one legitimate source.","source":"Lec 2.1, slide 16","answer":false},{"id":"L2-B03-3","lesson":2,"block":3,"topic":"Cleaning principles","type":"mcq","difficulty":"easy","skill":"understanding","question":"Why should the original raw file be kept unchanged and cleaning done on a working copy?","explanation":"Preserving raw data, plus recording which column changed, under what condition and why, makes cleaning reproducible and reversible.","concept":"Never overwrite the source; document every change.","source":"Lec 2.1, slide 16, Lec 2.1, slide 19","options":["It makes the cleaned dataset smaller and faster to load","It prevents the model from overfitting the training data","It supports reproducibility, peer review and recovery from mistakes","Raw files cannot be loaded into pandas without a copy"],"answer":2,"whyWrong":["Keeping a copy does not change the size of the cleaned data.","Overfitting is a modelling issue; the raw copy is about traceability.",null,"Raw files load normally; the reason is auditability."]},{"id":"L2-B03-4","lesson":2,"block":3,"topic":"Data quality dimensions","type":"mcq","difficulty":"medium","skill":"analysis","question":"In a school dataset, the 'Grade level' column contains 'Year 10', 'year10', 'Y10' and ' Year 10 ' for the same grade. Which data-quality dimension is mainly violated?","explanation":"The same category written in several ways breaks consistency. If left alone, it would also create artificial categories during encoding.","concept":"Consistency means one category, one label.","source":"Lec 2.1, slide 12, Lec 2.1, slide 22","options":["Completeness","Uniqueness","Consistency","Timeliness"],"answer":2,"whyWrong":["No values are missing; they are present but written differently.","Uniqueness concerns duplicated records, not differently spelled labels.",null,"Timeliness concerns whether the data reflects the correct period."]},{"id":"L2-B03-5","lesson":2,"block":3,"topic":"Cleaning principles","type":"mcq","difficulty":"hard","skill":"scenario","question":"A marketing analyst receives a customer file. They delete every row with a missing age or an unusually high income, overwrite the original file with the result, and keep no record of what was removed. The resulting model's accuracy improves. Which criticism best reflects the lecture?","explanation":"The lecture says cleaning is not deleting inconvenient data, the raw dataset must be preserved, decisions must be reproducible and explainable, and unusual values may be real.","concept":"Reproducible, documented, justified: the three tests of a cleaning decision.","source":"Lec 2.1, slide 16, Lec 2.1, slide 19, Lec 2.1, slide 23","options":["The process is fine, because the higher accuracy shows that the cleaning worked","Data was deleted without justification, the raw file was lost, and no rule was documented","The only mistake was using deletion instead of mean imputation for every column","The analyst should have deleted the whole income column instead of the rows"],"answer":1,"whyWrong":["Better accuracy on altered data does not make the process reproducible or defensible.",null,"The lecture rejects one universal rule, and mean imputation is sensitive to the very outliers involved.","Income may be meaningful. The issue is undocumented, unjustified removal, not which axis was deleted."]},{"id":"L2-B04-1","lesson":2,"block":4,"topic":"Duplicates","type":"tf","difficulty":"easy","skill":"recall","question":"Duplicate records can inflate the sample size and bias descriptive statistics.","explanation":"When the same observation appears more than once, it is counted more than once, which distorts counts, means and other statistics.","concept":"One observation should appear once.","source":"Lec 2.1, slide 20","answer":true},{"id":"L2-B04-2","lesson":2,"block":4,"topic":"Invalid values vs outliers","type":"tf","difficulty":"easy","skill":"understanding","question":"An outlier and an invalid value mean the same thing, so both should be removed in the same way.","explanation":"An invalid value is impossible according to a rule (for example a negative price). An outlier is unusual but may be real, so it must be investigated before any treatment.","concept":"Invalid means impossible; outlier means unusual.","source":"Lec 2.1, slide 23","answer":false},{"id":"L2-B04-3","lesson":2,"block":4,"topic":"Category cleaning and encoding order","type":"mcq","difficulty":"easy","skill":"recall","question":"What is the correct sequence for preparing a categorical feature?","explanation":"The lecture gives the sequence: inspect categories, clean categories, handle missingness, then encode.","concept":"Clean labels and fill gaps before encoding.","source":"Lec 2.1, slide 48","options":["Encode, inspect categories, clean categories, handle missingness","Inspect categories, clean categories, handle missingness, encode","Handle missingness, encode, inspect categories, clean categories","Inspect categories, encode, handle missingness, clean categories"],"answer":1,"whyWrong":["Encoding first turns spelling variants into separate columns before they can be cleaned.",null,"Cleaning after encoding is too late; variants are already separate columns.","Encoding before cleaning and before handling missing values creates extra or failing categories."]},{"id":"L2-B04-4","lesson":2,"block":4,"topic":"Category cleaning and encoding order","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why should category labels be standardised before creating dummy (one-hot) variables?","explanation":"Inconsistent spelling, capitalisation and whitespace create artificial categories. Cleaning must preserve meaning while merging variants.","concept":"One real category should become one column.","source":"Lec 2.1, slide 22, Lec 2.1, slide 48","options":["Dummy variables cannot be created for columns that contain text values","Standardising labels removes the need to handle missing values later","It turns nominal variables into ordinal ones so their order is preserved","Spelling and spacing variants would become separate columns for one real category"],"answer":3,"whyWrong":["One-hot encoding is designed for text categories; the problem is variants, not text itself.","Missing values still need treatment after labels are cleaned.","Cleaning labels does not add an order to categories.",null]},{"id":"L2-B04-5","lesson":2,"block":4,"topic":"Invalid values vs outliers","type":"mcq","difficulty":"hard","skill":"scenario","question":"A gym's membership data has an Age column containing -3 and 250 among normal ages, including one member aged 87. MonthlyFee has a few very high values, all belonging to 'Platinum' members. Which treatment follows the lecture?","explanation":"Invalid values break a plausibility rule (age cannot be negative or 250), so they are investigated and usually set to missing. Outliers can be real; treatment depends on the task and domain.","concept":"Rules identify invalid values; domain knowledge decides what to do with outliers.","source":"Lec 2.1, slide 21, Lec 2.1, slide 23","options":["Delete all rows with high MonthlyFee values, because they are outliers that distort the mean","Treat 87 as invalid because it is far above the average age of members","Set -3 and 250 to missing after checking, keep 87, and investigate the high fees rather than delete them","Replace -3 with 3 by taking the absolute value, and keep 250 unchanged as a valid age"],"answer":2,"whyWrong":["High fees tied to Platinum members are probably real. Blind removal discards genuine data.","An unusual age is not an impossible one. Only values that break a rule are invalid.",null,"Silently guessing a correction is undocumented, and 250 is impossible and needs investigation."]},{"id":"L2-B05-1","lesson":2,"block":5,"topic":"Representing missing values","type":"mcq","difficulty":"easy","skill":"recall","question":"A dataset uses -999 to mean 'not recorded'. What is the main risk the lecture identifies with this kind of sentinel code?","explanation":"A sentinel code looks like a valid number, so means, scaling and models treat it as data unless it is converted to NaN.","concept":"Convert sentinel codes to explicit missing values before analysis.","source":"Lec 2.1, slide 29","options":["It may be misread as a real number","pandas always deletes rows that contain -999","It is automatically converted to the mode","It can only appear in categorical columns"],"answer":0,"whyWrong":[null,"pandas does not treat -999 specially; that is exactly why it can be misread.","No automatic conversion happens.","Sentinel codes usually appear in numeric columns, where they distort calculations."]},{"id":"L2-B05-2","lesson":2,"block":5,"topic":"Missing-data mechanisms","type":"match","difficulty":"easy","skill":"recall","question":"Match each type of missingness to its meaning.","explanation":"MCAR, MAR and MNAR describe why a value is missing; structural missingness means the value is not applicable and should not always be imputed.","concept":"Why a value is missing determines how to treat it.","source":"Lec 2.1, slide 29, Lec 2.1, slide 31","pairs":[{"left":"MCAR","right":"Missingness unrelated to any observed or unobserved values"},{"left":"MAR","right":"Missingness related to other observed variables"},{"left":"MNAR","right":"Missingness related to the missing value itself"},{"left":"Structural missing","right":"The value does not apply to this record"}]},{"id":"L2-B05-3","lesson":2,"block":5,"topic":"Representing missing values","type":"tf","difficulty":"easy","skill":"recall","question":"A blank cell and a sentinel code such as 9999 carry the same risk: both are likely to be misread as real numbers.","explanation":"A blank cell usually becomes NaN when loaded. A sentinel code such as 9999 is the one likely to be misread as a real number.","concept":"Know how each form of missingness is represented after loading.","source":"Lec 2.1, slide 29","answer":false},{"id":"L2-B05-4","lesson":2,"block":5,"topic":"Missing-data mechanisms","type":"mcq","difficulty":"medium","skill":"application","question":"In a household survey, people with very high incomes are more likely to refuse to report their income. Which mechanism describes this missingness?","explanation":"When the probability of missingness depends on the value that is missing, the data are Missing Not At Random.","concept":"Ask what the missingness depends on: nothing, another column, or the value itself.","source":"Lec 2.1, slide 31","options":["MNAR","MCAR","MAR","Structural missing"],"answer":0,"whyWrong":[null,"MCAR would mean refusals are unrelated to any value, but here they depend on income itself.","MAR would mean missingness depends on another observed variable, not the missing income.","Income applies to every household; it was not reported rather than not applicable."]},{"id":"L2-B05-5","lesson":2,"block":5,"topic":"Missing-data mechanisms","type":"mcq","difficulty":"hard","skill":"scenario","question":"A hospital dataset has three gaps. 'Number of pregnancies' is blank for all male patients. 'Cholesterol' is missing more often for patients from one clinic, and the clinic is recorded. 'Weight' is missing for a random batch of rows lost in a file-import error. Which plan is most appropriate?","explanation":"Structural missingness should not always be imputed. MAR missingness relates to observed variables, which can inform the treatment. MCAR missingness from a random import error is the case where deletion or simple imputation is most defensible.","concept":"Match the treatment to the cause of missingness, column by column.","source":"Lec 2.1, slide 29, Lec 2.1, slide 31, Lec 2.1, slide 33","options":["Impute all three columns with the column mean, because one simple rule is easiest to document","Delete every row with any missing value, because deletion keeps only genuine observations","Pregnancies: not applicable, so do not impute blindly; cholesterol: use clinic (MAR); weight: impute or drop (MCAR)","Treat all three as MNAR, because each value is missing from a medical record"],"answer":2,"whyWrong":["The lecture rejects one universal rule. Imputing pregnancies for men would invent meaningless values.","Deletion is most acceptable when missingness is small and random; here it would also remove all male patients.",null,"Each gap has a different cause: not applicable, related to an observed variable, and random."]},{"id":"L2-B06-1","lesson":2,"block":6,"topic":"Imputation strategies","type":"mcq","difficulty":"easy","skill":"recall","question":"Which imputation strategy suits a nominal categorical variable with a few missing values?","explanation":"Mode imputation is appropriate for nominal categorical variables. A constant such as 'Unknown' is another option when it is meaningful.","concept":"Choose the imputation statistic that matches the variable type.","source":"Lec 2.1, slide 34, Lec 2.1, slide 35","options":["Mean","Median","Min-max scaling","Mode (most frequent value)"],"answer":3,"whyWrong":["A mean cannot be computed for unordered categories.","A median needs ordered numeric values.","Scaling is a transformation, not an imputation strategy.",null]},{"id":"L2-B06-2","lesson":2,"block":6,"topic":"Imputation strategies","type":"tf","difficulty":"easy","skill":"recall","question":"Mean imputation is more robust to outliers and skew than median imputation.","explanation":"The reverse is true. The mean is pulled by extreme values; the median resists skew, which is why it is often safer for age-like variables.","concept":"Median for skewed numeric data, mean for roughly symmetric data.","source":"Lec 2.1, slide 34, Lec 2.1, slide 35","answer":false},{"id":"L2-B06-3","lesson":2,"block":6,"topic":"Missing indicators","type":"tf","difficulty":"easy","skill":"recall","question":"A missing-indicator variable equals 1 when the original value is missing and 0 otherwise.","explanation":"A missing indicator is a binary variable that records whether a value was missing, which is useful when missingness itself may carry information.","concept":"Sometimes the fact that a value is missing is informative.","source":"Lec 2.1, slide 36","answer":true},{"id":"L2-B06-4","lesson":2,"block":6,"topic":"Risks of imputation","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why can heavy imputation make analysis results misleading?","explanation":"The lecture warns that imputed values are not observed facts, heavy imputation can overstate precision, and imputation can affect fairness when missingness relates to social or measurement processes. Reports should say what was imputed, how and why.","concept":"Imputation fills gaps with estimates, and estimates carry uncertainty.","source":"Lec 2.1, slide 38","options":["Imputation always introduces duplicate rows into the training data","Imputed values are estimates, so results can look more precise than they are","Imputed values are removed again automatically during scaling","Imputation converts numeric variables into categorical variables"],"answer":1,"whyWrong":["Imputation fills values; it does not duplicate records.",null,"Scaling transforms imputed values like any others.","Imputation does not change a variable's type."]},{"id":"L2-B06-5","lesson":2,"block":6,"topic":"Imputation strategies","type":"mcq","difficulty":"hard","skill":"scenario","question":"An insurer's claims data has four columns with gaps: 'Region' (categorical, 1% missing), 'Broker code' (80% missing, many unique codes), 'Annual income' (25% missing, right-skewed with some very large values), and 'Previous claims' (count, 0.5% missing). Which plan is most defensible?","explanation":"Each column needs its own justified treatment: mode for categorical, median for skewed numeric, drop or indicator for very high missingness, and reporting for all.","concept":"Avoid one universal rule; different variables have different meanings.","source":"Lec 2.1, slide 33, Lec 2.1, slide 34, Lec 2.1, slide 36, Lec 2.1, slide 40","options":["Mean imputation for all four columns, so the rule is consistent and easy to document","Mode for Region, drop or flag Broker code, median for income and previous claims, and document it","Listwise deletion of every row with any missing value, so only complete records remain","Mode for Annual income and mean for Region, so each column gets a simple statistic"],"answer":1,"whyWrong":["Mean is undefined for categories, distorted by skewed income, and no single rule fits every column.",null,"With 80% missing in Broker code, this would discard most of the dataset.","Mode suits categories, not a skewed numeric variable, and a mean cannot be computed for categories."]},{"id":"L2-B07-1","lesson":2,"block":7,"topic":"Encoding categorical variables","type":"mcq","difficulty":"easy","skill":"recall","question":"Which encoding is usually safest for a nominal predictor with several categories?","explanation":"One-hot encoding creates one indicator column per category, which avoids false order. It increases the number of columns.","concept":"Nominal categories have no order, so do not give them one.","source":"Lec 2.1, slide 43, Lec 2.1, slide 46","options":["Label encoding","Ordinal encoding","One-hot encoding","Binary 0/1 encoding"],"answer":2,"whyWrong":["Label encoding gives categories numbers that imply an order and distance.","Ordinal encoding is meant for categories with a real order.",null,"A single 0/1 column only works for variables with exactly two categories."]},{"id":"L2-B07-2","lesson":2,"block":7,"topic":"Encoding categorical variables","type":"tf","difficulty":"easy","skill":"recall","question":"Label-encoding a nominal feature, such as city names, can imply an order between categories that has no real meaning.","explanation":"Label encoding assigns numbers like 0, 1, 2. Many models treat these as ordered or as distances, which is meaningless for nominal categories.","concept":"Numbers carry order and distance; nominal categories have neither.","source":"Lec 2.1, slide 43","answer":true},{"id":"L2-B07-3","lesson":2,"block":7,"topic":"Encoding categorical variables","type":"match","difficulty":"easy","skill":"application","question":"Match each variable to the treatment the lecture would suggest for a simple workflow.","explanation":"Binary variables become 0/1, nominal variables are one-hot encoded, ordered categories keep their order with caution, near-unique text is excluded, and the target is kept separate from feature encoding.","concept":"Encoding depends on whether a variable is binary, nominal, ordinal, high-cardinality or the target.","source":"Lec 2.1, slides 42-51","pairs":[{"left":"A yes/no smoker flag","right":"Binary 0/1 encoding"},{"left":"Blood type (A, B, AB, O)","right":"One-hot encoding"},{"left":"Education level (primary, secondary, university)","right":"Ordinal encoding, stating the spacing assumption"},{"left":"Customer full name","right":"Exclude as high-cardinality text"},{"left":"The 0/1 outcome being predicted","right":"Keep as the target label"}]},{"id":"L2-B07-4","lesson":2,"block":7,"topic":"Encoding categorical variables","type":"mcq","difficulty":"medium","skill":"understanding","question":"When one-hot encoding is used for a regression model, why is one category often dropped?","explanation":"With k categories, k-1 indicators carry all the information; the last column is redundant. The dropped category becomes the reference group.","concept":"In regression, k categories need only k-1 indicator columns.","source":"Lec 2.1, slide 46","options":["To reduce the number of rows that the regression model has to fit","Because the dropped category is assumed to be missing for every row","The dropped category is implied when all other indicators are 0, so it is redundant","To convert the variable into an ordinal one with a reference order"],"answer":2,"whyWrong":["One-hot encoding adds columns; dropping one category does not change the rows.","The dropped category becomes the reference level, not a missing value.",null,"Dropping a column does not introduce an order."]},{"id":"L2-B07-5","lesson":2,"block":7,"topic":"Encoding categorical variables","type":"mcq","difficulty":"hard","skill":"scenario","question":"An analyst predicting customer churn label-encodes 'Country' (France = 0, Germany = 1, Spain = 2) and uses a distance-based model. They also one-hot encode 'CustomerName', creating about 9,000 columns. Which critique is most accurate?","explanation":"For nominal predictors, label encoding implies order and distance. One-hot encoding nearly unique values like names creates many useless columns, so high-cardinality text is excluded in an introductory workflow.","concept":"Encoding must not invent order, and must not explode the feature space with near-unique values.","source":"Lec 2.1, slide 43, Lec 2.1, slide 49","options":["Both choices are fine, because any numeric representation works for a distance-based model","Country should stay label-encoded, but CustomerName should be label-encoded too, to save columns","Country needs one-hot encoding because its codes imply false distances, and CustomerName should be excluded","Country should be scaled with a StandardScaler after label encoding, which removes the false order"],"answer":2,"whyWrong":["Distance-based models treat label codes as real distances, which is meaningless for countries.","Label-encoding names creates arbitrary numbers with false order; the feature should be excluded.",null,"Scaling changes the range but keeps the artificial ordering and distances."]},{"id":"L2-B08-1","lesson":2,"block":8,"topic":"Feature scaling","type":"match","difficulty":"easy","skill":"recall","question":"Match each scaler to the statistics it uses.","explanation":"The scaler's statistics determine its outlier sensitivity: min-max is very sensitive, standardisation is sensitive, and robust scaling is less sensitive.","concept":"Outlier sensitivity follows from the statistics a scaler uses.","source":"Lec 2.1, slide 60","pairs":[{"left":"StandardScaler","right":"Mean and standard deviation"},{"left":"MinMaxScaler","right":"Minimum and maximum"},{"left":"RobustScaler","right":"Median and interquartile range (IQR)"}]},{"id":"L2-B08-2","lesson":2,"block":8,"topic":"Feature scaling","type":"tf","difficulty":"easy","skill":"recall","question":"Feature scaling matters more for tree-based models than for distance-based models.","explanation":"Tree-based methods are less sensitive to scaling. Distance-based and gradient-based methods are the ones most affected by different feature ranges.","concept":"Distance and gradient methods care about scale; trees mostly do not.","source":"Lec 2.1, slide 55","answer":false},{"id":"L2-B08-3","lesson":2,"block":8,"topic":"Feature scaling","type":"mcq","difficulty":"easy","skill":"recall","question":"After standardisation (z-scores), what are the approximate mean and standard deviation of a feature?","explanation":"z = (x - mean) / standard deviation centres the feature at 0 with a spread of 1.","concept":"A z-score says how many standard deviations a value is from the mean.","source":"Lec 2.1, slide 56","options":["Mean 1, standard deviation 0","Minimum 0, maximum 1","Median 0, IQR 1","Mean 0, standard deviation 1"],"answer":3,"whyWrong":["A standard deviation of 0 would mean every value is identical.","That describes min-max normalisation.","That describes robust scaling.",null]},{"id":"L2-B08-4","lesson":2,"block":8,"topic":"Feature scaling","type":"mcq","difficulty":"medium","skill":"recall","question":"After standardisation, an observation has a value of +2. What does that tell you?","explanation":"z = (x − μ) / σ measures how many standard deviations a value sits above or below the mean. +2 means two standard deviations above.","concept":"A z-score is distance from the mean in standard deviations.","source":"Lec 2.1, slide 56","options":["It is twice as large as the feature's mean value","It is the second-largest value in the whole column","It is two standard deviations above the feature's mean","It lies outside the 0-to-1 range, so it is an error"],"answer":2,"whyWrong":["A z-score counts standard deviations from the mean, not multiples of the mean.","Standardisation does not rank values.",null,"Standardised values are not limited to 0-1; that is min-max scaling."]},{"id":"L2-B08-5","lesson":2,"block":8,"topic":"Feature scaling","type":"mcq","difficulty":"hard","skill":"scenario","question":"A property dataset is used with a distance-based model. Price ranges from $50,000 to $20,000,000 because of a few genuine mansions; Bedrooms ranges from 1 to 6. After min-max scaling Price, almost all prices fall between 0 and 0.03. What is the best diagnosis and fix?","explanation":"Min-max scaling is very sensitive to outliers because the minimum and maximum define the scale. Robust scaling centres on the median and scales by the IQR, so it is less affected. Outliers that may be real should be investigated, not deleted.","concept":"Choose a scaler whose statistics are not dominated by extreme values.","source":"Lec 2.1, slide 57, Lec 2.1, slide 58, Lec 2.1, slide 60","options":["No scaling is needed, because distance-based models are not affected by feature ranges","Switch to StandardScaler, which is not affected by outliers in the way min-max is","Delete every property priced above $1,000,000 so that min-max scaling works properly","Extreme prices compress the rest; use robust scaling and investigate rather than delete the mansions"],"answer":3,"whyWrong":["Distance-based models are strongly affected: a large-range feature dominates the distance.","Standardisation uses the mean and standard deviation, which outliers also distort.","The mansions are real data. Blind removal discards valid observations.",null]},{"id":"L2-B09-1","lesson":2,"block":9,"topic":"Data leakage and safe workflow","type":"mcq","difficulty":"easy","skill":"recall","question":"Which order of steps avoids data leakage during preprocessing?","explanation":"Medians, scaling parameters and category mappings should be learned only from training data and then applied to the test data.","concept":"Split first, fit on train, transform both.","source":"Lec 2.1, slide 61, Lec 2.1, slide 63","options":["Split the data, fit preprocessing on the training set, then transform the training and test sets","Fit preprocessing on the full dataset, then split into training and test sets","Split the data, fit preprocessing on the test set, then transform the training set","Transform the test set first, then split and fit on the training set"],"answer":0,"whyWrong":[null,"Fitting on the full data lets the test set influence preprocessing parameters.","Fitting on the test set leaks it directly into training decisions.","Test data should only ever be transformed with parameters learned from training data."]},{"id":"L2-B09-2","lesson":2,"block":9,"topic":"Data leakage and safe workflow","type":"tf","difficulty":"easy","skill":"recall","question":"Fitting a scaler on the full dataset before splitting can leak information from the test set into training.","explanation":"The scaler's mean and standard deviation would include test rows, so the test set has indirectly influenced preprocessing.","concept":"Any statistic computed from test data is a leak.","source":"Lec 2.1, slide 61","answer":true},{"id":"L2-B09-3","lesson":2,"block":9,"topic":"Data leakage and safe workflow","type":"tf","difficulty":"easy","skill":"recall","question":"Scaling should be applied before cleaning and missing-value treatment.","explanation":"The lecture says scaling should be applied after cleaning and missing-value treatment.","concept":"Clean, impute and encode before scaling.","source":"Lec 2.1, slide 54","answer":false},{"id":"L2-B09-4","lesson":2,"block":9,"topic":"Data leakage and safe workflow","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why does the lecture recommend building preprocessing as a pipeline?","explanation":"Pipelines bundle the steps so that parameters are fitted on training data and reused on test data in the same order every time.","concept":"Pipelines enforce the safe order automatically.","source":"Lec 2.1, slide 63","options":["It removes the need to split the data into training and test sets","It always improves model accuracy","It replaces missing-value treatment","It makes the workflow reproducible and harder to misuse"],"answer":3,"whyWrong":["A pipeline still needs a proper split; it enforces how fitting is done.","A pipeline is about correctness and reproducibility, not a guaranteed accuracy gain.","Imputation is one of the steps a pipeline contains.",null]},{"id":"L2-B09-5","lesson":2,"block":9,"topic":"Data leakage and safe workflow","type":"mcq","difficulty":"hard","skill":"scenario","question":"A team computes the median age on all 10,000 rows, imputes missing ages, standardises all features using the full dataset, then splits 80/20. Test accuracy is 91%, but accuracy on genuinely new data in production is 84%. What is the most likely explanation and fix?","explanation":"Fitting imputation and scaling on the full dataset lets the test set influence preprocessing parameters, which makes evaluation look better than it is. The safe order is split, fit on train, transform both.","concept":"Leakage makes evaluation optimistic.","source":"Lec 2.1, slide 61, Lec 2.1, slide 63","options":["The model is underfitting, so a more complex model is needed to close the production gap","Preprocessing saw the test rows, so the test score was optimistic; fit it on training data only","The median should have been replaced by the mean when imputing missing ages","Production data is always worse, so nothing in the workflow needs to change"],"answer":1,"whyWrong":["The gap between test and production suggests an optimistic test estimate, not underfitting.",null,"Changing the statistic does not fix the fact that it was computed on test data.","Some drift is possible, but the workflow contains a known leakage error that should be fixed."]},{"id":"L2-B10-1","lesson":2,"block":10,"topic":"Documentation and cleaning log","type":"tf","difficulty":"easy","skill":"recall","question":"Before cleaning, the lecture says the original raw file should be overwritten with the corrected version so that only one copy exists.","explanation":"False. The raw dataset should be preserved unchanged; cleaning happens on a working copy so every change can be traced and undone.","concept":"Keep the raw data; clean a copy.","source":"Lec 2.1, slides 16, 19","answer":false},{"id":"L2-B10-2","lesson":2,"block":10,"topic":"Documentation and cleaning log","type":"mcq","difficulty":"easy","skill":"recall","question":"According to the lecture, what should each recorded cleaning rule state?","explanation":"Recording the column, the condition and the reason makes cleaning reproducible, reviewable and recoverable.","concept":"A cleaning log answers: what, under which rule, and why.","source":"Lec 2.1, slide 19","options":["Which column changed, the condition used, and why","Who ran the code, the date, and the software version","The model's accuracy before and after the change","Only the total number of rows that were deleted"],"answer":0,"whyWrong":[null,"Useful metadata, but the lecture's rule is about what changed, under what condition, and the reason.","A cleaning log records the data decision itself, not model results.","A row count alone does not say which rule was applied or why."]},{"id":"L2-B10-3","lesson":2,"block":10,"topic":"Documentation and cleaning log","type":"match","difficulty":"easy","skill":"recall","question":"Each line of a cleaning log pairs a decision with its justification. Match each decision to a reason that would justify it.","explanation":"The lecture's documentation table gives each preprocessing decision a stated reason, so another analyst can see why it was made.","concept":"Every preprocessing decision needs a written reason.","source":"Lec 2.1, slides 24, 27","pairs":[{"left":"Drop column","right":"Missingness is too high to use it reliably"},{"left":"Impute column","right":"Numeric feature with moderate missingness"},{"left":"Encode column","right":"Categories must be turned into numbers"},{"left":"Scale column","right":"Its range is far larger than other features"},{"left":"Exclude column","right":"It is an identifier, not an attribute"}]},{"id":"L2-B10-4","lesson":2,"block":10,"topic":"Cleaning principles","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why does the lecture insist that cleaning decisions be reproducible and explainable?","explanation":"Reproducible, documented rules support peer review and error recovery. If a rule turns out to be wrong, it can be found and reversed.","concept":"Documented cleaning can be audited and reversed.","source":"Lec 2.1, slides 16, 19","options":["So that the cleaned data looks perfect for the model","Because a reproducible cleaning process always raises model accuracy","So another person can repeat, check and, if needed, undo each change","So that rows with problems can be removed without any review"],"answer":2,"whyWrong":["The goal is data that is analytically defensible, not artificially perfect.","Reproducibility supports review and recovery; it does not guarantee higher accuracy.",null,"Cleaning is not deleting inconvenient data; decisions should be reviewable."]},{"id":"L2-B10-5","lesson":2,"block":10,"topic":"Documentation and cleaning log","type":"mcq","difficulty":"hard","skill":"scenario","question":"An analyst receives a file of clinic visits, edits it directly in a spreadsheet (removing rows with unusual blood-test values and filling blanks by hand) and saves over the original. Months later a reviewer asks why 300 visits are missing, and the analyst cannot say. Which practice would have prevented this?","explanation":"The lecture's rules are: preserve the raw data, work on a copy, and record which column changed, under what condition, and why. Then the 300 missing visits could be traced to a rule, checked, and restored if the rule was wrong.","concept":"An untouched raw file plus a cleaning log makes every change traceable.","source":"Lec 2.1, slides 16, 19, 23","options":["Remove even more unusual rows so the remaining data has no extreme values","Switch from filling blanks by hand to mean imputation for every column","Rerun the model on the cleaned file and report only the final accuracy","Keep the raw file untouched, clean a working copy, and log each rule with its reason"],"answer":3,"whyWrong":["Unusual values may be real; deleting inconvenient data is not valid cleaning.","Changing the method does not restore the lost audit trail or the deleted rows.","Reporting only accuracy hides the decisions the reviewer is asking about.",null]},{"id":"L2-B11-1","lesson":2,"block":11,"topic":"High-cardinality features","type":"mcq","difficulty":"easy","skill":"recall","question":"What does 'high cardinality' mean for a column?","explanation":"High cardinality means many unique categories, such as names, ticket codes or cabin labels.","concept":"Cardinality counts distinct categories.","source":"Lec 2.1, slide 49","options":["It is a numeric column with a very large range","It is a categorical column with very many unique values","It is a column with a large share of missing values","It is a column that is perfectly correlated with the target"],"answer":1,"whyWrong":["A large numeric range is a scaling issue, not cardinality.",null,"That is high missingness, a different problem.","That suggests leakage or redundancy, not cardinality."]},{"id":"L2-B11-2","lesson":2,"block":11,"topic":"High-cardinality features","type":"tf","difficulty":"easy","skill":"recall","question":"One-hot encoding a column such as each customer's full name would create many nearly unique columns that add little useful information.","explanation":"True. The lecture warns that one-hot encoding Name would create many nearly unique columns, which is not useful in an introductory workflow.","concept":"One-hot encoding a near-unique column explodes the feature count.","source":"Lec 2.1, slide 49","answer":true},{"id":"L2-B11-3","lesson":2,"block":11,"topic":"High-cardinality features","type":"tf","difficulty":"easy","skill":"recall","question":"Instead of keeping a sparse, complex text column, the lecture's workflow can replace it with a binary indicator recording whether a value was present.","explanation":"True. Cabin is dropped but a Cabin_missing indicator is kept, because whether Cabin was recorded may carry information.","concept":"A messy column can be reduced to a simpler, meaningful feature.","source":"Lec 2.1, slides 27, 40","answer":true},{"id":"L2-B11-4","lesson":2,"block":11,"topic":"High-cardinality features","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why is an ID-like column with a unique code for every row risky to give a model, even after encoding it?","explanation":"A value that is unique to each row identifies the row rather than describing a pattern. Lecture 3.1 lists such features (e.g. Student ID) as overfitting risks, being too specific to the training set.","concept":"Unique identifiers describe rows, not patterns.","source":"Lec 2.1, slides 20, 49; Lec 3.1, slide 38","options":["It turns the dataset into semi-structured data","It always contains missing values that break the encoder","It forces the model to treat the column as an ordinal scale","It lets the model memorise rows instead of learning patterns"],"answer":3,"whyWrong":["Encoding a column does not change the dataset's structural type.","Unique codes need not be missing; the problem is that they are unique.","One-hot encoding avoids imposed order; the issue is memorisation.",null]},{"id":"L2-B11-5","lesson":2,"block":11,"topic":"High-cardinality features","type":"mcq","difficulty":"hard","skill":"scenario","question":"An online shop wants to predict product returns. Its data has product_sku (18,000 unique codes), category (12 values) and customer_id. Which preprocessing plan follows the lectures?","explanation":"Low-cardinality nominal columns suit one-hot encoding. Identifiers are excluded. Very high-cardinality columns are handled through feature engineering (recoding or grouping), which Lecture 3.1 lists among common operations.","concept":"Encoding choice depends on cardinality and meaning.","source":"Lec 2.1, slides 43, 46, 49; Lec 3.1, slide 19","options":["One-hot encode category, exclude customer_id, and group product_sku codes","One-hot encode all three columns so that no information is lost along the way","Label-encode product_sku as 0 to 17,999 so it fits in a single numeric column","Drop category because it has the fewest unique values of the three columns"],"answer":0,"whyWrong":[null,"This creates tens of thousands of near-unique columns and lets the model memorise customers.","Label encoding a nominal column implies a false order and distance between products.","A low-cardinality nominal column is exactly what one-hot encoding suits."]},{"id":"L2-B12-1","lesson":2,"block":12,"topic":"Risks of imputation","type":"tf","difficulty":"easy","skill":"recall","question":"Once missing values have been imputed, the lecture says they can be treated as observed facts in the final report.","explanation":"False. Imputed values are estimates, not observed facts, and reports should state what was imputed, how, and why.","concept":"Imputed means estimated.","source":"Lec 2.1, slide 38","answer":false},{"id":"L2-B12-2","lesson":2,"block":12,"topic":"Risks of imputation","type":"mcq","difficulty":"easy","skill":"recall","question":"What does the lecture say a report should state about imputation?","explanation":"Transparency lets readers judge how much the results depend on estimated values.","concept":"Report every imputation and its rationale.","source":"Lec 2.1, slide 38","options":["The names of the people who collected the data","Nothing, because imputation is a routine preprocessing step","What was imputed, by which method, and why","Only the columns that had no missing values at all"],"answer":2,"whyWrong":["Data collectors are not what the lecture asks reports to state about imputation.","The lecture explicitly asks for imputation to be reported.",null,"Complete columns were not imputed, so they say nothing about the estimates added."]},{"id":"L2-B12-3","lesson":2,"block":12,"topic":"Risks of imputation","type":"mcq","difficulty":"easy","skill":"recall","question":"Which practice does the lecture recommend in serious research to check how much results depend on imputation choices?","explanation":"Sensitivity analysis compares results under different reasonable imputation choices to see whether conclusions hold.","concept":"Test whether conclusions survive different imputation choices.","source":"Lec 2.1, slide 38","options":["Min-max scaling","Sensitivity analysis","Label encoding","Listwise deletion of every incomplete row"],"answer":1,"whyWrong":["Scaling changes feature ranges; it does not test robustness to imputation.",null,"Encoding converts categories to numbers; it is unrelated to imputation checks.","Deletion is another strategy, not a check on how results change between strategies."]},{"id":"L2-B12-4","lesson":2,"block":12,"topic":"Risks of imputation","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why can heavy imputation make results look more precise than they really are?","explanation":"Filling many gaps adds rows that look complete, so the analysis appears to rest on more real evidence than it does. That is why the lecture warns about false precision and asks for reporting and sensitivity analysis.","concept":"Many filled values can create false confidence.","source":"Lec 2.1, slide 38","options":["Imputation always increases the spread of each column","Estimated values are counted as if they were real observations","Imputed values are always extreme outliers","Imputation deletes rows, shrinking the dataset"],"answer":1,"whyWrong":["Mean or median imputation tends to shrink spread, not increase it.",null,"Imputed values are usually central values such as the median or mode.","Deletion removes rows; imputation keeps them by filling values."]},{"id":"L2-B12-5","lesson":2,"block":12,"topic":"Risks of imputation","type":"mcq","difficulty":"hard","skill":"scenario","question":"A city survey records household income. Income is missing far more often for one neighbourhood. The analyst fills every gap with the city-wide median, and the model is used to allocate support funds. What is the main concern?","explanation":"When missingness is linked to social or demographic processes, imputation can affect fairness. Here the missingness depends on neighbourhood (MAR, or possibly MNAR), so a single median can misrepresent that group. The lecture says to report the imputation and, in serious settings, run sensitivity analysis; a missing indicator may also help, used with care.","concept":"Imputation choices can create unfairness when missingness follows group lines.","source":"Lec 2.1, slides 31, 36, 38","options":["Group-linked missingness can bias results, so report and test it","Median imputation is never acceptable for any numerical variable at all","The neighbourhood column should be one-hot encoded before imputing","The data is missing completely at random, so imputation is unbiased"],"answer":0,"whyWrong":[null,"The lecture calls median imputation a defensible baseline for skewed numeric data.","Encoding the neighbourhood does not address the biased missingness.","Missingness depends on neighbourhood, an observed variable, so it is not MCAR."]},{"id":"L2-X1","lesson":2,"block":0,"topic":"Deletion strategies","type":"mcq","difficulty":"easy","skill":"recall","question":"What is the main drawback of listwise deletion?","explanation":"Listwise deletion is easy but can shrink the dataset a lot. Deletion is more acceptable when missingness is small and plausibly random, and it must be reported.","concept":"Deletion changes the dataset used for analysis, so report it.","source":"Lec 2.1, slide 33","options":["It removes whole columns that have high missingness from the dataset","It replaces missing values with the mean of each column","It adds an indicator column for every value that is missing","It drops every row with any gap and may discard many useful observations"],"answer":3,"whyWrong":["That is column deletion, a different strategy.","That is mean imputation.","That is a missing indicator.",null]},{"id":"L2-X2","lesson":2,"block":0,"topic":"Data quality dimensions","type":"tf","difficulty":"easy","skill":"recall","question":"Relevance, as a data-quality dimension, asks whether a variable helps answer the analysis question.","explanation":"Relevance is the sixth dimension in the lecture's table, alongside completeness, validity, consistency, uniqueness and timeliness.","concept":"Not every column helps answer the question.","source":"Lec 2.1, slide 12","answer":true},{"id":"L2-X3","lesson":2,"block":0,"topic":"Missing indicators","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why might an analyst add a missing indicator for a column even after imputing its missing values?","explanation":"After imputation, a missing row looks like any other. A binary indicator keeps the information that the value was not recorded, which can be informative, though it should be used thoughtfully.","concept":"Imputation fills a gap; an indicator remembers that there was one.","source":"Lec 2.1, slide 36","options":["Being missing may itself carry information that imputation hides","Because imputed values cannot be used by a model without an indicator","Because the indicator removes any bias that missingness causes","Because an indicator makes the imputed values exact"],"answer":0,"whyWrong":[null,"Models can use imputed values directly; the indicator adds information, it is not required.","The lecture warns that indicators may also encode collection bias.","Imputed values remain estimates whatever else is added."]},{"id":"L3-B01-1","lesson":3,"block":1,"topic":"Features, X and the target","type":"mcq","difficulty":"easy","skill":"recall","question":"When a dataset is represented as a matrix X with n rows and p columns, what do n and p stand for?","explanation":"Each row of X is one sample (for example one student) and each column is one feature.","concept":"Rows are samples, columns are features, and y is kept separate.","source":"Lec 3.1, slide 9","options":["n is the number of features; p is the number of samples","n is the number of targets; p is the number of predictions","n is the number of samples; p is the number of features","n is the number of models; p is the number of parameters"],"answer":2,"whyWrong":["This reverses the convention: rows are samples, columns are features.","X holds the inputs only; the target y is separate.",null,"X describes data, not models."]},{"id":"L3-B01-2","lesson":3,"block":1,"topic":"Features, X and the target","type":"tf","difficulty":"easy","skill":"recall","question":"Predicting a student's final grade on a numeric 0-20 scale is a classification task.","explanation":"Because the target is numeric and continuous, predicting it is a regression task. Classification predicts discrete labels such as pass/fail.","concept":"The type of target decides the type of task.","source":"Lec 3.1, slide 10","answer":false},{"id":"L3-B01-3","lesson":3,"block":1,"topic":"Features, X and the target","type":"mcq","difficulty":"easy","skill":"recall","question":"What is a feature?","explanation":"Features can be numerical (age, absences), categorical (school) or ordinal (education level).","concept":"Features are the inputs; the target is the output.","source":"Lec 3.1, slide 7","options":["A measurable property of the thing being observed, used as an input","The variable that the model is trying to predict from the inputs","One complete row of the dataset, such as one student","A weight that the model learns during training"],"answer":0,"whyWrong":[null,"That is the target, y.","A row is a sample; a feature is a column.","That is a model parameter."]},{"id":"L3-B01-4","lesson":3,"block":1,"topic":"Why features matter","type":"mcq","difficulty":"medium","skill":"understanding","question":"The lecture says 'garbage in, garbage out' and claims a simple linear model with well-engineered features can beat a complex model trained on raw data. What idea explains both statements?","explanation":"If the inputs carry no relevant signal, no algorithm can predict well. Features that express the underlying pattern let even simple models perform strongly.","concept":"Representation quality limits what any model can learn.","source":"Lec 3.1, slide 11","options":["Complex models always overfit on tabular data, so simple models always win in practice","A model can only learn signal its features contain, so representation can matter more than the algorithm","Raw data contains no information at all until it has been scaled and encoded","Deep neural networks cannot be trained on tabular data, so simpler models are needed"],"answer":1,"whyWrong":["The claim is about feature quality, not that complex models always lose.",null,"Raw data contains information; the issue is whether it is represented usefully.","The lecture does not say this; it says even advanced algorithms need relevant signal."]},{"id":"L3-B01-5","lesson":3,"block":1,"topic":"Feature engineering","type":"mcq","difficulty":"hard","skill":"scenario","question":"A bike-share company wants to predict hourly rental demand. Its raw data has a timestamp string for each rental and the GPS coordinates of each station. One analyst wants to feed the raw strings and coordinates directly into a model. Another proposes features such as 'is_weekend', 'hour_of_day' and 'distance to city centre'. Which reasoning best matches the lecture?","explanation":"Transforming time into weekend flags and GPS into distances turns raw data into features that reflect domain meaning, which is exactly what feature engineering aims to do.","concept":"Feature engineering re-expresses raw inputs so patterns are easier to learn.","source":"Lec 3.1, slide 13, Lec 3.1, slide 19","options":["Engineering is pointless, because any model extracts everything it needs from raw columns","Engineered features always remove information, so raw columns are the safer choice","Raw columns are not always the most informative form; engineered features expose the patterns directly","Feature engineering only applies to classification tasks, and rental demand is numeric"],"answer":2,"whyWrong":["The lecture says raw columns are not always the most informative representation.","Good engineered features increase useful information by exposing patterns.",null,"Feature engineering applies to regression tasks as well, such as predicting a grade."]},{"id":"L3-B02-1","lesson":3,"block":2,"topic":"Feature engineering, selection and PCA","type":"match","difficulty":"easy","skill":"recall","question":"Match each method to what it does.","explanation":"All three change the feature space, in different ways: richer representation, smaller subset, or compressed space.","concept":"Create, choose, or compress.","source":"Lec 3.1, slide 15","pairs":[{"left":"Feature engineering","right":"Creates new features from existing ones"},{"left":"Feature selection","right":"Keeps only a subset of the existing features"},{"left":"PCA","right":"Builds new components as linear combinations of features"}]},{"id":"L3-B02-2","lesson":3,"block":2,"topic":"Feature engineering, selection and PCA","type":"tf","difficulty":"easy","skill":"recall","question":"Feature engineering, feature selection and PCA take place after basic cleaning and before model fitting.","explanation":"The lecture places this feature work between preprocessing and modelling.","concept":"Feature work sits between cleaning and modelling.","source":"Lec 3.1, slide 14","answer":true},{"id":"L3-B02-3","lesson":3,"block":2,"topic":"Feature engineering, selection and PCA","type":"tf","difficulty":"easy","skill":"recall","question":"In real projects, feature work is usually done once, in a single pass, before any evaluation.","explanation":"The lecture says feature work is usually iterative: inspect, transform, evaluate and revise.","concept":"Feature work is a loop, not a single step.","source":"Lec 3.1, slide 14","answer":false},{"id":"L3-B02-4","lesson":3,"block":2,"topic":"Feature engineering, selection and PCA","type":"mcq","difficulty":"medium","skill":"understanding","question":"A school wants a model with fewer inputs, and every input must be explainable to administrators in plain language. Which approach fits best, and why?","explanation":"The right method depends on the goal: meaning, relevance or compactness. Selection keeps original columns, so it suits explanation; PCA suits compression.","concept":"Choose the method that fits the purpose: explanation, prediction, visualisation or compression.","source":"Lec 3.1, slide 15, Lec 3.1, slide 54","options":["PCA, because components are always easier to explain than original variables","Feature selection, because it keeps original variables that remain directly interpretable","Feature engineering, because it always reduces the number of inputs","Keep all features, because removing any feature makes a model harder to explain"],"answer":1,"whyWrong":["PCA components are weighted combinations, which usually reduces direct interpretability.",null,"Engineering creates new features; it does not by itself reduce the count.","Fewer, original features make explanation easier, not harder."]},{"id":"L3-B02-5","lesson":3,"block":2,"topic":"Feature engineering, selection and PCA","type":"mcq","difficulty":"hard","skill":"scenario","question":"Three teams have different goals. Team A must compress 40 highly correlated sensor readings to plot machines in two dimensions. Team B's advisor wants to know which existing student attributes matter most, in plain terms. Team C needs to capture 'change in performance between two quizzes', which no single column shows. Which pairing is correct?","explanation":"PCA compresses correlated variables into a few components for visualisation. Selection keeps the most relevant original variables. Engineering creates a new variable such as a difference.","concept":"Compactness, relevance and meaning point to different methods.","source":"Lec 3.1, slide 15, Lec 3.1, slide 54","options":["A: feature selection; B: PCA; C: feature engineering","A: PCA; B: feature selection; C: feature engineering","A: PCA; B: feature engineering; C: feature selection","A: feature engineering; B: feature selection; C: PCA"],"answer":1,"whyWrong":["Team B needs interpretable original attributes, which PCA does not give. Team A needs compression, which is PCA's strength.",null,"Team C needs a new variable built from two columns; selection only keeps existing ones.","PCA builds variance-based components, not a meaningful 'change' feature; Team A's goal is compression."]},{"id":"L3-B03-1","lesson":3,"block":3,"topic":"Feature engineering","type":"mcq","difficulty":"easy","skill":"recall","question":"Feature engineering can be written as X_new = f(X_raw). Which requirement does the lecture place on the transformation f?","explanation":"A transformation that cannot be repeated, explained, or computed when a prediction is needed is not usable in practice.","concept":"Every engineered feature must be computable at prediction time.","source":"Lec 3.1, slide 21","options":["It must always be nonlinear","It must use the target variable","It must increase the number of features as much as possible","It should be reproducible, documented and available at prediction time"],"answer":3,"whyWrong":["f can be numeric, logical, categorical or domain-based; it need not be nonlinear.","Using the target in features causes leakage.","A good feature increases useful information, not just dimensionality.",null]},{"id":"L3-B03-2","lesson":3,"block":3,"topic":"Feature engineering","type":"tf","difficulty":"easy","skill":"recall","question":"A good engineered feature should increase useful information, not simply increase the number of columns.","explanation":"The lecture says good features align with the real-world process and add information; adding columns without meaning adds noise.","concept":"More columns is not the same as more information.","source":"Lec 3.1, slide 20","answer":true},{"id":"L3-B03-3","lesson":3,"block":3,"topic":"Feature engineering","type":"mcq","difficulty":"easy","skill":"recall","question":"Which of the following is NOT a feature-engineering operation?","explanation":"Removing columns based on correlation is feature selection: it keeps a subset rather than creating new variables.","concept":"Engineering creates; selection removes.","source":"Lec 3.1, slide 19, Lec 3.1, slide 43","options":["Computing a ratio of two variables","Creating an interaction term between two variables","Recoding or grouping categories","Removing columns that have low correlation with the target"],"answer":3,"whyWrong":["Ratios are an engineering operation.","Interactions are an engineering operation.","Recoding and grouping are listed engineering operations.",null]},{"id":"L3-B03-4","lesson":3,"block":3,"topic":"Feature engineering","type":"mcq","difficulty":"medium","skill":"application","question":"A health model has raw 'height (m)' and 'weight (kg)' columns. Which engineered feature best expresses body size relative to height, in the spirit of the lecture's ratio features?","explanation":"A ratio feature expresses one quantity relative to another, which can be more informative than absolute values when context matters. Weight relative to height squared is the familiar body-mass index.","concept":"Ratios compare quantities on a common scale when the ratio has real meaning.","source":"Lec 3.1, slide 27","options":["Weight plus height","Height minus weight","A one-hot encoding of height","Weight divided by height squared"],"answer":3,"whyWrong":["Adding kilograms and metres has no meaningful interpretation.","Subtracting values in different units has no meaning.","One-hot encoding is for categories, not a continuous measurement.",null]},{"id":"L3-B03-5","lesson":3,"block":3,"topic":"Data leakage in features","type":"mcq","difficulty":"hard","skill":"scenario","question":"A university builds an early-warning model that runs in week 4 of the semester to flag students at risk of failing. The analyst includes 'final exam score' and 'absences in week 12' because both correlate strongly with failing. Accuracy in testing is excellent. What is wrong?","explanation":"Leakage occurs when a feature contains information not genuinely available at prediction time. For early intervention, later grades and outcomes are not permissible inputs.","concept":"Check every feature against the moment the prediction will be made.","source":"Lec 3.1, slide 39, Lec 3.1, slide 42","options":["Nothing: features with high correlation should always be kept","They are not available in week 4, so they leak future information","The features should be standardised, which would remove the problem","The two features should be combined with PCA so the model cannot see them directly"],"answer":1,"whyWrong":["Correlation is not enough; a feature must be available when the prediction is made.",null,"Scaling does not change when information becomes available.","Compressing leaked information still leaks it."]},{"id":"L3-B04-1","lesson":3,"block":4,"topic":"Interaction features","type":"mcq","difficulty":"easy","skill":"recall","question":"What does an interaction feature model?","explanation":"Multiplying two variables lets a linear model capture a conditional relationship without needing a fully nonlinear model.","concept":"Interactions capture 'it depends'.","source":"Lec 3.1, slide 28","options":["That the effect of one variable depends on another variable","The average of two related variables measured at the same time","The square of a single variable, used to model curvature","The difference between two measurements taken at different times"],"answer":0,"whyWrong":[null,"An average is a summary feature, not an interaction.","A squared term is a polynomial feature.","A difference captures change, not dependence of one effect on another."]},{"id":"L3-B04-2","lesson":3,"block":4,"topic":"Difference features","type":"tf","difficulty":"easy","skill":"understanding","question":"A difference feature such as (second test score - first test score) equal to 0 tells you the student is performing well.","explanation":"A value of 0 means stability, but a student stable at a high score and a student stable at a low score both get 0. The feature should be read alongside a level feature.","concept":"A change feature needs a level feature for context.","source":"Lec 3.1, slide 23","answer":false},{"id":"L3-B04-3","lesson":3,"block":4,"topic":"Difference features","type":"mcq","difficulty":"easy","skill":"application","question":"A 'progress' feature is defined as Q2 sales − Q1 sales. What does a negative value indicate?","explanation":"Like grade_progress = G2 − G1, the sign shows the direction of change: positive means improvement, negative means decline, zero means stability.","concept":"The sign of a difference feature shows direction.","source":"Lec 3.1, slide 22","options":["Sales declined from Q1 to Q2","Sales improved from Q1 to Q2","Sales stayed exactly the same in both quarters","The data contains an error, because features cannot be negative"],"answer":0,"whyWrong":[null,"Improvement gives a positive difference.","No change gives zero.","Difference features can legitimately be negative."]},{"id":"L3-B04-4","lesson":3,"block":4,"topic":"Summary features","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why can an average of two early grades be a more useful feature than either grade alone?","explanation":"Summary features reduce variance and short-term fluctuation. Keeping both raw and summary features can still be useful.","concept":"Summaries trade detail for stability.","source":"Lec 3.1, slide 26","options":["Because an average always correlates perfectly with the final grade","It reflects sustained achievement and is less affected by one unusual test","Because the original grades must be deleted once the average exists","Because averaging removes the need for a separate train-test split"],"answer":1,"whyWrong":["No feature correlates perfectly; the average is more stable, not perfect.",null,"The lecture says the average should not automatically replace the raw features.","Feature design does not replace evaluation practice."]},{"id":"L3-B04-5","lesson":3,"block":4,"topic":"Ratio and interaction features","type":"mcq","difficulty":"hard","skill":"scenario","question":"An analyst creates 'absences_per_point = absences / prior_score', where prior_score can be 0, and also adds interaction terms for every pair of 25 variables. Several students now have extremely large feature values, and the model performs worse on new data. What is the best critique?","explanation":"Ratios must be used carefully because small denominators create instability; the lecture's example adds 1 to the denominator. Too many interactions inflate complexity, so a small justified set is better.","concept":"Engineer features that are stable and meaningful, not as many as possible.","source":"Lec 3.1, slide 27, Lec 3.1, slide 28, Lec 3.1, slide 42","options":["Tiny denominators make the ratio unstable, and so many interactions invite overfitting","The model needs even more interaction terms to cancel out the extreme ratio values","Extreme ratio values are genuine outliers and should be kept unchanged in the model","The only problem is that the new features were not one-hot encoded before training"],"answer":0,"whyWrong":[null,"More interactions increase complexity and overfitting further.","These extremes come from tiny denominators in the feature design, not from real behaviour.","These are numeric features; one-hot encoding does not apply."]},{"id":"L3-B05-1","lesson":3,"block":5,"topic":"Polynomial features","type":"tf","difficulty":"easy","skill":"recall","question":"Adding a squared term such as x² lets a linear model represent curvature in a relationship.","explanation":"Polynomial features let a simple model behave more flexibly in the original feature space.","concept":"New nonlinear features let linear models fit curves.","source":"Lec 3.1, slide 31, Lec 3.1, slide 32","answer":true},{"id":"L3-B05-2","lesson":3,"block":5,"topic":"Polynomial features","type":"mcq","difficulty":"easy","skill":"recall","question":"What is the main risk of adding many polynomial features?","explanation":"Polynomial features should be used selectively because more flexible representations can overfit if not well justified.","concept":"Flexibility costs stability.","source":"Lec 3.1, slide 31, Lec 3.1, slide 32","options":["They make the model unable to represent any curved relationship","They convert numeric features into categories that need encoding","They can amplify noise and multicollinearity, leading to overfitting","They remove the need to keep a separate test set for evaluation"],"answer":2,"whyWrong":["They add curvature; that is their purpose.","Polynomial terms remain numeric.",null,"No feature type removes the need for evaluation."]},{"id":"L3-B05-3","lesson":3,"block":5,"topic":"Categorical and ordinal features","type":"match","difficulty":"easy","skill":"application","question":"A university dataset has the variables below. Match each to a suitable treatment.","explanation":"Binary variables become 0/1, nominal variables get one indicator per category, ordinal variables keep their order with a stated assumption, and numeric features stay numeric.","concept":"Encoding depends on whether a category is binary, nominal or ordinal.","source":"Lec 3.1, slide 33, Lec 3.1, slide 35","pairs":[{"left":"Has scholarship (yes/no)","right":"Binary 0/1"},{"left":"Campus (North, South, East)","right":"One-hot encoding"},{"left":"Year of study (1st, 2nd, 3rd, 4th)","right":"Keep the order, stating the spacing assumption"},{"left":"GPA","right":"Keep as a numeric feature"}]},{"id":"L3-B05-4","lesson":3,"block":5,"topic":"Domain knowledge","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why does the lecture say strong engineered features usually come from domain knowledge rather than blind trial and error?","explanation":"A useful question is what a teacher or advisor would consider informative. Features grounded in the real process are easier to justify and explain.","concept":"Start from domain meaning.","source":"Lec 3.1, slide 36, Lec 3.1, slide 42","options":["They are plausible, interpretable and defensible, while arbitrary features add noise","Domain knowledge guarantees higher accuracy than any automated feature method","Features found by trial and error cannot be computed reliably in Python","Domain knowledge removes the need to check engineered features for leakage"],"answer":0,"whyWrong":[null,"The lecture argues for plausibility and interpretability, not a guaranteed accuracy win.","They can be computed; the problem is that they often lack meaning.","Leakage checks are still needed for every feature."]},{"id":"L3-B05-5","lesson":3,"block":5,"topic":"Polynomial features","type":"mcq","difficulty":"hard","skill":"scenario","question":"A linear model predicts exam score from weekly study hours. Plots show that scores rise steadily up to about 15 hours and then level off, and the model's errors follow a clear curved pattern. Which change best follows the lecture?","explanation":"A squared term lets a linear model bend. It should be justified and checked, because more flexible representations can overfit.","concept":"Use the simplest nonlinear feature that captures the pattern.","source":"Lec 3.1, slide 31, Lec 3.1, slide 32","options":["Replace the model with a very large neural network, because linear models cannot be fixed","Add terms up to the 10th power of study hours to capture every detail","Add a squared study-hours term, then check it improves results on held-out data","Drop study hours, because its relationship with the score is not linear"],"answer":2,"whyWrong":["The lecture shows that engineered nonlinear features let simple models capture curvature.","High-degree terms amplify noise and overfit; polynomial features should be used selectively.",null,"A nonlinear relationship is still a relationship; removing the feature discards signal."]},{"id":"L3-B06-1","lesson":3,"block":6,"topic":"Good and bad features","type":"match","difficulty":"easy","skill":"recall","question":"Match each kind of problematic feature to its description.","explanation":"The lecture warns about constant, sparse and overly specific features, and says leaking features are the most dangerous.","concept":"Bad features add no signal, add noise, or add false signal.","source":"Lec 3.1, slide 38, Lec 3.1, slide 39","pairs":[{"left":"Constant feature","right":"Every row has the same value (variance 0)"},{"left":"Sparse feature","right":"Almost all rows are 0 or empty"},{"left":"Overfitting-prone feature","right":"Too specific to the training set, such as a student ID"},{"left":"Leaking feature","right":"Contains information not available when predicting"}]},{"id":"L3-B06-2","lesson":3,"block":6,"topic":"Good and bad features","type":"tf","difficulty":"easy","skill":"recall","question":"A feature whose value is the same in every row gives the model useful variation to learn from.","explanation":"A constant feature has variance 0, so it gives the model nothing to distinguish samples by.","concept":"No variation, no information.","source":"Lec 3.1, slide 38, Lec 3.1, slide 50","answer":false},{"id":"L3-B06-3","lesson":3,"block":6,"topic":"Good and bad features","type":"mcq","difficulty":"easy","skill":"recall","question":"Which of these is NOT a characteristic of a good feature listed in the lecture?","explanation":"Good features have high correlation with the target, low redundancy, are model-agnostic and computationally efficient.","concept":"Low redundancy is part of being a good feature.","source":"Lec 3.1, slide 37","options":["It relates closely to the target the model is predicting","It repeats information already contained in other columns","It works across many different types of algorithms","It is cheap and easy to calculate at prediction time"],"answer":1,"whyWrong":["High correlation with the target is listed.",null,"Being model-agnostic is listed.","Computational efficiency is listed."]},{"id":"L3-B06-4","lesson":3,"block":6,"topic":"Data leakage in features","type":"mcq","difficulty":"medium","skill":"analysis","question":"A bank predicts which loans will default. One feature is 'collection agency assigned', which is set only after a customer stops paying. What problem does this feature create?","explanation":"A feature that is only known after the outcome is a form of leakage and produces unrealistically high accuracy.","concept":"Ask whether the feature exists before the outcome is known.","source":"Lec 3.1, slide 39, Lec 3.1, slide 42","options":["Target leakage, because it is only known after default","Multicollinearity, because it is correlated with income","Sparsity, because most of its values are zero","Low variance, because it only has two possible values"],"answer":0,"whyWrong":[null,"The issue is timing, not correlation with another predictor.","Even if it were sparse, the decisive problem is that it reveals the outcome.","Binary features can be perfectly valid; this one is invalid because of timing."]},{"id":"L3-B06-5","lesson":3,"block":6,"topic":"Data leakage in features","type":"mcq","difficulty":"hard","skill":"scenario","question":"A model predicting each student's final numeric course score reaches almost perfect accuracy. Its features include study hours, attendance, a 'letter grade' column (A to F, assigned from the final score) and the student ID number. What explains the result, and what should change?","explanation":"Using the target, or a transformation of it, to predict the target is leakage. Identifiers are overly specific to the training set and lead to overfitting.","concept":"Unrealistically high accuracy is a warning sign for leakage.","source":"Lec 3.1, slide 38, Lec 3.1, slide 39, Lec 3.1, slide 42","options":["The model is excellent and should be deployed as it is","Only the student ID should be removed, because letter grades are a normal feature","The letter grade should be one-hot encoded so the model uses it correctly","The letter grade leaks the target and the ID is too specific; remove both"],"answer":3,"whyWrong":["Near-perfect accuracy here comes from leakage, not real predictive power.","The letter grade is derived from the target itself, which is direct leakage.","Encoding a leaked feature still leaks the target.",null]},{"id":"L3-B07-1","lesson":3,"block":7,"topic":"Feature selection","type":"mcq","difficulty":"easy","skill":"recall","question":"What is feature selection?","explanation":"Unlike engineering, selection does not change the data; it decides which columns to keep.","concept":"Selection keeps; it does not transform.","source":"Lec 3.1, slide 43","options":["Creating new columns by combining or transforming existing ones","Rotating the data onto new orthogonal axes called components","Choosing which existing columns to keep, without changing them","Filling in missing values in the columns that will be kept"],"answer":2,"whyWrong":["That is feature engineering.","That is PCA.",null,"That is imputation."]},{"id":"L3-B07-2","lesson":3,"block":7,"topic":"Feature selection methods","type":"match","difficulty":"easy","skill":"recall","question":"Match each family of feature-selection methods to its description.","explanation":"Filters such as correlation screening are fast first passes. Wrappers search subsets with a model. Embedded methods select while training.","concept":"Filter before, wrapper around, embedded inside the model.","source":"Lec 3.1, slide 47, Lec 3.1, slide 63","pairs":[{"left":"Filter","right":"Statistical screening; fast"},{"left":"Wrapper","right":"Tries subsets of features using a model; iterative and accurate"},{"left":"Embedded","right":"Selection happens inside model training, as in regularisation"}]},{"id":"L3-B07-3","lesson":3,"block":7,"topic":"Feature selection","type":"tf","difficulty":"easy","skill":"recall","question":"Feature selection can make training and prediction faster and make models easier to explain.","explanation":"The lecture lists speed, explainability and robustness against overfitting as benefits.","concept":"Fewer, better features: faster, clearer, more robust.","source":"Lec 3.1, slide 44","answer":true},{"id":"L3-B07-4","lesson":3,"block":7,"topic":"Feature selection","type":"tf","difficulty":"medium","skill":"understanding","question":"A feature that seems irrelevant by itself can become useful in combination with other features, so selection needs judgment rather than a purely mechanical rule.","explanation":"The lecture says a feature may appear irrelevant alone but be useful in interaction with others, so selection is a decision aid.","concept":"Individual screening can miss interactions.","source":"Lec 3.1, slide 45, Lec 3.1, slide 53","answer":true},{"id":"L3-B07-5","lesson":3,"block":7,"topic":"Redundant features","type":"mcq","difficulty":"hard","skill":"scenario","question":"A model predicting household energy use includes 'floor area in m²', 'floor area in ft²', 'house colour' and 'insulation rating'. The linear model's coefficients for the two area columns change wildly between training runs. What is the best action?","explanation":"Redundant features carry overlapping information and lead to unstable coefficient estimates in linear models. Selection keeps the most representative variables and removes overlap.","concept":"Redundancy destabilises linear models.","source":"Lec 3.1, slide 45, Lec 3.1, slide 46","options":["Keep all four columns, because more features always give a model more information","Remove insulation rating, because ordinal ratings make coefficients unstable","Keep one floor-area column, check house colour for signal, and keep insulation rating","Apply PCA to house colour alone to stabilise the two area coefficients"],"answer":2,"whyWrong":["Redundant features carry the same information and make coefficients unstable.","Ordinal features can be highly relevant; the instability comes from t
