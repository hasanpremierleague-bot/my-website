he area columns.",null,"The instability comes from the duplicated area columns, not from colour."]},{"id":"L3-B08-1","lesson":3,"block":8,"topic":"Correlation-based selection","type":"mcq","difficulty":"easy","skill":"recall","question":"A feature has a Pearson correlation of -0.85 with the target. What does this indicate?","explanation":"Pearson r lies between -1 and +1. The sign gives the direction, and the magnitude |r| gives the strength.","concept":"Read r by sign for direction and |r| for strength.","source":"Lec 3.1, slide 49","options":["No relationship, because the value is negative","A weak positive association","A strong negative linear association","A strong nonlinear relationship"],"answer":2,"whyWrong":["A negative value indicates direction, not absence of a relationship.","The sign is negative and the magnitude is large.",null,"Pearson correlation measures linear association only."]},{"id":"L3-B08-2","lesson":3,"block":8,"topic":"Correlation-based selection","type":"tf","difficulty":"easy","skill":"recall","question":"A correlation coefficient near zero proves there is no relationship of any kind between two variables.","explanation":"A value near zero suggests a weak linear association. Correlation can miss nonlinear relationships.","concept":"Pearson r measures only linear association.","source":"Lec 3.1, slide 48, Lec 3.1, slide 49","answer":false},{"id":"L3-B08-3","lesson":3,"block":8,"topic":"Variance-based selection","type":"tf","difficulty":"easy","skill":"recall","question":"Features with extremely low variance are common candidates for removal.","explanation":"If values barely vary, the model has little variability to learn from. The decision should still consider domain understanding.","concept":"Low variance means little information.","source":"Lec 3.1, slide 50","answer":true},{"id":"L3-B08-4","lesson":3,"block":8,"topic":"Correlation-based selection","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why are features usually ranked by |r| (the absolute value of the correlation) rather than by r itself?","explanation":"Selection focuses on the strength of association. The sign shows only direction, and either direction can carry predictive signal.","concept":"Strength matters for selection; direction matters for interpretation.","source":"Lec 3.1, slide 48, Lec 3.1, slide 49","options":["A strong negative relationship is as useful for prediction as a strong positive one","Negative correlations are always caused by data errors","Taking the absolute value turns a nonlinear relationship into a linear one","Because r cannot be negative for numeric features"],"answer":0,"whyWrong":[null,"Negative correlations are often real, for example more failures with lower grades.","Absolute value does not change the type of relationship.","r ranges from -1 to +1."]},{"id":"L3-B08-5","lesson":3,"block":8,"topic":"Feature selection mistakes","type":"mcq","difficulty":"hard","skill":"scenario","question":"An analysis finds that 'number of library visits' has r = 0.6 with final grades, while 'hours of sleep' has r = 0.05. The administration proposes requiring library visits to raise grades and wants to drop sleep from the model. Which response best reflects the lecture?","explanation":"Common mistakes include treating correlation as causation and removing variables only because their individual correlation is small. Filters are a first screen, combined with domain reasoning.","concept":"Association is not causation, and screening is not a final verdict.","source":"Lec 3.1, slide 53","options":["Correlation is not causation, and a weak individual correlation does not prove sleep is useless","Agree with both proposals, because correlation shows which variables cause the outcome","Drop library visits instead, because high correlations usually indicate leakage","Keep sleep in the model only if its correlation with grades turns out to be negative"],"answer":0,"whyWrong":[null,"The lecture warns against confusing correlation with causation.","High correlation can indicate leakage, but here visits occur before the outcome; the issue is causal interpretation.","The sign does not decide relevance; the limits of linear screening do."]},{"id":"L3-B09-1","lesson":3,"block":9,"topic":"PCA","type":"mcq","difficulty":"easy","skill":"recall","question":"What is Principal Component Analysis (PCA)?","explanation":"PCA finds new axes (principal components) that capture as much variation as possible with fewer dimensions.","concept":"PCA rotates and projects the data.","source":"Lec 3.1, slide 55","options":["A supervised method that keeps the features most correlated with the target","A method for filling in missing values using nearby rows","A nonlinear method that learns neural network representations","A linear technique that turns features into fewer orthogonal components"],"answer":3,"whyWrong":["That describes correlation-based feature selection; PCA is usually unsupervised.","That is imputation.","PCA is linear; nonlinear methods such as UMAP are listed as future topics.",null]},{"id":"L3-B09-2","lesson":3,"block":9,"topic":"PCA","type":"tf","difficulty":"easy","skill":"recall","question":"The second principal component can point in the same direction as the first if variance remains in that direction.","explanation":"The second component captures the next largest remaining variance while staying orthogonal to the first.","concept":"Components are orthogonal, so they never duplicate a direction.","source":"Lec 3.1, slide 57, Lec 3.1, slide 60","answer":false},{"id":"L3-B09-3","lesson":3,"block":9,"topic":"PCA mathematics","type":"match","difficulty":"easy","skill":"recall","question":"Match each PCA term to its meaning.","explanation":"Eigenvectors of the covariance matrix give directions, eigenvalues give variance, loadings are the feature weights, and the explained variance ratio and scree plot help choose k.","concept":"Direction, size and weight: eigenvector, eigenvalue, loading.","source":"Lec 3.1, slide 58, Lec 3.1, slide 60, Lec 3.1, slide 61","pairs":[{"left":"Loading","right":"Weight of a feature in a component"},{"left":"Eigenvector","right":"Direction of a principal component"},{"left":"Eigenvalue","right":"Amount of variance captured along a component"},{"left":"Explained variance ratio","right":"Fraction of total variance a component captures"},{"left":"Scree plot","right":"Chart of each component's decreasing contribution"}]},{"id":"L3-B09-4","lesson":3,"block":9,"topic":"PCA","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why is standardisation usually essential before PCA?","explanation":"Because PCA looks for directions of maximum variance, a feature measured in large units would capture most of the variance purely because of its scale.","concept":"Scale first so variance reflects structure, not units.","source":"Lec 3.1, slide 56, Lec 3.1, slide 62","options":["PCA cannot run on values that are not already between 0 and 1","PCA follows variance, so large-range features would dominate the components","Standardisation turns PCA into a supervised method that uses the target","Standardisation removes the need to choose how many components to keep"],"answer":1,"whyWrong":["PCA runs on any numeric data; scaling is about fairness between features.",null,"Scaling does not involve the target.","k must still be chosen, for example from explained variance."]},{"id":"L3-B09-5","lesson":3,"block":9,"topic":"PCA mistakes","type":"mcq","difficulty":"hard","skill":"scenario","question":"An analyst applies PCA to annual income (in dollars), age (in years) and number of children without scaling. PC1 loads almost entirely on income. The analyst reports that 'PC1 represents overall prosperity and life stage'. What is the best critique?","explanation":"Applying PCA before standardisation lets large-scale variables dominate. PC1 should be interpreted from its actual loadings, not assumed.","concept":"Standardise, then inspect loadings before naming a component.","source":"Lec 3.1, slide 56, Lec 3.1, slide 62","options":["Income dominates only because of its units; standardise first, then read PC1's loadings","The interpretation is correct, because PC1 always represents an overall summary of all features","Age and number of children should be removed because they did not appear in PC1","PCA should be fitted separately on each feature"],"answer":0,"whyWrong":[null,"PC1 must not be assumed to mean anything without checking its loadings.","They did not appear because of scale, not because they lack structure.","PCA needs the features together to find shared directions."]},{"id":"L3-B10-1","lesson":3,"block":10,"topic":"Explained variance","type":"mcq","difficulty":"easy","skill":"recall","question":"What is the explained variance ratio mainly used for in PCA?","explanation":"The explained variance ratio shows what fraction of total variance each component captures, which guides the choice of k.","concept":"Keep enough components to explain enough of the variance for the task.","source":"Lec 3.1, slide 61","options":["Choosing which rows to delete","Measuring correlation with the target","Deciding how many components to retain","Encoding categorical variables"],"answer":2,"whyWrong":["PCA does not remove rows.","PCA usually does not use the target.",null,"Encoding is a separate preprocessing step."]},{"id":"L3-B10-2","lesson":3,"block":10,"topic":"PCA interpretation","type":"tf","difficulty":"easy","skill":"recall","question":"PCA loadings show the causal effect of each feature on the outcome.","explanation":"Loadings summarise covariance structure in the data; they do not represent causal effects.","concept":"Loadings describe structure, not causes.","source":"Lec 3.1, slide 59","answer":false},{"id":"L3-B10-3","lesson":3,"block":10,"topic":"PCA mathematics","type":"tf","difficulty":"easy","skill":"recall","question":"In a covariance matrix, the diagonal entries are variances and the off-diagonal entries are covariances.","explanation":"The covariance matrix summarises how variables vary together; PCA solves an eigenvalue problem on it.","concept":"Diagonal: variance; off-diagonal: covariance.","source":"Lec 3.1, slide 60","answer":true},{"id":"L3-B10-4","lesson":3,"block":10,"topic":"Explained variance","type":"mcq","difficulty":"medium","skill":"recall","question":"How does the lecture suggest choosing the number of principal components to keep?","explanation":"The explained variance ratio and the scree plot show how much each component adds. Choose k to balance compactness against information loss.","concept":"Choose k from explained variance and the task's needs.","source":"Lec 3.1, slide 56, 61","options":["Always keep exactly two components so the result can be plotted","Keep enough to explain a large share of variance; the threshold depends on the task","Keep every component, because dropping any loses all the information","Keep only the component with the smallest explained variance"],"answer":1,"whyWrong":["Two suits visualisation, but the lecture ties k to explained variance and the task.",null,"Keeping all components gives no compression.","The smallest component carries the least information."]},{"id":"L3-B10-5","lesson":3,"block":10,"topic":"PCA interpretation","type":"mcq","difficulty":"hard","skill":"scenario","question":"PCA on standardised student data gives PC1 = 0.60 × attendance + 0.50 × homework completion - 0.45 × late submissions + 0.05 × age. A student has a very high PC1 score. Which interpretation is most appropriate?","explanation":"A positive loading means the component increases with that feature; a negative loading means it decreases. Interpretation is based on the largest-magnitude loadings and is not causal.","concept":"Read loadings by sign and magnitude, and never as causes.","source":"Lec 3.1, slide 58, Lec 3.1, slide 59","options":["The student probably has many late submissions, because that loading is large","PC1 mainly measures age, because age appears in the equation","Raising PC1 will cause the student's final grade to improve","High attendance and homework completion, few late submissions; age matters little"],"answer":3,"whyWrong":["The late-submissions loading is negative, so a high PC1 goes with fewer late submissions.","Age's loading (0.05) is the smallest; interpretation follows the largest magnitudes.","Loadings summarise covariance structure; they do not describe causal effects.",null]},{"id":"L3-B11-1","lesson":3,"block":11,"topic":"Feature selection methods","type":"match","difficulty":"easy","skill":"recall","question":"Feature-selection families: match each approach to how it decides which features to keep.","explanation":"The lecture labels filter methods statistical and fast, wrapper methods iterative and accurate, and embedded methods internal to the model. Permutation importance is listed as a model-based relevance measure for later study.","concept":"Filters score, wrappers search, embedded methods select while fitting.","source":"Lec 3.1, slides 47, 63","pairs":[{"left":"Filter","right":"Ranks features with a statistic before any model is trained"},{"left":"Wrapper","right":"Trains a model on candidate subsets and compares them"},{"left":"Embedded","right":"The model selects features as part of its own training"},{"left":"Permutation importance","right":"Measures how much predictions worsen when a feature is shuffled"}]},{"id":"L3-B11-2","lesson":3,"block":11,"topic":"Feature selection methods","type":"mcq","difficulty":"easy","skill":"recall","question":"Ranking features by their correlation with the target, or removing near-zero-variance features, belongs to which family?","explanation":"Correlation-based and variance-based screening are statistical filters: quick to compute and independent of any particular model.","concept":"Statistical screening without a model is filtering.","source":"Lec 3.1, slides 47, 48, 50","options":["Wrapper methods","Embedded methods","Filter methods","Principal component analysis"],"answer":2,"whyWrong":["Wrappers train a model on subsets; correlation and variance need no model.","Embedded selection happens inside model training, such as through regularisation.",null,"PCA builds new components; it does not keep original columns."]},{"id":"L3-B11-3","lesson":3,"block":11,"topic":"Feature selection methods","type":"tf","difficulty":"easy","skill":"recall","question":"The lecture labels wrapper methods as the fastest family because they rely only on simple statistics.","explanation":"False. Filters are the fast, statistical family. Wrappers are iterative and described as more accurate, because they repeatedly train a model.","concept":"Speed belongs to filters; wrappers trade speed for model-aware accuracy.","source":"Lec 3.1, slide 47","answer":false},{"id":"L3-B11-4","lesson":3,"block":11,"topic":"Feature selection methods","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why are wrapper methods usually slower than filter methods?","explanation":"A wrapper tries subsets 'using a model', so its cost grows with the number of subsets it evaluates. A filter scores each feature once with a statistic.","concept":"Repeated model fitting is what makes wrappers expensive.","source":"Lec 3.1, slides 47, 63","options":["They compute one correlation coefficient for every feature","They train and evaluate a model for each candidate subset of features","They must always run PCA on the data before selecting","They only work with deep neural networks as the model"],"answer":1,"whyWrong":["That is what a filter does, and it is cheap.",null,"Wrappers do not depend on PCA.","Wrappers can use any model; their cost comes from repeated fitting."]},{"id":"L3-B11-5","lesson":3,"block":11,"topic":"Feature selection methods","type":"mcq","difficulty":"hard","skill":"scenario","question":"A team has 40 candidate features, only 300 rows and limited computing time. They want a quick first screen, then a model that removes useless features while it trains. Which plan fits the lectures?","explanation":"Filters are the recommended first screen because they are fast. Embedded selection 'links to regularisation': Lasso (Lecture 5.1) can set coefficients exactly to zero while fitting.","concept":"Cheap filter first, then let a regularised model finish the selection.","source":"Lec 3.1, slides 47, 53, 63; Lec 5.1, slide 26","options":["A wrapper search over every possible subset, followed by PCA","PCA first, then reading the components as the selected features","No selection at all, plus interaction terms for every pair","A filter screen first, then an embedded method such as Lasso"],"answer":3,"whyWrong":["Every subset of 40 features is about a trillion fits, and PCA does not select original features.","PCA creates new combined components; it does not keep or remove original columns.","Hundreds of interactions add complexity and overfitting risk with only 300 rows.",null]},{"id":"L3-B12-1","lesson":3,"block":12,"topic":"Leakage in selection and PCA","type":"tf","difficulty":"easy","skill":"recall","question":"To avoid leakage, the number of PCA components should be chosen using the test set's explained variance, since it represents unseen data.","explanation":"False. Everything PCA learns, including how many components to keep, must come from the training data; the test set is only transformed and scored at the end.","concept":"The test set never guides fitting decisions.","source":"Lec 3.1, slides 61, 62","answer":false},{"id":"L3-B12-2","lesson":3,"block":12,"topic":"Leakage in selection and PCA","type":"mcq","difficulty":"easy","skill":"recall","question":"Which order of steps avoids leakage when selecting features?","explanation":"Selection, encoding, scaling and PCA must all be fitted on the training data and then applied unchanged to the test data.","concept":"Fit on train, apply to test.","source":"Lec 3.1, slides 14, 39, 53","options":["Select features on all the data, then split into train and test","Split, fit the selection on the test set, then apply it to the training set","Split, then fit a separate selection on the training set and on the test set","Split, fit the selection on the training set, then apply it to the test set"],"answer":3,"whyWrong":["The test rows have then influenced which features were chosen.","The test set must stay unseen; it cannot drive any fitting.","The test set should be transformed with what was learned from training, not fitted on its own.",null]},{"id":"L3-B12-3","lesson":3,"block":12,"topic":"Leakage in selection and PCA","type":"mcq","difficulty":"easy","skill":"recall","question":"A school wants an early-warning model that predicts the final grade at the start of term. Which input would be target leakage?","explanation":"Leakage is information that would not genuinely be available when predicting. A feature derived from the target itself is the clearest case.","concept":"If it would not exist at prediction time, it cannot be an input.","source":"Lec 3.1, slides 39, 42","options":["The number of absences recorded before the prediction date","A feature computed from the final exam score being predicted","The school the student attends","Whether the student has internet access at home"],"answer":1,"whyWrong":["Absences recorded before prediction are available at that time.",null,"School is known in advance and is not derived from the outcome.","This is background information available at prediction time."]},{"id":"L3-B12-4","lesson":3,"block":12,"topic":"Leakage in selection and PCA","type":"mcq","difficulty":"medium","skill":"analysis","question":"A researcher picks the 10 features most correlated with the target using all 1,000 rows, then runs 5-fold cross-validation on those 10 features and reports a high score. Why is the score optimistic?","explanation":"Selecting on the full dataset before evaluation is the lecture's first selection mistake. Each fold's validation rows helped pick the features, so they are not truly unseen.","concept":"Selection belongs inside the training folds.","source":"Lec 3.1, slide 53","options":["The validation rows already influenced which features were chosen","Five folds are too few to give any useful estimate","Correlation cannot be used to rank features for regression","Cross-validation always overestimates performance"],"answer":0,"whyWrong":[null,"Five folds is a normal choice; the problem is where selection happened.","Correlation ranking is a valid filter; it was just fitted on the wrong rows.","Cross-validation is reliable when every fitted step stays inside the training folds."]},{"id":"L3-B12-5","lesson":3,"block":12,"topic":"Leakage in selection and PCA","type":"mcq","difficulty":"hard","skill":"scenario","question":"An analyst standardises all 395 student records, fits PCA on them, keeps 3 components, and only then splits 80/20 to train and test a model. A reviewer says the test score cannot be trusted. What is the correct fix?","explanation":"Both the scaler and PCA learned from rows that later became test data. Fitting them on the training split only, ideally inside a pipeline, keeps the test set unseen.","concept":"Pipelines keep every fitted step on the training side.","source":"Lec 3.1, slides 56, 62; Lec 2.1, slide 63","options":["Keep more principal components so less information is lost in the reduction","Skip the standardisation step so the test rows stay completely untouched","Fit scaler and PCA on the training split only, then transform the test split","Fit a separate PCA on the test split so it gets its own components"],"answer":2,"whyWrong":["Keeping more components changes information loss, not leakage.","PCA needs standardisation, and the PCA fit itself would still leak.",null,"The test data must be projected onto the components learned from training."]},{"id":"L3-B13-1","lesson":3,"block":13,"topic":"Good and bad features","type":"match","difficulty":"easy","skill":"recall","question":"The lecture's checklist for a good feature: match each quality to what it means.","explanation":"These four qualities describe a feature worth keeping: informative, non-duplicative, broadly useful and cheap to produce when predicting.","concept":"Good features are informative, distinct, portable and cheap.","source":"Lec 3.1, slide 37","pairs":[{"left":"High correlation","right":"Closely related to the target"},{"left":"Low redundancy","right":"Does not repeat information already in other columns"},{"left":"Model agnostic","right":"Useful across different types of algorithms"},{"left":"Computationally efficient","right":"Easy to calculate at prediction time"}]},{"id":"L3-B13-2","lesson":3,"block":13,"topic":"Good and bad features","type":"match","difficulty":"easy","skill":"recall","question":"Warning signs of a bad feature: match each one to its description.","explanation":"The lecture names leakage as the most dangerous, followed by constant, sparse and overly specific features such as Student ID.","concept":"Leakage is the most dangerous bad feature.","source":"Lec 3.1, slides 38, 39","pairs":[{"left":"Constant","right":"Every row has the same value"},{"left":"Sparse","right":"Almost all rows are zero or empty"},{"left":"Overfitting","right":"So specific that it identifies individual training rows"},{"left":"Leaky","right":"Uses information not available at prediction time"}]},{"id":"L3-B13-3","lesson":3,"block":13,"topic":"Domain knowledge","type":"tf","difficulty":"easy","skill":"recall","question":"The lecture says strong engineered features usually come from blind trial and error over many transformations.","explanation":"False. Strong features usually come from understanding the domain, for example asking what a teacher or advisor would consider informative.","concept":"Domain understanding beats blind search.","source":"Lec 3.1, slide 36","answer":false},{"id":"L3-B13-4","lesson":3,"block":13,"topic":"Good and bad features","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why must an engineered feature be available at prediction time?","explanation":"A model trained with a feature it will not have when deployed shows unrealistically good test results, then fails in use. The transformation must be reproducible and available at prediction time.","concept":"Train only on what you will have when predicting.","source":"Lec 3.1, slides 21, 42","options":["Features computed later are always less accurate than earlier ones","Features that are available at prediction time never need scaling","A deployed model cannot use a value that does not exist yet when it must predict","Only features available at prediction time can be one-hot encoded"],"answer":2,"whyWrong":["Accuracy is not the issue; availability is.","Availability has nothing to do with scaling needs.",null,"Encoding is possible for any categorical column; the issue is using it in deployment."]},{"id":"L3-B13-5","lesson":3,"block":13,"topic":"Good and bad features","type":"mcq","difficulty":"hard","skill":"scenario","question":"A gym wants to predict which members will cancel next month. Proposed features: (a) average visits per week over the last three months, (b) whether the member has already submitted a cancellation form, (c) member ID, (d) country, which is 'Bahrain' for every member. Which feature should be kept?","explanation":"Recent visit frequency is meaningful, available before the outcome, and not an identifier. The other three are leaky, overfitting and constant features from the lecture's warning list.","concept":"Check each feature against leakage, identifiers and zero variance.","source":"Lec 3.1, slides 36, 37, 38","options":["The cancellation-form flag, since it predicts cancellation best","Average visits per week over the last three months","Member ID, since it is different for every single member","Country, since it is complete with no missing values at all"],"answer":1,"whyWrong":["It records the outcome itself, so it leaks the target.",null,"A unique identifier lets the model memorise members; it is an overfitting feature.","Every row is the same, so it has zero variance and adds nothing."]},{"id":"L3-B14-1","lesson":3,"block":14,"topic":"Difference features","type":"mcq","difficulty":"easy","skill":"recall","question":"In the Student Performance example, what does a positive grade_progress (G2 − G1) indicate?","explanation":"grade_progress captures academic momentum: positive means improvement, negative means decline, zero means stability.","concept":"Positive progress means improvement.","source":"Lec 3.1, slide 22, 25","options":["The student's grades declined between the two periods","The student's final grade G3 is certain to be high","The student improved between the first and second periods","The student had the same grade in both periods"],"answer":2,"whyWrong":["Decline gives a negative value.","Progress suggests momentum; it does not guarantee G3.",null,"Equal grades give zero."]},{"id":"L3-B14-2","lesson":3,"block":14,"topic":"Interaction features","type":"mcq","difficulty":"easy","skill":"recall","question":"What does the interaction feature study_effect = studytime × G2 allow a linear model to capture?","explanation":"An interaction feature models the idea that one variable's effect depends on another, letting a linear model capture conditional relationships.","concept":"Interactions model 'it depends'.","source":"Lec 3.1, slide 28","options":["That study time and G2 are the same variable measured twice","That study time has no effect on the final grade at all","That G2 must be one-hot encoded before training","That study time's effect can depend on the current grade"],"answer":3,"whyWrong":["They are different variables; the product links them.","The feature exists to model an effect, not remove it.","G2 is numeric; the interaction does not require encoding.",null]},{"id":"L3-B14-3","lesson":3,"block":14,"topic":"Categorical and ordinal features","type":"tf","difficulty":"easy","skill":"recall","question":"Running pd.get_dummies(df['school'], prefix='school') on a column whose values are GP and MS produces two indicator columns, school_GP and school_MS.","explanation":"True. One-hot encoding creates one indicator column per category, named with the given prefix.","concept":"One-hot gives one column per category.","source":"Lec 3.1, slides 34, 41","answer":true},{"id":"L3-B14-4","lesson":3,"block":14,"topic":"Difference features","type":"mcq","difficulty":"medium","skill":"understanding","question":"Two students both have grade_progress = 0: one has G1 = G2 = 17 and the other has G1 = G2 = 7. What does the lecture conclude from cases like this?","explanation":"The same progress value can come from very different situations, so an engineered feature is most useful combined with complementary variables like G2 or avg_early_grade.","concept":"Engineered features often need context from level features.","source":"Lec 3.1, slide 23","options":["The two students should be expected to get the same final grade","grade_progress should be read together with a level feature such as G2","grade_progress is useless and should be removed from the model","The feature has an error, because two students share one value"],"answer":1,"whyWrong":["Equal progress hides very different grade levels.",null,"It still captures momentum; it is just incomplete on its own.","Different students can legitimately have the same engineered value."]},{"id":"L3-B14-5","lesson":3,"block":14,"topic":"PCA interpretation","type":"mcq","difficulty":"hard","skill":"scenario","question":"PCA on standardised G1, G2, studytime, failures and absences gives PC1 with large positive loadings on G1 and G2, a moderate negative loading on failures, and a near-zero loading on absences. A colleague says: 'PC1 is proven to be student ability, and it shows failures cause lower grades.' What is the best response?","explanation":"Read PC1 from its largest loadings: strong early grades and few failures. The lecture warns that PC1 should not be assumed to be 'ability' without checking, and that loadings summarise covariance, not causal effects.","concept":"Interpret components from loadings; never read them as causes.","source":"Lec 3.1, slides 58, 59, 62","options":["PC1 tracks strong grades and few failures, but it isn't proven 'ability' and loadings aren't causal","The colleague is right, because PC1 always captures the most important real-world concept","PC1 mainly measures absences, because absences appears in the component","PC1 is meaningless, because components can never be interpreted at all"],"answer":0,"whyWrong":[null,"The lecture warns against assuming what PC1 means without checking the loadings.","Its near-zero loading means absences contributes very little.","Components can be interpreted from their largest-magnitude loadings."]},{"id":"L3-X1","lesson":3,"block":0,"topic":"PCA mistakes","type":"mcq","difficulty":"medium","skill":"analysis","question":"Which practice is a mistake when using PCA in a model-evaluation workflow?","explanation":"Full-data PCA lets the test set influence the components, which leaks information. PCA should be fitted on training data only.","concept":"Every fitted transformation, PCA included, is fitted on training data only.","source":"Lec 3.1, slide 62","options":["Standardising the features before applying PCA","Inspecting loadings before naming a component","Using explained variance to choose the number of components","Fitting PCA on the full dataset before splitting it"],"answer":3,"whyWrong":["Standardising first is the recommended practice.","Inspecting loadings is recommended.","This is the recommended way to choose k.",null]},{"id":"L3-X2","lesson":3,"block":0,"topic":"Feature selection vs PCA","type":"tf","difficulty":"easy","skill":"recall","question":"Feature selection usually keeps interpretability high, while PCA often lowers direct interpretability.","explanation":"Selection keeps original variables; PCA creates weighted combinations that are harder to interpret directly.","concept":"Selection keeps meaning; PCA trades meaning for compactness.","source":"Lec 3.1, slide 54","answer":true},{"id":"L3-X3","lesson":3,"block":0,"topic":"PCA","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why can PCA help when a dataset has strongly correlated (multicollinear) features?","explanation":"Correlated features carry overlapping information. PCA re-expresses them as orthogonal components ordered by variance, which removes the duplication.","concept":"Orthogonal components cannot overlap.","source":"Lec 3.1, slide 56, Lec 3.1, slide 60","options":["Because PCA deletes every feature that is correlated with another","Because PCA uses the target to choose which correlated feature to keep","Because PCA makes every feature's variance exactly equal to 1","Its components are orthogonal, so they do not duplicate the same direction of variation"],"answer":3,"whyWrong":["PCA does not delete features; it combines them into new components.","PCA is usually unsupervised and does not use the target.","That describes standardisation, not PCA.",null]},{"id":"L3-X4","lesson":3,"block":0,"topic":"Feature selection","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why does the lecture call feature selection 'a decision aid rather than a purely mechanical rule'?","explanation":"A feature can look irrelevant alone but be useful in an interaction, and a relevant feature may still be excluded if it is not available when predicting. Judgment is needed alongside the numbers.","concept":"Selection scores guide judgment; they do not replace it.","source":"Lec 3.1, slides 45, 53","options":["Because statistical scores are always wrong for real data","Because selection should be repeated until only one feature is left","Weak features can help in combination, and relevance depends on the scenario","Because feature selection changes the values inside each column"],"answer":2,"whyWrong":["Scores are useful guides; they just are not the whole story.","The aim is a useful subset, not a single feature.",null,"Selection keeps or drops columns; it does not change their values."]},{"id":"L4-B01-1","lesson":4,"block":1,"topic":"Types of classification","type":"mcq","difficulty":"easy","skill":"application","question":"A photo app attaches every tag that applies to a picture, such as 'beach', 'sunset' and 'family' at the same time. What type of classification is this?","explanation":"Multi-label classification assigns several labels to one instance, like tagging a photo with more than one tag.","concept":"Count how many labels one instance can receive.","source":"Lec 4.1, slide 6","options":["Binary classification","Multiclass classification","Multi-label classification","Regression"],"answer":2,"whyWrong":["Binary classification chooses one of exactly two classes.","Multiclass assigns exactly one label from more than two classes.",null,"Regression predicts a continuous number, not labels."]},{"id":"L4-B01-2","lesson":4,"block":1,"topic":"What classification is","type":"tf","difficulty":"easy","skill":"recall","question":"Classification maps input features to a continuous numeric output.","explanation":"Classification maps inputs to a discrete set of categorical labels. Continuous outputs are the job of regression.","concept":"Classification outputs categories; regression outputs numbers.","source":"Lec 4.1, slide 4","answer":false},{"id":"L4-B01-3","lesson":4,"block":1,"topic":"Classification workflow","type":"match","difficulty":"easy","skill":"recall","question":"Match each step of the classification workflow to what happens in it.","explanation":"The workflow moves from preparing data, to choosing predictors, to training, to evaluating on data the model has not seen.","concept":"Prepare, select, train, evaluate.","source":"Lec 4.1, slide 5","pairs":[{"left":"Data preprocessing","right":"Handle missing values and encode variables"},{"left":"Feature selection","right":"Identify relevant predictors"},{"left":"Model induction","right":"Train the classifier on labelled data"},{"left":"Model evaluation","right":"Test on unseen data using metrics"}]},{"id":"L4-B01-4","lesson":4,"block":1,"topic":"Classification workflow","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why is a classifier evaluated on a test set that was not used for training?","explanation":"A model can memorise training data. Testing on unseen data shows how it will perform on new cases.","concept":"Judge a model on data it has never seen.","source":"Lec 4.1, slide 5","options":["Because the training set is too small to compute accuracy on","To estimate performance on new data, since training performance is optimistic","Because the test set contains the most important classes","Because scikit-learn cannot evaluate a model on its training data"],"answer":1,"whyWrong":["Accuracy can be computed on any set; the point is to measure generalisation.",null,"A test set is a held-out sample, not a set of special classes.","It is possible; it just gives an over-optimistic result."]},{"id":"L4-B01-5","lesson":4,"block":1,"topic":"Types of classification","type":"mcq","difficulty":"hard","skill":"scenario","question":"A news platform needs three models. (a) Assign each article exactly one section: sport, politics, technology or health. (b) Mark each reader comment as spam or not spam. (c) Attach any number of the tags 'video', 'breaking', 'opinion' and 'local' to each article. Which description is correct?","explanation":"Binary has two exclusive classes, multiclass has more than two exclusive classes, and multi-label allows several labels per instance.","concept":"Ask: how many classes, and can an instance have more than one?","source":"Lec 4.1, slide 6","options":["(a) multi-label, (b) binary, (c) multiclass","(a) multiclass, (b) multiclass, (c) multi-label","(a) binary, (b) binary, (c) multiclass","(a) multiclass, (b) binary, (c) multi-label"],"answer":3,"whyWrong":["Each article gets exactly one section in (a), and (c) allows several tags at once.","Spam vs not spam has exactly two exclusive classes, so it is binary.","(a) has four classes, and (c) allows more than one label per article.",null]},{"id":"L4-B02-1","lesson":4,"block":2,"topic":"Sigmoid function","type":"mcq","difficulty":"easy","skill":"recall","question":"What range does the sigmoid function's output always fall in?","explanation":"The sigmoid squashes any real-valued z into (0, 1), so its output can be read as a probability.","concept":"Sigmoid turns a score into a probability.","source":"Lec 4.1, slide 8, 9","options":["Between −1 and 1","Any real number","Between 0 and 1","Only exactly 0 or exactly 1"],"answer":2,"whyWrong":["That range belongs to other functions; sigmoid outputs probabilities.","That is the input z, not the sigmoid output.",null,"Sigmoid gives a smooth probability; the threshold makes the 0/1 decision."]},{"id":"L4-B02-2","lesson":4,"block":2,"topic":"Sigmoid function","type":"tf","difficulty":"easy","skill":"recall","question":"The sigmoid function maps any real-valued input to a value between 0 and 1, which can be read as a probability.","explanation":"Logistic regression applies the sigmoid to the linear output so that predictions are probabilities.","concept":"Sigmoid turns a score into a probability.","source":"Lec 4.1, slide 8","answer":true},{"id":"L4-B02-3","lesson":4,"block":2,"topic":"Logit and log-odds","type":"mcq","difficulty":"easy","skill":"recall","question":"What does logistic regression model as a linear combination of the features?","explanation":"The logit, the inverse of the sigmoid, is the log of the odds. Logistic regression models it as a linear function, so a coefficient is the change in log-odds per unit change in its feature.","concept":"Linear in log-odds, sigmoid to probability.","source":"Lec 4.1, slide 10","options":["The probability itself, directly","The squared error","The log-odds of the positive class","The class label as 0 or 1 directly"],"answer":2,"whyWrong":["The probability comes from applying the sigmoid to the linear combination.","Squared error is a regression cost, not what is modelled.",null,"Fitting labels directly with a linear model is the problem logistic regression avoids."]},{"id":"L4-B02-4","lesson":4,"block":2,"topic":"Why not linear regression","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why is linear regression a poor choice for a classification task?","explanation":"Linear regression is designed for continuous values, so its outputs are not valid probabilities, and extreme points move the line.","concept":"Classification needs bounded probabilities.","source":"Lec 4.1, slide 7","options":["It cannot be trained on numeric features, only on categorical ones","Its outputs are not bounded between 0 and 1, and outliers shift the boundary","It always produces exactly 0 or 1, so it gives no probabilities","It needs the sigmoid function during training, which is too slow"],"answer":1,"whyWrong":["Linear regression is trained on numeric features.",null,"It produces continuous values, which is the problem.","Linear regression does not use a sigmoid; logistic regression does."]},{"id":"L4-B02-5","lesson":4,"block":2,"topic":"Logistic regression","type":"mcq","difficulty":"hard","skill":"scenario","question":"A fraud model outputs a probability of 0.69 for a transaction, with a 0.5 threshold. Feature x2 has coefficient −1.2. A junior analyst writes: 'It is not flagged, and each extra unit of x2 lowers the fraud probability by exactly 1.2.' What is correct?","explanation":"0.69 is above 0.5, so the transaction is flagged. Logistic regression models log-odds linearly, so a coefficient is the change in log-odds per unit change in the feature, not a fixed change in probability.","concept":"Coefficients act on log-odds; the threshold makes the decision.","source":"Lec 4.1, slides 9, 10, 12","options":["It is not flagged, because 0.69 is below the 1.0 needed for certainty","It is flagged, and the probability really does fall by exactly 1.2 per unit","Nothing can be concluded, because logistic regression has no threshold","It is flagged as fraud; −1.2 is the change in log-odds per unit of x2, not in probability"],"answer":3,"whyWrong":["The decision uses the 0.5 threshold, not certainty.","A probability cannot fall by 1.2; coefficients act on log-odds.","Classification applies a threshold to the probability.",null]},{"id":"L4-B03-1","lesson":4,"block":3,"topic":"Log loss","type":"tf","difficulty":"easy","skill":"recall","question":"Logistic regression uses mean squared error as its cost function because MSE is convex for logistic outputs.","explanation":"MSE is non-convex for logistic regression, so binary cross-entropy (log loss) is used instead.","concept":"Logistic regression is trained with log loss.","source":"Lec 4.1, slide 13","answer":false},{"id":"L4-B03-2","lesson":4,"block":3,"topic":"Log loss","type":"mcq","difficulty":"easy","skill":"recall","question":"Under log loss, what happens when the true label is 1 but the model predicts a probability close to 0?","explanation":"Log loss heavily punishes confident wrong predictions, which pushes the model toward well-calibrated probabilities.","concept":"Confident mistakes cost the most.","source":"Lec 4.1, slide 13","options":["The cost becomes 0","The cost is capped at 1","The example is ignored during training","The cost becomes very large"],"answer":3,"whyWrong":["Cost is 0 only when the prediction matches the label confidently.","Log loss is not capped; it grows without bound as the prediction approaches the wrong extreme.","Every example contributes to the cost.",null]},{"id":"L4-B03-3","lesson":4,"block":3,"topic":"Training logistic regression","type":"tf","difficulty":"easy","skill":"recall","question":"The gradient-descent update for logistic regression has the same form as the update for linear regression.","explanation":"The lecture notes that the update rule looks identical: theta is reduced by alpha times the gradient X^T(y_pred - y)/m, where y_pred now comes from the sigmoid.","concept":"Same update form; different prediction function.","source":"Lec 4.1, slide 14","answer":true},{"id":"L4-B03-4","lesson":4,"block":3,"topic":"Logistic regression","type":"mcq","difficulty":"medium","skill":"recall","question":"Why does logistic regression use log loss (binary cross-entropy) instead of mean squared error as its cost?","explanation":"The lecture says standard MSE is non-convex for logistic regression, so it uses log loss, minimised with gradient descent using an update that looks like linear regression's.","concept":"Log loss keeps the logistic cost convex.","source":"Lec 4.1, slides 13, 14","options":["Because MSE can only be computed for classification tasks","Because log loss ignores how confident the predictions are","Because log loss does not need gradient descent to optimise","With the sigmoid, MSE is non-convex; log loss is not"],"answer":3,"whyWrong":["MSE is a regression metric; the issue is its shape with the sigmoid.","Log loss heavily penalises confident wrong predictions.","Log loss is minimised with gradient descent.",null]},{"id":"L4-B03-5","lesson":4,"block":3,"topic":"Choosing a classifier","type":"mcq","difficulty":"hard","skill":"scenario","question":"A bank must explain to regulators why each loan application is rejected. The data are tabular and the relationship between features and default appears roughly linear. The team needs a first model that is fast and easy to interpret. Which choice best fits the lecture?","explanation":"The lecture lists logistic regression's strengths as interpretable coefficients, efficiency on linear data, and use as a baseline for classification.","concept":"Start with an interpretable baseline before adding complexity.","source":"Lec 4.1, slide 15","options":["K-nearest neighbours, because it has no training phase","An unconstrained decision tree grown until every leaf is pure","XGBoost first, because it wins most competitions","Logistic regression as an interpretable, efficient baseline"],"answer":3,"whyWrong":["KNN stores the whole training set and gives no coefficients to explain decisions.","Unpruned trees overfit and become hard to justify as a stable rule set.","Boosted ensembles can be accurate but are less directly interpretable; the lecture presents logistic regression as the baseline.",null]},{"id":"L4-B04-1","lesson":4,"block":4,"topic":"K-nearest neighbours","type":"mcq","difficulty":"easy","skill":"recall","question":"Why is KNN called a 'lazy learner'?","explanation":"KNN is lazy and non-parametric: it keeps all training data and makes decisions at inference time.","concept":"KNN learns nothing up front; it compares at prediction time.","source":"Lec 4.1, slide 16","options":["It needs fewer features than other classification models","It always predicts the majority class of the training set","It only ever looks at one neighbour when it predicts","It stores the training data and does its work only at prediction time"],"answer":3,"whyWrong":["Laziness refers to when computation happens, not feature count.","KNN predicts from the nearest neighbours, not the overall majority.","K can be any value.",null]},{"id":"L4-B04-2","lesson":4,"block":4,"topic":"Distance metrics","type":"mcq","difficulty":"easy","skill":"recall","question":"Which distance metric represents the straight-line, 'as the crow flies' distance between two points?","explanation":"Euclidean distance is the most common KNN metric and measures straight-line distance.","concept":"Euclidean = straight line; Manhattan = city blocks.","source":"Lec 4.1, slide 17","options":["Manhattan distance","Euclidean distance","Gini impurity","Log loss"],"answer":1,"whyWrong":["Manhattan sums absolute differences, like walking city blocks.",null,"Gini measures node impurity in trees, not distance.","Log loss is a cost function for classification."]},{"id":"L4-B04-3","lesson":4,"block":4,"topic":"Distance metrics","type":"tf","difficulty":"easy","skill":"recall","question":"Manhattan distance is computed by summing the absolute differences of the coordinates.","explanation":"Manhattan (L1, city-block) distance adds |p_i - q_i| across all dimensions.","concept":"Manhattan moves along the grid; Euclidean cuts across.","source":"Lec 4.1, slide 18","answer":true},{"id":"L4-B04-4","lesson":4,"block":4,"topic":"K-nearest neighbours","type":"mcq","difficulty":"medium","skill":"recall","question":"What is a practical drawback of KNN on a very large training set?","explanation":"KNN stores the whole training set and computes distances at prediction time, which is costly for large data. The lecture mentions index structures such as BallTree or KDTree to speed this up.","concept":"KNN is cheap to train and expensive to query.","source":"Lec 4.1, slides 16, 22","options":["Training takes days because KNN fits millions of weights","It cannot handle more than two classes in its predictions","Each prediction is slow, since distances to all stored points are computed","It always underfits, whatever value of K is chosen"],"answer":2,"whyWrong":["KNN has no training phase and no weights.","KNN works for multiclass problems by majority vote.",null,"Small K actually tends to overfit."]},{"id":"L4-B04-5","lesson":4,"block":4,"topic":"K-nearest neighbours","type":"mcq","difficulty":"hard","skill":"scenario","question":"A fruit-sorting machine uses KNN on scaled sweetness and crunchiness. For a new fruit, the single closest training point is blue, but the next two closest are both red. What does the machine predict with K = 3, and with K = 1?","explanation":"KNN predicts by majority vote among the K nearest neighbours. Small K follows the closest point (sensitive, high variance); larger K smooths the decision.","concept":"K controls how many neighbours vote.","source":"Lec 4.1, slides 16, 19","options":["Red with K = 3 (two of three votes); blue with K = 1","Blue in both cases, because the closest point always decides","Red in both cases, because red is the majority overall","No prediction, because KNN must be retrained for each K"],"answer":0,"whyWrong":[null,"With K = 3 the three neighbours vote, and red wins 2 to 1.","With K = 1 only the single closest point counts.","KNN has no training phase; K only changes how many neighbours vote."]},{"id":"L4-B05-1","lesson":4,"block":5,"topic":"Choosing K","type":"mcq","difficulty":"easy","skill":"recall","question":"Why is an odd value of K recommended for binary classification?","explanation":"With two classes and an odd number of voters, one class always wins.","concept":"Odd K, no ties.","source":"Lec 4.1, slide 19","options":["Because even values of K cannot be computed","To avoid ties in the vote","Because odd K always gives higher accuracy","Because odd K removes the need for scaling"],"answer":1,"whyWrong":["Even K values can be computed; they just allow ties.",null,"Odd K prevents ties; it does not guarantee higher accuracy.","Scaling is still required for distance-based models."]},{"id":"L4-B05-2","lesson":4,"block":5,"topic":"Choosing K","type":"tf","difficulty":"easy","skill":"recall","question":"A very small K, such as K = 1, gives a smooth decision boundary and high bias.","explanation":"Small K gives a complex boundary, high sensitivity to outliers and high variance (overfitting). Large K gives a smooth boundary and high bias.","concept":"Small K overfits; large K underfits.","source":"Lec 4.1, slide 19","answer":false},{"id":"L4-B05-3","lesson":4,"block":5,"topic":"Feature scaling for KNN","type":"tf","difficulty":"easy","skill":"recall","question":"Scaling is essential for KNN because a feature with a much larger range would dominate the distance.","explanation":"The lecture's example: income from $0 to $1M would overshadow age from 18 to 90 entirely.","concept":"Distance-based models need comparable feature scales.","source":"Lec 4.1, slide 20, Lec 4.1, slide 23","answer":true},{"id":"L4-B05-4","lesson":4,"block":5,"topic":"Curse of dimensionality","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why does KNN struggle when the number of features becomes very large?","explanation":"As dimensions increase, volume grows exponentially, points become equidistant, and much more data is needed to keep density. Dimensionality reduction such as PCA helps.","concept":"In high dimensions, 'near' and 'far' blur together.","source":"Lec 4.1, slide 24","options":["KNN cannot store more than a few features in memory","Points become almost equally distant, so 'nearest' stops meaning local","More features always remove the need for scaling","KNN automatically switches to Manhattan distance in high dimensions"],"answer":1,"whyWrong":["Memory grows, but the core problem is that distances lose meaning.",null,"Scaling is still needed; more features make the problem worse.","No automatic switch happens."]},{"id":"L4-B05-5","lesson":4,"block":5,"topic":"K-nearest neighbours","type":"mcq","difficulty":"hard","skill":"scenario","question":"A KNN churn model uses income (range $0 to $1,000,000), number of support calls (0 to 10) and 300 one-hot product columns. Accuracy is poor, and nearly every prediction seems driven by income. Which plan best follows the lecture?","explanation":"Unscaled large-range features dominate distance, and very many dimensions make neighbours less meaningful. Scaling, dimensionality reduction and K tuning address both.","concept":"Fix scale and dimensionality before tuning anything else in KNN.","source":"Lec 4.1, slide 19, Lec 4.1, slide 23, Lec 4.1, slide 24","options":["Set K = 1 so that the model captures more local detail","Add more one-hot columns so the model has more information","Scale the features, reduce the dimensionality and then tune K","Skip scaling, because KNN is non-parametric and has no weights"],"answer":2,"whyWrong":["K = 1 increases variance and does nothing about scale or dimensionality.","More dimensions worsen the curse of dimensionality.",null,"Non-parametric does not mean scale-free; distances depend directly on feature ranges."]},{"id":"L4-B06-1","lesson":4,"block":6,"topic":"Decision trees","type":"match","difficulty":"easy","skill":"recall","question":"Label the parts of a decision tree: match each term to its role.","explanation":"A tree splits data by feature tests from the root through internal nodes to leaves. Pruning keeps it from growing until it memorises noise.","concept":"Trees ask questions from the root down to answers at the leaves.","source":"Lec 4.1, slide 25, Lec 4.1, slide 29","pairs":[{"left":"Root node","right":"The top-level split"},{"left":"Internal node","right":"A later decision based on a feature test"},{"left":"Leaf","right":"A predicted outcome"},{"left":"Pruning","right":"Limiting or removing branches to reduce overfitting"}]},{"id":"L4-B06-2","lesson":4,"block":6,"topic":"Gini impurity","type":"mcq","difficulty":"easy","skill":"recall","question":"What is the Gini impurity of a perfectly pure node, where every sample is the same class?","explanation":"Gini = 1 − Σp². A pure node has one class with p = 1, so Gini = 0; a 50/50 binary node gives 0.5.","concept":"Pure node, zero impurity.","source":"Lec 4.1, slide 32","options":["0.5","0","1","It cannot be computed for a pure node"],"answer":1,"whyWrong":["0.5 is the Gini of a 50/50 binary node, the most mixed case.",null,"Gini for two classes never reaches 1.","It can: the formula gives 0."]},{"id":"L4-B06-3","lesson":4,"block":6,"topic":"Entropy","type":"tf","difficulty":"easy","skill":"recall","question":"A node with entropy 0 is perfectly mixed between classes.","explanation":"Entropy 0 means the node is perfectly pure (all one class). For two balanced classes, entropy is 1.","concept":"Entropy measures disorder: 0 pure, 1 maximally mixed for two classes.","source":"Lec 4.1, slide 26","answer":false},{"id":"L4-B06-4","lesson":4,"block":6,"topic":"Pruning","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why does an unconstrained decision tree tend to overfit?","explanation":"Pre-pruning (max_depth, min_samples_split, min_samples_leaf) or post-pruning limits growth so the tree learns general patterns.","concept":"Purity at every leaf usually means memorisation.","source":"Lec 4.1, slide 29","options":["It splits until every leaf is pure, so it models noise in the training data","It cannot split on numeric features, so it memorises categories","It stops after a single split, which makes it memorise the data","It uses Gini instead of entropy, which is known to overfit"],"answer":0,"whyWrong":[null,"Trees split on numeric and categorical features.","That describes a stump, which underfits rather than overfits.","Gini and entropy usually give similar results; neither causes overfitting by itself."]},{"id":"L4-B06-5","lesson":4,"block":6,"topic":"Information gain","type":"mcq","difficulty":"hard","skill":"scenario","question":"A loan-approval tree must choose its next split. Split A leaves both child nodes almost as mixed as the parent. Split B produces children that are each mostly one class. Which split does information gain prefer, and why?","explanation":"Information gain is the drop in entropy from parent to children. Purer children mean a bigger drop, so the tree chooses split B.","concept":"Trees pick the split that makes children purest.","source":"Lec 4.1, slides 26, 27","options":["Split B, because its children are purer, so entropy falls more","Split A, because evenly mixed children keep the tree balanced","Split A, because higher child entropy means more information gained","Neither, because a split is only allowed if the children are completely pure"],"answer":0,"whyWrong":[null,"Balance is not the criterion; reduction in impurity is.","Gain is parent entropy minus child entropy, so higher child entropy means less gain.","Splits only need to reduce impurity, not remove it."]},{"id":"L4-B07-1","lesson":4,"block":7,"topic":"Confusion matrix","type":"match","difficulty":"easy","skill":"recall","question":"A confusion matrix has four cells. Match each cell to what it counts.","explanation":"The first word says whether the prediction was right; the second says what was predicted.","concept":"Right or wrong, then predicted positive or negative.","source":"Lec 4.1, slide 33","pairs":[{"left":"True positive","right":"Predicted positive, actually positive"},{"left":"True negative","right":"Predicted negative, actually negative"},{"left":"False positive (Type I error)","right":"Predicted positive, actually negative"},{"left":"False negative (Type II error)","right":"Predicted negative, actually positive"}]},{"id":"L4-B07-2","lesson":4,"block":7,"topic":"Precision and recall","type":"mcq","difficulty":"easy","skill":"recall","question":"Which question does precision answer?","explanation":"Precision = TP / (TP + FP). Recall = TP / (TP + FN).","concept":"Precision looks at predicted positives; recall looks at actual positives.","source":"Lec 4.1, slide 34","options":["When the model predicts positive, how often is it right?","Of all actual positives, how many did the model find?","What fraction of all predictions were correct?","How well does the model separate the classes across all thresholds?"],"answer":0,"whyWrong":[null,"That is recall (sensitivity).","That is accuracy.","That is ROC-AUC."]},{"id":"L4-B07-3","lesson":4,"block":7,"topic":"ROC and AUC","type":"tf","difficulty":"easy","skill":"recall","question":"An AUC of 0.5 means the classifier separates the classes no better than random guessing.","explanation":"AUC = 1 means perfect separation; AUC = 0.5 means no better than random.","concept":"AUC summarises separation across all thresholds.","source":"Lec 4.1, slide 36","answer":true},{"id":"L4-B07-4","lesson":4,"block":7,"topic":"Precision and recall","type":"mcq","difficulty":"medium","skill":"application","question":"A cancer-screening model must miss as few real cases as possible, even if it raises some false alarms. Which metric should be prioritised?","explanation":"Recall asks how many actual positives were caught. Missing a real case is a false negative, which recall directly penalises.","concept":"Costly misses call for high recall.","source":"Lec 4.1, slides 33, 34","options":["Precision","Accuracy","Specificity of the negative class only","Recall"],"answer":3,"whyWrong":["Precision limits false alarms; here missed cases are the bigger worry.","Accuracy can look high while missing many rare positive cases.","This focuses on negatives, not on catching positives.",null]},{"id":"L4-B07-5","lesson":4,"block":7,"topic":"Accuracy and imbalance","type":"mcq","difficulty":"hard","skill":"scenario","question":"A screening model for a rare condition (1% of patients) predicts 'healthy' for every patient and reports 99% accuracy. The hospital wants to deploy it. What is the best evaluation response?","explanation":"With 99% negatives, predicting the majority class gives 99% accuracy and zero recall. F1, per-class metrics in the classification report, and AUC reveal the problem.","concept":"On imbalanced data, look beyond accuracy.","source":"Lec 4.1, slide 35, Lec 4.1, slide 37","options":["Deploy it, because 99% accuracy is an excellent result for any screening model","Report precision alone, because it is the most important metric for screening","Increase the test set size until the measured accuracy reaches 100%","Accuracy hides the imbalance: recall is 0, so check per-class metrics, F1 and AUC"],"answer":3,"whyWrong":["The model never detects a single case; accuracy hides this because the classes are imbalanced.","Precision is undefined or meaningless when the model never predicts positive; recall shows the failure.","More data would not change the fact that the model finds no positives.",null]},{"id":"L4-B08-1","lesson":4,"block":8,"topic":"Ensemble intuition","type":"mcq","difficulty":"easy","skill":"recall","question":"What must be true of base models for an ensemble to be effective?","explanation":"Diversity can come from different algorithms, different training data (bagging) or different feature sets.","concept":"Errors that differ can cancel; errors that match cannot.","source":"Lec 4.1, slide 39","options":["They must all be identical copies of the best model","They must each be more accurate than any single strong model","They must all use the same features and data","They must be diverse, making uncorrelated errors"],"answer":3,"whyWrong":["Identical models make the same mistakes, so combining them adds nothing.","Ensembles combine weak learners into a strong one.","Different data or features are ways to create diversity.",null]},{"id":"L4-B08-2","lesson":4,"block":8,"topic":"Ensemble archetypes","type":"match","difficulty":"easy","skill":"recall","question":"Match each ensemble type to how it combines models.","explanation":"These four archetypes differ in whether models are trained in parallel or in sequence and how their outputs are combined.","concept":"Parallel diversity, sequential correction, or learned combination.","source":"Lec 4.1, slide 40, Lec 4.1, slide 59","pairs":[{"left":"Voting","right":"Combines different models trained on the same data"},{"left":"Bagging","right":"Trains learners in parallel on random bootstrap samples"},{"left":"Boosting","right":"Trains learners in sequence, each correcting the previous errors"},{"left":"Stacking","right":"A meta-model learns how to combine base models' predictions"}]},{"id":"L4-B08-3","lesson":4,"block":8,"topic":"Ensemble intuition","type":"tf","difficulty":"easy","skill":"understanding","question":"If all the base models in an ensemble make the same mistakes, combining them will cancel those mistakes out.","explanation":"Errors cancel only when models make uncorrelated errors. Models that err together keep the same errors after voting.","concept":"Diversity is what lets an ensemble beat its members.","source":"Lec 4.1, slide 38, Lec 4.1, slide 39","answer":false},{"id":"L4-B08-4","lesson":4,"block":8,"topic":"Soft and hard voting","type":"mcq","difficulty":"medium","skill":"recall","question":"What information does hard voting ignore that soft voting uses?","explanation":"Hard voting counts one vote per model's predicted label. Soft voting averages predicted probabilities, so confident predictions carry more weight.","concept":"Soft voting weighs confidence; hard voting just counts.","source":"Lec 4.1, slides 41, 42","options":["Which class each model predicts","The number of models in the ensemble","How confident each model is in its prediction","Whether the task is classification or regression"],"answer":2,"whyWrong":["Hard voting uses exactly that: one vote per predicted class.","Both rules depend on how many models vote.",null,"Both are classification combining rules."]},{"id":"L4-B08-5","lesson":4,"block":8,"topic":"Diversity in ensembles","type":"mcq","difficulty":"hard","skill":"scenario","question":"A team combines three logistic regression models, each trained on the same full dataset with the same features and settings, into a voting ensemble. The ensemble performs exactly like a single model. What is the best explanation and fix?","explanation":"Ensembles rely on diversity. Identical models trained the same way produce correlated errors, so combining them changes nothing.","concept":"No diversity, no ensemble benefit.","source":"Lec 4.1, slide 39","options":["Voting ensembles never work with logistic regression; switch to a single decision tree","Add more identical logistic regression models until accuracy improves","Use hard voting instead of soft voting","The models lack diversity; vary the algorithms, bootstrap samples or features"],"answer":3,"whyWrong":["Any algorithm can be part of an ensemble; the problem is identical training.","More identical copies still make the same errors.","The voting method cannot help when every model gives the same prediction.",null]},{"id":"L4-B09-1","lesson":4,"block":9,"topic":"Bagging","type":"mcq","difficulty":"easy","skill":"recall","question":"In bagging, what does 'bootstrap' mean?","explanation":"Bootstrap aggregating trains independent models on random samples drawn with replacement, then aggregates them by majority vote.","concept":"Bootstrap = sample with replacement.","source":"Lec 4.1, slide 43","options":["Sampling the training data with replacement","Sampling the training data without replacement","Training each model on the errors of the previous one","Selecting only the most important features"],"answer":0,"whyWrong":[null,"Bootstrapping samples with replacement, so some rows repeat and others are left out.","That describes boosting.","Random feature subsets are a random-forest addition, not the bootstrap itself."]},{"id":"L4-B09-2","lesson":4,"block":9,"topic":"Bias and variance in bagging","type":"tf","difficulty":"easy","skill":"recall","question":"Bagging mainly reduces variance and has little effect on bias.","explanation":"Bagging stabilises high-variance models such as deep trees. Because it does not reduce bias much, it needs complex base learners.","concept":"Bagging tames variance.","source":"Lec 4.1, slide 44","answer":true},{"id":"L4-B09-3","lesson":4,"block":9,"topic":"Out-of-bag error","type":"mcq","difficulty":"easy","skill":"recall","question":"Roughly what fraction of training samples is left out of each bootstrap sample and can be used for out-of-bag evaluation?","explanation":"About 37% of samples are out-of-bag for each tree, giving a built-in validation set (oob_score=True in scikit-learn).","concept":"OOB samples act as free validation data.","source":"Lec 4.1, slide 47","options":["About 10%","About 50%","About 37%","0%, because every sample is always included"],"answer":2,"whyWrong":["Bootstrap sampling leaves out far more than 10%.","The expected fraction left out is about 37%, not half.",null,"Sampling with replacement always leaves some samples out."]},{"id":"L4-B09-4","lesson":4,"block":9,"topic":"Random forest","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why does a random forest consider only a random subset of features at each split?","explanation":"Random forests combine bagging (row sampling) with random feature sub-sampling at each split, usually about sqrt(number of features).","concept":"Double randomness makes trees different from one another.","source":"Lec 4.1, slide 45, Lec 4.1, slide 46","options":["To make each individual tree more accurate than a fully grown tree","To decorrelate the trees so no single feature dominates, reducing variance","To reduce bias, which bagging cannot do","Because trees cannot use more than the square root of the features"],"answer":1,"whyWrong":["Individual trees may be slightly weaker; the forest gains from diversity.",null,"Feature randomness mainly reduces correlation and variance.","Trees can use all features; the restriction is deliberate."]},{"id":"L4-B09-5","lesson":4,"block":9,"topic":"Random forest","type":"mcq","difficulty":"hard","skill":"scenario","question":"A single deep decision tree reaches 100% training accuracy but 72% test accuracy, and its predictions change a lot when a few training rows change. The dataset is small, so the team does not want to set aside a separate validation set. Which approach best fits the lecture?","explanation":"The symptoms (perfect training fit, unstable predictions) are high variance. Bagging and random forests stabilise high-variance trees, and OOB samples provide validation without a separate split.","concept":"Diagnose bias or variance first; bagging targets variance.","source":"Lec 4.1, slide 44, Lec 4.1, slide 45, Lec 4.1, slide 47","options":["A random forest, using its out-of-bag score as built-in validation","AdaBoost with depth-1 stumps, because boosting mainly reduces variance","A single, even deeper decision tree to fit the data more closely","KNN with K = 1, because it needs no training phase at all"],"answer":0,"whyWrong":[null,"Boosting mainly reduces bias. The problem here is high variance.","A deeper tree increases variance further.","K = 1 is itself a high-variance model."]},{"id":"L4-B10-1","lesson":4,"block":10,"topic":"AdaBoost","type":"mcq","difficulty":"easy","skill":"recall","question":"Which weak learner does AdaBoost usually use?","explanation":"AdaBoost trains a model, increases the weight of misclassified points, and trains the next model on the reweighted data.","concept":"Boosting combines many weak rules into a strong one.","source":"Lec 4.1, slide 50","options":["Fully grown decision trees","K-nearest neighbours with K = 1","Decision stumps (trees of depth 1)","Logistic regression meta-models"],"answer":2,"whyWrong":["AdaBoost relies on weak learners; full trees are strong, high-variance learners.","KNN is not the standard AdaBoost learner.",null,"Meta-models belong to stacking."]},{"id":"L4-B10-2","lesson":4,"block":10,"topic":"Gradient boosting","type":"tf","difficulty":"easy","skill":"recall","question":"In gradient boosting, each new tree is trained to predict the original target y directly.","explanation":"Each new tree is fitted to the residuals (the negative gradient of the loss), that is, to how much the previous trees got wrong.","concept":"Each new tree predicts the current errors.","source":"Lec 4.1, slide 53, Lec 4.1, slide 54","answer":false},{"id":"L4-B10-3","lesson":4,"block":10,"topic":"Boosting libraries","type":"match","difficulty":"easy","skill":"recall","question":"Match each boosting library to its key innovation.","explanation":"XGBoost adds L1/L2 regularisation, sparse-data handling and parallel tree construction. LightGBM grows leaf-wise. CatBoost uses ordered boosting.","concept":"Each library improves boosting in a different direction.","source":"Lec 4.1, slide 56, Lec 4.1, slide 57","pairs":[{"left":"XGBoost","right":"Regularised boosting"},{"left":"LightGBM","right":"Leaf-wise tree growth for large-scale data"},{"left":"CatBoost","right":"Ordered boosting, strong with categorical data"}]},{"id":"L4-B10-4","lesson":4,"block":10,"topic":"Learning rate and estimators","type":"mcq","difficulty":"medium","skill":"understanding","question":"What is the trade-off when the learning rate of a boosting model is lowered?","explanation":"The learning rate scales each tree's contribution. A lower rate needs more estimators but gives better generalisation, as in the lecture's example of 1,000 trees at 0.01.","concept":"Small steps, more trees, better generalisation.","source":"Lec 4.1, slide 55","options":["Fewer trees are needed, and training becomes faster","More trees are needed, but the model usually generalises better","The model can no longer overfit, however many trees are added","Nothing changes, because the learning rate only affects random forests"],"answer":1,"whyWrong":["A lower learning rate needs more trees, not fewer.",null,"Boosting can still overfit with too many trees.","The learning rate is a key boosting hyperparameter."]},{"id":"L4-B10-5","lesson":4,"block":10,"topic":"AdaBoost","type":"mcq","difficulty":"hard","skill":"scenario","question":"A factory uses AdaBoost to flag defective parts. Five training parts start with equal weights of 0.2. The first stump misclassifies parts 2 and 4. Using the lecture's rule of doubling the weight of each misclassified part and then normalising so the weights sum to 1, what are the new weights?","explanation":"After doubling: [0.2, 0.4, 0.2, 0.4, 0.2], which sums to 1.4. Dividing by 1.4 gives about [0.143, 0.286, 0.143, 0.286, 0.143]. The next stump will focus on parts 2 and 4.","concept":"Boosting re-weights the data toward the hard cases.","source":"Lec 4.1, slide 50, Lec 4.1, slide 51, Lec 4.1, slide 52","options":["About 0.143 for parts 1, 3 and 5, and about 0.286 for parts 2 and 4","0.2 for parts 1, 3 and 5, and 0.4 for parts 2 and 4","0.1 for parts 2 and 4, and 0.2 for the rest","0.2 for every part, because AdaBoost keeps weights equal"],"answer":0,"whyWrong":[null,"These weights sum to 1.4; they must be normalised to sum to 1.","Misclassified parts get more weight, not less.","AdaBoost increases the weight of misclassified samples so the next learner focuses on them."]},{"id":"L4-B11-1","lesson":4,"block":11,"topic":"Soft and hard voting","type":"mcq","difficulty":"easy","skill":"recall","question":"In soft voting, what is combined across the models?","explanation":"Soft voting averages each class's probability across models and picks the class with the highest average.","concept":"Soft voting averages probabilities.","source":"Lec 4.1, slides 41, 42","options":["Their predicted class labels, counted as votes","Their predicted class probabilities, which are averaged","Their training data, merged into one dataset","Their hyperparameters, averaged into one model"],"answer":1,"whyWrong":["That is hard voting.",null,"Voting combines predictions, not data.","Models keep their own settings."]},{"id":"L4-B11-2","lesson":4,"block":11,"topic":"AdaBoost","type":"mcq","difficulty":"easy","skill":"recall","question":"In the lecture's AdaBoost weight-update logic, what happens to the weights of misclassified samples?","explanation":"Errors are up-weighted (doubled in the lecture's example), then the weights are normalised, so the next learner focuses on the hard samples.","concept":"AdaBoost up-weights mistakes.","source":"Lec 4.1, slides 50, 51, 52","options":["They are decreased so the next learner can ignore them","They are set to zero and removed from the data","They are increased, and then all weights are normalised to sum to 1","They stay the same; only correctly classified samples change"],"answer":2,"whyWrong":["Boosting focuses on mistakes, so their weight goes up.","Misclassified samples become more important, not removed.",null,"The update targets the errors."]},{"id":"L4-B11-3","lesson":4,"block":11,"topic":"Soft and hard voting","type":"tf","difficulty":"easy","skill":"recall","question":"In the lecture's soft-voting code, np.mean(all_probs, axis=0) averages each class probability across the models, and np.argmax(avg_probs, axis=1) then picks a class for each sample.","explanation":"True. The predictions are stacked with models along axis 0, averaged across models, and argmax along axis 1 chooses the most probable class per sample.","concept":"Average across models, argmax across classes.","source":"Lec 4.1, slide 42","answer":true},{"id":"L4-B11-4","lesson":4,"block":11,"topic":"Gradient boosting","type":"mcq","difficulty":"medium","skill":"recall","question":"In gradient boosting, what is the second tree trained to predict?","explanation":"Tree 2 is not trying to predict y; it fits the residuals (the negative gradient of the loss) left by Tree 1, and its output is added to the ensemble.","concept":"Each boosting tree fits what is left over.","source":"Lec 4.1, slides 53, 54","options":["How much the first tree got wrong (the residuals)","The original target values, exactly like the first tree","A random subset of the features chosen at each split","The weights of the misclassified samples"],"answer":0,"whyWrong":[null,"Only the first tree fits the target directly.","That describes random-forest feature randomness.","That is AdaBoost's mechanism, not gradient boosting's."]},{"id":"L4-B11-5","lesson":4,"block":11,"topic":"Soft and hard voting","type":"mcq","difficulty":"hard","skill":"scenario","question":"A fraud team combines three classifiers. For one transaction, one model is very confident it is fraud, while the other two lean only slightly towards 'not fraud'. What can hard and soft voting decide?","explanation":"Hard voting gives each model one vote. Soft voting averages probabilities, so one very confident model can outweigh two models that are only slightly unsure, which is why the lecture prefers soft voting.","concept":"Hard voting counts; soft voting weighs confidence.","source":"Lec 4.1, slide 42; Lec 5.1, slide 28","options":["Both must say fraud, because one of the models is very confident","Both must say not fraud, because most models lean that way","Hard voting says fraud while soft voting must say not fraud","Hard: not fraud (2 votes to 1); soft: can be fraud, as confidence lifts the average"],"answer":3,"whyWrong":["Hard voting counts votes; the confident model is outvoted 2 to 1.","Soft voting averages probabilities, so strong confidence can outweigh two weak leanings.","This reverses how the two rules treat confidence.",null]},{"id":"L4-B12-1","lesson":4,"block":12,"topic":"Boosting libraries","type":"tf","difficulty":"easy","skill":"recall","question":"XGBoost has no built-in regularisation, so it depends only on the learning rate to avoid overfitting.","explanation":"False. XGBoost's key feature is L1/L2 regularisation, which helps prevent overfitting, alongside sparse-data handling and parallel tree construction.","concept":"XGBoost is regularised boosting.","source":"Lec 4.1, slides 56, 57","answer":false},{"id":"L4-B12-2","lesson":4,"block":12,"topic":"Learning rate and estimators","type":"tf","difficulty":"easy","skill":"recall","question":"Lowering the learning rate in gradient boosting usually means more trees (n_estimators) are needed.","explanation":"True. Each tree contributes less, so more trees are needed; the payoff is usually better generalisation.","concept":"Smaller steps need more trees.","source":"Lec 4.1, slide 55; Lec 5.1, slide 34","answer":true},{"id":"L4-B12-3","lesson":4,"block":12,"topic":"Gradient boosting hyperparameters","type":"match","difficulty":"easy","skill":"recall","question":"Gradient-boosting settings: match each hyperparameter to what it controls.","explanation":"These are the main controls shown for gradient boosting. Shrinkage (a small learning rate) is the main guard against overfitting, and subsampling gives sto
