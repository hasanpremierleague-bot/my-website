chastic gradient boosting.","concept":"Boosting is tuned through trees, step size, depth and sampling.","source":"Lec 4.1, slide 55; Lec 5.1, slide 34","pairs":[{"left":"n_estimators","right":"How many trees are added in sequence"},{"left":"learning_rate","right":"How much each new tree's output counts"},{"left":"max_depth = 2 to 4","right":"Keeps each tree a weak learner"},{"left":"subsample < 1.0","right":"Fits each tree on a random part of the data"}]},{"id":"L4-B12-4","lesson":4,"block":12,"topic":"Gradient boosting hyperparameters","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why do boosting models keep max_depth small (about 2 to 4) while random forests usually grow deep trees?","explanation":"Bagging needs complex, low-bias base learners and reduces their variance by averaging. Boosting starts from weak learners and reduces bias step by step; deep trees would make each step too strong and overfit.","concept":"Each ensemble type needs the opposite kind of base learner.","source":"Lec 4.1, slides 44, 50; Lec 5.1, slide 34","options":["Deep trees cannot be trained one after another in sequence","Boosting stacks weak learners to cut bias; bagging averages strong trees","Shallow trees are required so trees can be built in parallel","Random forests cannot overfit, however deep their trees grow"],"answer":1,"whyWrong":["Deep trees can be trained sequentially; it just defeats boosting's purpose.",null,"Parallel construction is unrelated to why boosting keeps trees shallow.","Lecture 5.1 advises reducing max_depth when a random forest overfits."]},{"id":"L4-B12-5","lesson":4,"block":12,"topic":"Gradient boosting hyperparameters","type":"mcq","difficulty":"hard","skill":"scenario","question":"A gradient boosting classifier with n_estimators=300, learning_rate=0.3 and max_depth=8 reaches 100% training accuracy, but validation accuracy falls as trees are added. Which changes follow the lecture's guidance?","explanation":"The model is overfitting. Shrinkage (a lower learning rate, balanced with more trees) and shallow trees that stay weak learners are the lecture's main remedies.","concept":"Fix boosting overfitting with smaller steps and weaker trees.","source":"Lec 4.1, slide 55; Lec 5.1, slide 33; Lec 5.1, slide 34","options":["Raise learning_rate so the model converges using fewer trees","Increase max_depth so each tree can capture more of the detail","Lower learning_rate, add more trees, and limit max_depth to about 3","Remove subsampling so every tree trains on all the data rows"],"answer":2,"whyWrong":["Bigger steps make each tree count more and usually worsen overfitting.","Deeper trees are stronger learners and overfit even faster.",null,"Subsampling below 1.0 adds randomness that helps generalisation."]},{"id":"L4-B13-1","lesson":4,"block":13,"topic":"Choosing an ensemble","type":"match","difficulty":"easy","skill":"recall","question":"Choosing an ensemble: match each goal to the approach the lecture associates with it.","explanation":"The lecture's summary: bagging for stability, boosting for performance, trees for interpretability. Stacking trains a meta-model to combine base models.","concept":"Match the ensemble to the goal.","source":"Lec 4.1, slides 59, 61","pairs":[{"left":"Stabilise a high-variance model","right":"Bagging or random forest"},{"left":"Push accuracy higher by correcting errors","right":"Boosting"},{"left":"Learn which base model to trust","right":"Stacking"},{"left":"Keep the model easy to interpret","right":"A single decision tree"}]},{"id":"L4-B13-2","lesson":4,"block":13,"topic":"Choosing an ensemble","type":"tf","difficulty":"easy","skill":"recall","question":"The lecture's summary recommends boosting mainly for stability and bagging mainly for performance.","explanation":"False. It is the other way round: bagging for stability (variance reduction), boosting for performance (bias reduction).","concept":"Bagging stabilises; boosting improves.","source":"Lec 4.1, slide 61","answer":false},{"id":"L4-B13-3","lesson":4,"block":13,"topic":"Boosting libraries","type":"mcq","difficulty":"easy","skill":"recall","question":"According to the lecture's comparison table, which boosting library is best suited to data with many categorical features?","explanation":"CatBoost's key innovation is ordered boosting, and the table lists it as best for categorical data.","concept":"CatBoost targets categorical data.","source":"Lec 4.1, slide 57","options":["CatBoost","XGBoost","LightGBM","AdaBoost"],"answer":0,"whyWrong":[null,"XGBoost is listed for regularised boosting on small to medium data.","LightGBM is listed for large-scale data, using leaf-wise growth.","AdaBoost is not in that table; it re-weights samples using stumps."]},{"id":"L4-B13-4","lesson":4,"block":13,"topic":"Diversity in ensembles","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why would an ensemble of five identical decision trees, trained on the same data, give no benefit over one tree?","explanation":"Ensembles work because diverse models make uncorrelated errors that cancel out. Diversity comes from different algorithms, different training data (bagging) or different feature sets.","concept":"No diversity, no ensemble gain.","source":"Lec 4.1, slides 38, 39","options":["Five trees are too few for any ensemble to be effective","Identical models make the same errors, so there is nothing to cancel out","Decision trees cannot be combined by majority voting","The ensemble would have a higher bias than the single tree"],"answer":1,"whyWrong":["Small ensembles can help if their errors differ.",null,"Trees are the most common base learner in ensembles.","Copies have the same bias as the original; they simply add nothing."]},{"id":"L4-B13-5","lesson":4,"block":13,"topic":"Choosing an ensemble","type":"mcq","difficulty":"hard","skill":"scenario","question":"Team A has 2 million loan applications with many categorical columns (branch, product type) and wants the most accurate model possible. Team B has 300 clinic patients and needs a model doctors can explain line by line. What fits each team?","explanation":"Boosting is for performance, and the library table points to LightGBM for large data and CatBoost for categorical data. For explanation, the lecture says trees are for interpretability.","concept":"Choose by data size, data type and the need to explain.","source":"Lec 4.1, slides 57, 61","options":["A: a boosting library such as CatBoost or LightGBM; B: a single shallow decision tree","A: a single decision tree for speed; B: stacking several models for accuracy","Both teams: AdaBoost with fully grown decision trees as the learners","A: KNN using all two million rows; B: XGBoost tuned for top accuracy"],"answer":0,"whyWrong":[null,"This reverses the needs: A wants accuracy, B wants interpretability.","AdaBoost uses stumps, and a large ensemble is hard to explain to doctors.","KNN is slow at prediction on huge data, and XGBoost is hard to explain."]},{"id":"L4-X1","lesson":4,"block":0,"topic":"Stacking","type":"mcq","difficulty":"medium","skill":"understanding","question":"In stacking, what does the meta-model learn?","explanation":"Stacking trains base models (for example KNN, random forest and logistic regression), collects their predictions, and trains a meta-model on those predictions.","concept":"Stacking learns how to combine models instead of using a fixed vote.","source":"Lec 4.1, slide 59","options":["Which base model to trust for each kind of input, from their predictions","How to predict from the original features while ignoring the base models","How to fit the residuals left by the previous tree in a sequence","How to sample the training data with replacement for each model"],"answer":0,"whyWrong":[null,"The meta-model is trained on the base models' predictions.","That describes gradient boosting.","That describes bagging."]},{"id":"L4-X2","lesson":4,"block":0,"topic":"Boosting","type":"tf","difficulty":"easy","skill":"recall","question":"Boosting trains models sequentially, with each new model focusing on the samples its predecessors found hard.","explanation":"Unlike bagging, boosting is sequential, and each model attempts to correct the errors of the one before.","concept":"Bagging is parallel; boosting is sequential.","source":"Lec 4.1, slide 49","answer":true},{"id":"L4-X3","lesson":4,"block":0,"topic":"Gini vs entropy","type":"mcq","difficulty":"easy","skill":"recall","question":"Why is Gini impurity often preferred over entropy in CART decision trees?","explanation":"Gini = 1 - sum(p²) avoids a log calculation, so it is faster, and splits are usually similar to those chosen by entropy.","concept":"Gini and entropy rank splits similarly; Gini is cheaper.","source":"Lec 4.1, slide 28","options":["It always produces much more accurate trees than entropy does","It can measure impurity for regression targets only","It is faster because it needs no logarithm, with very similar results","It reaches its maximum value of 1 for a pure node"],"answer":2,"whyWrong":["The lecture says the results are usually very similar.","Gini is a classification criterion.",null,"Gini is 0 for a pure node."]},{"id":"L4-X4","lesson":4,"block":0,"topic":"Bias and variance in bagging","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why does bagging work best with complex base learners such as deep decision trees?","explanation":"Averaging many high-variance, low-bias models cancels out their variance. Averaging many high-bias models would leave the bias in place.","concept":"Bagging fixes variance, so start from low-bias learners.","source":"Lec 4.1, slide 44","options":["Because bagging mainly reduces bias, so it needs learners with high variance","Because simple learners cannot be trained on bootstrap samples","Bagging mainly reduces variance, not bias, so each base learner must already have low bias","Because deep trees make the ensemble sequential"],"answer":2,"whyWrong":["Bagging reduces variance; it has little effect on bias.","Any learner can be trained on a bootstrap sample.",null,"Bagging trains learners in parallel whatever their depth."]},{"id":"L4-X5","lesson":4,"block":0,"topic":"Soft and hard voting","type":"mcq","difficulty":"easy","skill":"understanding","question":"Why is soft voting generally better than hard voting?","explanation":"Hard voting counts one vote per model. Soft voting averages probabilities, so a model that is 90% sure counts more than one that is 51% sure.","concept":"Soft voting keeps the confidence information that hard voting throws away.","source":"Lec 4.1, slide 42","options":["It ignores the least accurate model in the ensemble","It only needs one model to produce probabilities","Confident probability estimates count for more","It always picks the class chosen by most models"],"answer":2,"whyWrong":["Soft voting averages all models' probabilities; it ignores none.","Every model must provide probabilities for soft voting.",null,"That is hard voting."]},{"id":"L5-B01-1","lesson":5,"block":1,"topic":"What regression is","type":"mcq","difficulty":"easy","skill":"application","question":"Which of these is a regression task?","explanation":"Regression predicts a number on a continuous scale, such as a price, a temperature or a score.","concept":"If the answer is a number on a continuous scale, it is regression.","source":"Lec 5.1, slide 3, Lec 5.1, slide 10","options":["Deciding whether an email is spam","Predicting tomorrow's maximum temperature in °C","Predicting whether a student will pass or fail","Identifying which species a flower belongs to"],"answer":1,"whyWrong":["Spam or not spam is a label, so this is classification.",null,"Pass/fail is a label; the lecture says this is classification.","A species is a category, so this is classification."]},{"id":"L5-B01-2","lesson":5,"block":1,"topic":"Regression vocabulary","type":"tf","difficulty":"easy","skill":"recall","question":"A residual is e = y - ŷ, so a positive residual means the model predicted too low.","explanation":"If the true value is larger than the prediction, y - ŷ is positive, which means the prediction was too low.","concept":"Residual = truth minus prediction.","source":"Lec 5.1, slide 4","answer":true},{"id":"L5-B01-3","lesson":5,"block":1,"topic":"Regression vocabulary","type":"match","difficulty":"easy","skill":"recall","question":"Regression vocabulary: match each word to what it refers to in a dataset or model.","explanation":"Features are also called predictors or independent variables, the target the response or dependent variable, and parameters weights or coefficients.","concept":"Shared vocabulary for every regression model.","source":"Lec 5.1, slide 4","pairs":[{"left":"Sample","right":"One row of the dataset"},{"left":"Feature","right":"An input column used to make the prediction"},{"left":"Target","right":"The true number we want to predict"},{"left":"Parameter","right":"A number inside the model that learning adjusts"},{"left":"Residual","right":"The gap between truth and prediction"}]},{"id":"L5-B01-4","lesson":5,"block":1,"topic":"What regression is","type":"mcq","difficulty":"medium","skill":"understanding","question":"The lecture summary says that in regression 'error is a distance, not a right-or-wrong count'. What does this mean?","explanation":"Because targets are continuous, an error has a size. Metrics such as MAE and RMSE summarise the size of those gaps.","concept":"Regression error has a size; classification error is a count.","source":"Lec 5.1, slide 36","options":["Regression models are evaluated with accuracy, in the same way as classifiers","Errors in regression are always measured as physical distances in kilometres","A regression prediction counts as correct only if it matches exactly","Regression is judged by how far off predictions are, not by counting correct answers"],"answer":3,"whyWrong":["Accuracy counts correct labels; regression uses MAE, MSE, RMSE and R².","'Distance' means the size of the gap between prediction and truth, not physical distance.","Exact matches are rare for continuous values; what matters is how close predictions are.",null]},{"id":"L5-B01-5","lesson":5,"block":1,"topic":"What regression is","type":"mcq","difficulty":"hard","skill":"scenario","question":"A hospital wants three models. (a) Predict how many days a patient will stay. (b) Predict whether a patient will be readmitted within 30 days (yes or no). (c) Predict a disease-progression score between 25 and 346. Which statement is correct?","explanation":"The output decides the task: numbers on a continuous scale for regression, labels for classification.","concept":"Look at the target, not the features.","source":"Lec 5.1, slide 3, Lec 5.1, slide 10","options":["(a) and (c) are regression tasks; (b) is classification","All three are regression, because they all use numeric patient features","Only (c) is regression, because length of stay is a count","(b) is regression, because readmission is coded as 0 and 1"],"answer":0,"whyWrong":[null,"The type of task is decided by the target. A yes/no target is classification.","Length of stay is a number on a numeric scale and is predicted as regression.","Coding a label as 0/1 does not make it continuous; it is still a category."]},{"id":"L5-B02-1","lesson":5,"block":2,"topic":"The linear model","type":"mcq","difficulty":"easy","skill":"recall","question":"In ŷ = β0 + β1x1 + ... + βpxp, what does the intercept β0 represent?","explanation":"The intercept sets the height of the line. With centred data, x = 0 is the average, so β0 is the prediction at average feature values.","concept":"Intercept = height; weights = slopes.","source":"Lec 5.1, slide 5, Lec 5.1, slide 14","options":["The change in prediction when x1 rises by one unit","The average residual","The number of features in the model","The prediction when every feature equals zero"],"answer":3,"whyWrong":["That is the weight β1.","Residuals are errors; the intercept is a parameter.","β0 is a parameter value, not a count.",null]},{"id":"L5-B02-2","lesson":5,"block":2,"topic":"The linear model","type":"tf","difficulty":"easy","skill":"recall","question":"In multiple linear regression, a coefficient βj shows the change in the prediction when xj rises by one unit while the other features are allowed to change freely.","explanation":"Each coefficient is the effect of its feature while every other feature is held constant.","concept":"Read each weight with all other features fixed.","source":"Lec 5.1, slide 5, Lec 5.1, slide 16","answer":false},{"id":"L5-B02-3","lesson":5,"block":2,"topic":"The linear model","type":"mcq","difficulty":"easy","skill":"recall","question":"A linear regression with two features draws which shape?","explanation":"One feature draws a line, two draw a plane and many draw a hyperplane; the way you read each weight never changes.","concept":"More features add dimensions; interpretation stays the same.","source":"Lec 5.1, slide 5","options":["A flat plane","A straight line","A curve that bends","A hyperplane in exactly two dimensions"],"answer":0,"whyWrong":[null,"One feature draws a line.","A linear model with only original features cannot bend.","Hyperplanes are the general term for many features; two features give a plane."]},{"id":"L5-B02-4","lesson":5,"block":2,"topic":"The linear model","type":"mcq","difficulty":"medium","skill":"application","question":"A model predicts exam marks as ŷ = 20 + 3 × study_hours + 0.5 × attendance_percent. What does the coefficient 3 mean?","explanation":"Each weight is how much the prediction changes when that feature rises by one unit while all other features are held constant.","concept":"A weight is the change per unit, others held fixed.","source":"Lec 5.1, slide 5","options":["Every student is predicted to score at least 3 marks","Each extra study hour adds 3 marks, attendance held constant","Studying causes exactly 3 more marks for every student","Study hours are three times as important as the intercept"],"answer":1,"whyWrong":["That is not what a slope means; 20 is the intercept.",null,"A coefficient describes association in the model, not proven cause.","Coefficients and intercept are not compared that way."]},{"id":"L5-B02-5","lesson":5,"block":2,"topic":"Interpreting coefficients","type":"mcq","difficulty":"hard","skill":"scenario","question":"A housing model is ŷ = 50,000 + 1,200 × area_m2 - 3,000 × age_years. An analyst writes: 'Each extra year of age causes the price to fall by $3,000, regardless of the size of the house.' Which correction is most accurate?","explanation":"Each weight is the change in the prediction per one-unit rise in its feature with other features held constant. The lecture stresses that such relationships are correlation, not proof of cause.","concept":"Coefficients are conditional associations.","source":"Lec 5.1, slide 5, Lec 5.1, slide 15, Lec 5.1, slide 16","options":["Each extra year lowers the price by 3,000 percent, whatever the area of the house","With area fixed, each year goes with a $3,000 lower predicted price; this is association, not cause","The coefficient cannot be interpreted, because it is negative and prices cannot be","The intercept of $50,000 is the price of an average house, so the statement is fine"],"answer":1,"whyWrong":["The coefficient is in the target's units (dollars), not a percentage.",null,"A negative coefficient means the prediction falls as the feature rises; it is interpretable.","The intercept is the prediction when all features are zero, which here is not an average house."]},{"id":"L5-B03-1","lesson":5,"block":3,"topic":"Cost function","type":"mcq","difficulty":"easy","skill":"understanding","question":"Why does the cost function J(β) square the residuals?","explanation":"Squaring makes every error positive and punishes one large miss far more than several small ones.","concept":"Squared error: no cancellation, heavy penalty for big misses.","source":"Lec 5.1, slide 6, Lec 5.1, slide 14","options":["So positive and negative errors cannot cancel, and large misses count more","So that the total cost always comes out as a negative number","So that every error counts equally, whatever its size","Because squaring removes outliers from the training data"],"answer":0,"whyWrong":[null,"Squared values are never negative.","Squaring makes large errors count much more.","Squaring makes outliers more influential, not removed."]},{"id":"L5-B03-2","lesson":5,"block":3,"topic":"Cost function","type":"tf","difficulty":"easy","skill":"recall","question":"Minimising the sum of squared residuals instead of their average gives different β values.","explanation":"Dividing by n does not change where the minimum is, so the sum and the average give exactly the same β values.","concept":"Scaling the cost by a constant does not move its minimum.","source":"Lec 5.1, slide 14","answer":false},{"id":"L5-B03-3","lesson":5,"block":3,"topic":"How the model learns","type":"match","difficulty":"easy","skill":"recall","question":"Match each piece of the learning process to its description.","explanation":"Both methods minimise the same cost. The normal equation β = (XᵀX)⁻¹Xᵀy is exact; gradient descent β ← β - η∇J(β) is iterative.","concept":"Exact in one step, or approximate in many small steps.","source":"Lec 5.1, slide 6","pairs":[{"left":"Normal equation","right":"Solves for the best weights in one step; exact but heavy with many features"},{"left":"Gradient descent","right":"Walks downhill in small steps; scales to huge datasets"},{"left":"Cost J(β)","right":"One number saying how wrong the model is"},{"left":"Step size η","right":"How far each gradient-descent update moves the weights"}]},{"id":"L5-B03-4","lesson":5,"block":3,"topic":"How the model learns","type":"mcq","difficulty":"medium","skill":"understanding","question":"When is gradient descent preferred over the normal equation?","explanation":"The normal equation is exact but heavy with many features. Gradient descent is slower per problem but scales to huge datasets.","concept":"Choose the solver by problem size.","source":"Lec 5.1, slide 6","options":["When an exact solution is required rather than an approximate one","When the model has only one feature and very few rows of data","When there are very many features or rows, since the one-step solution gets heavy","When the cost function does not need to be minimised at all"],"answer":2,"whyWrong":["The normal equation gives the exact solution.","That is the easiest case for the normal equation.",null,"Both methods minimise the cost."]},{"id":"L5-B03-5","lesson":5,"block":3,"topic":"How the model learns","type":"mcq","difficulty":"hard","skill":"scenario","question":"A student trains linear regression with gradient descent. Instead of falling steadily, the cost jumps up and down and grows larger with each iteration. Based on β ← β - η∇J(β), what is the most likely cause and fix?","explanation":"Gradient descent walks downhill in steps of size η. If the steps are too big, updates jump past the minimum and the cost can grow. This is an inference from the update rule; the slide describes η as the step size.","concept":"Small, steady steps downhill; oversized steps overshoot.","source":"Lec 5.1, slide 6","options":["The relationship is non-linear, so gradient descent cannot be used","The cost should be changed to MAE so errors are not squared","The step size η is too large, so each update overshoots the minimum; reduce η","More features should be added so the cost has more directions to fall"],"answer":2,"whyWrong":["Gradient descent works on this convex cost; growing cost points to the step size.","Changing the cost does not fix overshooting caused by large steps.",null,"More features do not stop each step from overshooting."]},{"id":"L5-B04-1","lesson":5,"block":4,"topic":"Assumptions of linear regression","type":"match","difficulty":"easy","skill":"recall","question":"Match each L-I-N-E assumption to its meaning.","explanation":"L-I-N-E is the memory aid. Each assumption has a consequence if it fails.","concept":"Linearity, Independence, Normality, Equal variance.","source":"Lec 5.1, slide 7","pairs":[{"left":"Linearity","right":"Each feature moves the target in a straight line"},{"left":"Independence","right":"One row tells you nothing about another row"},{"left":"Normality of errors","right":"Residuals are spread symmetrically around zero"},{"left":"Equal variance","right":"The spread of residuals stays the same across the range"}]},{"id":"L5-B04-2","lesson":5,"block":4,"topic":"Assumptions of linear regression","type":"tf","difficulty":"easy","skill":"recall","question":"The lecture says the linear-regression assumptions should be checked by plotting the residuals, not simply assumed.","explanation":"You test these conditions by plotting the residuals, never by assuming.","concept":"Assumptions are checked with residual plots.","source":"Lec 5.1, slide 7","answer":true},{"id":"L5-B04-3","lesson":5,"block":4,"topic":"Multicollinearity","type":"tf","difficulty":"easy","skill":"recall","question":"Multicollinearity makes the weights more stable and easier to interpret.","explanation":"When two features carry almost the same information, the weights become unstable and lose their meaning.","concept":"Near-duplicate features destabilise coefficients.","source":"Lec 5.1, slide 7","answer":false},{"id":"L5-B04-4","lesson":5,"block":4,"topic":"Residual analysis","type":"mcq","difficulty":"medium","skill":"analysis","question":"A residual plot shows residuals spreading wider and wider as the predicted value increases, forming a funnel. Which assumption is violated?","explanation":"Fan-shaped residuals indicate heteroscedasticity: the model is accurate for some values and poor for others.","concept":"U-shape: non-linear. Funnel: unequal variance.","source":"Lec 5.1, slide 7, Lec 5.1, slide 21","options":["Linearity, shown by a U-shaped curve","Independence of rows","No assumption is violated; funnels are expected","Equal variance (the errors are heteroscedastic)"],"answer":3,"whyWrong":["A U-shape signals non-linearity; a funnel signals unequal variance.","Independence is about rows being unrelated, not about the spread of residuals.","A funnel shows that accuracy varies across the range.",null]},{"id":"L5-B04-5","lesson":5,"block":4,"topic":"Assumptions of linear regression","type":"mcq","difficulty":"hard","skill":"scenario","question":"A shop models daily sales using two years of data. Sales on consecutive days are strongly related (a busy day is usually followed by another busy day). The rows are shuffled randomly into training and test sets, and the test R² looks impressive. Which assumption is at risk, and what is the consequence?","explanation":"When one row tells you something about another, the independence assumption fails, and the lecture notes the model then looks better than it is.","concept":"Related rows make evaluation optimistic.","source":"Lec 5.1, slide 7","options":["Normality of errors: p-values cannot be trusted, but the R² is reliable","Linearity: the model underfits, and the residuals follow a curved pattern","No assumption is at risk, because shuffling makes rows independent","Independence: related rows land in both sets, so the model looks better than it is"],"answer":3,"whyWrong":["The issue is that rows are related, which inflates performance estimates.","Nothing in the scenario indicates curved relationships.","Shuffling changes row order, not the relationship between neighbouring days.",null]},{"id":"L5-B05-1","lesson":5,"block":5,"topic":"Families of regression models","type":"mcq","difficulty":"easy","skill":"recall","question":"Which family of regression models can delete useless features automatically while fitting?","explanation":"Ridge and Lasso add a penalty on large weights. Lasso can drive weights exactly to zero, deleting features.","concept":"Lasso selects features while it fits.","source":"Lec 5.1, slide 8, Lec 5.1, slide 26","options":["Regularised models such as Lasso","Polynomial regression models","Plain linear regression","Kernel and neural models"],"answer":0,"whyWrong":[null,"Polynomial regression adds features; it does not remove them.","Ordinary least squares keeps every feature.","These learn complex shapes but do not perform this kind of feature deletion."]},{"id":"L5-B05-2","lesson":5,"block":5,"topic":"Families of regression models","type":"tf","difficulty":"easy","skill":"recall","question":"Tree-based regression models split the data into regions and predict an average value within each region.","explanation":"Tree models handle curves and interactions with no equation at all, predicting the average of each region.","concept":"Regression trees predict region averages.","source":"Lec 5.1, slide 8","answer":true},{"id":"L5-B05-3","lesson":5,"block":5,"topic":"The diabetes dataset","type":"mcq","difficulty":"easy","skill":"recall","question":"Why can the coefficients of the scikit-learn diabetes model be compared directly as importance scores?","explanation":"Every feature is mean-centred and scaled, so coefficients share one scale and can be compared directly.","concept":"Coefficients are comparable only when features share a scale.","source":"Lec 5.1, slide 11, Lec 5.1, slide 16","options":["All ten features are already standardised to the same scale","Because the target has been converted to a 0/1 label","Because the dataset has no missing values","Because there are exactly 442 patients"],"answer":0,"whyWrong":[null,"The target is a continuous progression score from 25 to 346.","Missing values do not affect coefficient comparability.","Sample size does not make coefficients comparable; a shared scale does."]},{"id":"L5-B05-4","lesson":5,"block":5,"topic":"Families of regression models","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why does the lecture describe linear regression as 'the baseline every model must beat'?","explanation":"A simple, interpretable baseline shows how much extra value more complex models really add.","concept":"Complexity must earn its place against a simple baseline.","source":"Lec 5.1, slide 8","options":["Complex models must clearly beat this fast, readable model","It is always the most accurate model available for tabular data","It is the only model that can be evaluated with RMSE and R²","It cannot overfit under any circumstances, whatever the features"],"answer":0,"whyWrong":[null,"The lecture says tree ensembles are usually the most accurate for table-shaped data.","Every regression model can be evaluated with RMSE.","Any model can overfit in some settings; the point is simplicity and readability."]},{"id":"L5-B05-5","lesson":5,"block":5,"topic":"Families of regression models","type":"mcq","difficulty":"hard","skill":"scenario","question":"A team has 300 rows of tabular data with curved relationships and interactions between features. They want the most accurate model they can reasonably build and will compare it with a simple benchmark. Which plan best follows the lecture?","explanation":"The lecture calls linear regression the baseline and ensembles of trees usually the most accurate choice for table-shaped data, while neural models need far more data.","concept":"Baseline first, then the family that suits the data.","source":"Lec 5.1, slide 8, Lec 5.1, slide 25","options":["Fit linear regression as the baseline, then try a tree ensemble","Go straight to a large neural network, because it learns the most complex shapes","Use a degree-10 polynomial so every curve is captured","Use only linear regression, because it is the most readable"],"answer":0,"whyWrong":[null,"Neural models need far more data and tuning than 300 rows allow.","High-degree polynomials follow every wobble and overfit badly.","A straight-line model underfits curves and interactions; it serves as the baseline."]},{"id":"L5-B06-1","lesson":5,"block":6,"topic":"Regression metrics","type":"match","difficulty":"easy","skill":"recall","question":"Match each metric to its behaviour.","explanation":"MAE and RMSE are in the target's units, MSE is in squared units, and R² is unitless.","concept":"Report RMSE with R²: typical error size plus variance explained.","source":"Lec 5.1, slide 20","pairs":[{"left":"MAE","right":"Treats every error equally; robust to outliers"},{"left":"MSE","right":"Squares errors so outliers dominate; used as the training loss"},{"left":"RMSE","right":"Keeps MSE's outlier sensitivity but reads in the target's units"},{"left":"R²","right":"Share of the target's variance that the model explains"}]},{"id":"L5-B06-2","lesson":5,"block":6,"topic":"Regression metrics","type":"tf","difficulty":"easy","skill":"recall","question":"R² can be negative when a model performs worse than simply predicting the mean.","explanation":"R² = 1 - SSR/SST. A value of 0 equals predicting the mean, and a negative value is worse than the mean.","concept":"R² compares the model with always predicting the mean.","source":"Lec 5.1, slide 20","answer":true},{"id":"L5-B06-3","lesson":5,"block":6,"topic":"Regression metrics","type":"mcq","difficulty":"easy","skill":"recall","question":"Which metric is expressed in the square of the target's units?","explanation":"Squaring the errors squares the units; RMSE takes the square root to return to the original units.","concept":"Squared errors, squared units.","source":"Lec 5.1, slide 20","options":["MAE","MSE","RMSE","R²"],"answer":1,"whyWrong":["MAE is in the same units as the target.",null,"Taking the square root returns RMSE to the target's units.","R² is unitless."]},{"id":"L5-B06-4","lesson":5,"block":6,"topic":"Regression metrics","type":"mcq","difficulty":"medium","skill":"application","question":"A model's test errors are mostly small, but one prediction misses by a very large amount. Which metric will that one miss inflate the most?","explanation":"MSE squares errors, so one large miss produces a huge penalty that dominates the loss. MAE weights all errors equally and is more robust; RMSE keeps MSE's sensitivity in the target's units.","concept":"Squared errors amplify outliers.","source":"Lec 5.1, slides 19, 20","options":["MSE, because squaring makes large errors dominate","MAE, because it treats every error equally","R² only, because MSE ignores outliers","None of them, because one error is averaged away"],"answer":0,"whyWrong":[null,"Treating errors equally is exactly why MAE is less affected.","MSE is the metric most sensitive to outliers.","Squaring a large error can dominate the average."]},{"id":"L5-B06-5","lesson":5,"block":6,"topic":"Regression metrics","type":"mcq","difficulty":"hard","skill":"scenario","question":"A courier compares two delivery-time models. Model A: MAE 5 min, RMSE 6 min. Model B: MAE 4.5 min, RMSE 12 min. Occasional very late estimates cause serious customer complaints. Which model should be preferred, and why?","explanation":"MSE and RMSE square errors, so a few large misses raise RMSE sharply. A big gap between MAE and RMSE signals large errors.","concept":"Compare MAE with RMSE to detect large errors.","source":"Lec 5.1, slide 19, Lec 5.1, slide 20","options":["Model B, because it has the lower MAE of the two models","Neither can be compared, because MAE and RMSE are in different units","Model B, because a higher RMSE means more of the variance is explained","Model A: its RMSE is close to its MAE, so it makes few very large errors"],"answer":3,"whyWrong":["MAE treats every error equally and hides the few large misses that the business cares about.","Both are in minutes, the target's units.","RMSE measures error size; variance explained is R².",null]},{"id":"L5-B07-1","lesson":5,"block":7,"topic":"Actual vs predicted","type":"mcq","difficulty":"easy","skill":"recall","question":"On an actual-versus-predicted plot, where would the points lie for a perfect model?","explanation":"When predictions equal actual values, every point satisfies predicted = actual, which is the diagonal. Deviations show systematic over- or under-prediction.","concept":"Distance from the diagonal is error.","source":"Lec 5.1, slide 17","options":["On a horizontal line at the mean","Randomly scattered across the plot","On the 45-degree diagonal line","On a vertical line at zero"],"answer":2,"whyWrong":["A horizontal line means the model predicts the same value for everyone.","Random scatter means the predictions are unrelated to the truth.",null,"That has no meaning for actual vs predicted values."]},{"id":"L5-B07-2","lesson":5,"block":7,"topic":"Residual analysis","type":"tf","difficulty":"easy","skill":"recall","question":"A U-shaped pattern in a residual plot suggests the relationship is non-linear.","explanation":"Residuals should be random around zero. A U-shape implies non-linearity; a funnel implies heteroscedasticity.","concept":"Patterns in residuals mean the model missed structure.","source":"Lec 5.1, slide 21","answer":true},{"id":"L5-B07-3","lesson":5,"block":7,"topic":"Bias-variance trade-off","type":"tf","difficulty":"easy","skill":"recall","question":"High bias describes a model that is too complex and overfits.","explanation":"High bias means the model is too simple (underfitting). High variance means it is too complex (overfitting).","concept":"Bias: too simple. Variance: too complex.","source":"Lec 5.1, slide 22","answer":false},{"id":"L5-B07-4","lesson":5,"block":7,"topic":"Bias-variance trade-off","type":"mcq","difficulty":"medium","skill":"understanding","question":"What is the goal of the bias-variance trade-off?","explanation":"Too simple a model misses patterns; too complex a model learns noise. The best complexity balances both.","concept":"Total error is lowest at the right complexity.","source":"Lec 5.1, slide 22","options":["To make the model as complex as possible so training error reaches zero","To find the complexity that minimises total error","To remove variance entirely, whatever happens to bias","To choose the model with the highest bias, because it is most stable"],"answer":1,"whyWrong":["Zero training error usually means overfitting.",null,"Pushing variance to zero makes the model too simple and raises bias.","High bias means underfitting."]},{"id":"L5-B07-5","lesson":5,"block":7,"topic":"Bias-variance trade-off","type":"mcq","difficulty":"hard","skill":"scenario","question":"Three polynomial models were fitted. X (degree 1): training RMSE 18, validation RMSE 19. Y (degree 12): training RMSE 3, validation RMSE 25. Z (degree 3): training RMSE 9, validation RMSE 10. Which diagnosis and choice are correct?","explanation":"Underfitting shows as high error on both sets; overfitting as low training error with much higher validation error. Z balances the two and has the lowest validation error.","concept":"Pick complexity by validation error, and read the gap to diagnose.","source":"Lec 5.1, slide 22, Lec 5.1, slide 25","options":["Y should be chosen, because it has the lowest training error","X has high variance and Y has high bias","X should be chosen, because its training and validation errors are closest","X has high bias, Y has high variance, and Z should be chosen"],"answer":3,"whyWrong":["Y's large gap between training and validation error shows overfitting.","This reverses the definitions: X underfits (both errors high), Y overfits (large gap).","Close errors are good, but X's are both high, which means underfitting.",null]},{"id":"L5-B08-1","lesson":5,"block":8,"topic":"K-fold cross-validation","type":"mcq","difficulty":"easy","skill":"recall","question":"In K-fold cross-validation, how often does each fold serve as the validation set?","explanation":"The data are split into K folds, and every row gets a turn as validation, which reduces the risk of a lucky or unlucky single split.","concept":"Every row gets a turn as validation.","source":"Lec 5.1, slide 23, Lec 5.1, slide 24","options":["Never; it is only used for training","K times","Only in the final fold","Exactly once"],"answer":3,"whyWrong":["Every fold takes one turn as validation.","Each fold is validation once and training K - 1 times.","Every fold is used for validation, not just the last.",null]},{"id":"L5-B08-2","lesson":5,"block":8,"topic":"K-fold cross-validation","type":"tf","difficulty":"easy","skill":"recall","question":"K-fold cross-validation fits the model about K times, so it costs roughly K times the compute of a single hold-out fit.","explanation":"Hold-out validation fits once and is cheap; K-fold fits K models and averages their scores.","concept":"Stability costs compute.","source":"Lec 5.1, slide 24","answer":true},{"id":"L5-B08-3","lesson":5,"block":8,"topic":"Using the test set","type":"tf","difficulty":"easy","skill":"recall","question":"Tuning hyperparameters on the test set is acceptable as long as the test set is only checked a few times.","explanation":"Hyperparameters are tuned on validation folds only. The test set is touched once, at the very end, or the reported error is optimistic.","concept":"The test set is for one final check.","source":"Lec 5.1, slide 24","answer":false},{"id":"L5-B08-4","lesson":5,"block":8,"topic":"Hold-out vs cross-validation","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why does the lecture prefer K-fold cross-validation for the 442-patient diabetes dataset?","explanation":"Small datasets make hold-out estimates high-variance. K-fold averages K scores and also gives a standard deviation.","concept":"Small data favours K-fold.","source":"Lec 5.1, slide 24","options":["Because K-fold needs fewer model fits than a single hold-out validation","A single hold-out score on so few rows depends on which rows it gets","Because hold-out validation cannot be used for regression problems","Because K-fold removes the need for a final, untouched test set"],"answer":1,"whyWrong":["K-fold needs about K fits.",null,"Hold-out works for regression; it is just less stable on small data.","The test set is still touched once at the end."]},{"id":"L5-B08-5","lesson":5,"block":8,"topic":"Using the test set","type":"mcq","difficulty":"hard","skill":"scenario","question":"A team tries 50 values of Ridge's alpha, picks the one with the best test-set R² (0.61), and reports 0.61 as the model's expected performance on new patients. What is the best critique?","explanation":"The lecture's non-negotiable rule: tune hyperparameters on validation folds only, and touch the test set once at the very end.","concept":"Tune on validation, report on an untouched test set.","source":"Lec 5.1, slide 24, Lec 5.1, slide 27","options":["The approach is correct, because the best test score is the most honest estimate","Alpha was tuned on the test set, so 0.61 is optimistic; tune with CV and test once at the end","The only problem is that 50 values is too few, so more alphas should be tried","R² should be replaced by MAE, which removes the bias from the reported score"],"answer":1,"whyWrong":["Selecting the best of 50 test scores uses the test set for tuning, which biases the estimate upward.",null,"The number of values is not the issue; where they were evaluated is.","Changing the metric does not fix tuning on the test set."]},{"id":"L5-B09-1","lesson":5,"block":9,"topic":"Polynomial regression","type":"mcq","difficulty":"easy","skill":"understanding","question":"Why is polynomial regression still called a linear model?","explanation":"Adding x², x³ or products creates new columns, but the prediction is still a weighted sum of columns, so the fitting does not change.","concept":"Linear in β, not necessarily in x.","source":"Lec 5.1, slide 25","options":["Because the fitted curve is always a straight line, whatever the degree","It is still linear in its coefficients β; only new columns are added","Because polynomial terms are removed again before fitting","Because it can only be used with one input feature at a time"],"answer":1,"whyWrong":["Polynomial terms let the fitted curve bend.",null,"The terms are kept; they are the new columns.","Polynomial features can be built from several features and their products."]},{"id":"L5-B09-2","lesson":5,"block":9,"topic":"Regularisation","type":"match","difficulty":"easy","skill":"recall","question":"Match each item to its effect.","explanation":"The penalised loss is MSE + λ × penalty. λ controls how much large weights cost.","concept":"λ sets the strength; L1 selects, L2 shrinks.","source":"Lec 5.1, slide 26","pairs":[{"left":"Ridge (L2 penalty)","right":"Shrinks every coefficient towards zero, never exactly to zero"},{"left":"Lasso (L1 penalty)","right":"Can drive coefficients exactly to zero"},{"left":"λ = 0","right":"Gives ordinary least squares"},{"left":"Very large λ","right":"Flattens coefficients so the model drifts towards predicting the mean"}]},{"id":"L5-B09-3","lesson":5,"block":9,"topic":"Regularisation","type":"tf","difficulty":"easy","skill":"recall","question":"In scikit-learn, setting Ridge's alpha to 0 applies the strongest possible penalty.","explanation":"alpha is the penalty strength (λ). alpha = 0 means no penalty, which is ordinary least squares.","concept":"alpha = λ; zero means no regularisation.","source":"Lec 5.1, slide 26, Lec 5.1, slide 27","answer":false},{"id":"L5-B09-4","lesson":5,"block":9,"topic":"Polynomial regression","type":"mcq","difficulty":"medium","skill":"understanding","question":"As the polynomial degree increases, what happens to bias and variance?","explanation":"Degree 1 has high bias and underfits curves; degree 10 follows every wobble and has high variance. Degree 2 to 3 is usually the sweet spot, chosen by cross-validation.","concept":"Degree sets the position on the bias-variance trade-off.","source":"Lec 5.1, slide 25, Lec 5.1, slide 36","options":["Bias increases and variance decreases","Both decrease","Both stay the same, because the model is still linear in β","Bias decreases and variance increases"],"answer":3,"whyWrong":["Higher degree makes the model more flexible, lowering bias and raising variance.","Flexibility does not reduce both at once; that is the trade-off.","Being linear in β does not stop flexibility from growing.",null]},{"id":"L5-B09-5","lesson":5,"block":9,"topic":"Regularisation","type":"mcq","difficulty":"hard","skill":"scenario","question":"A team has 200 samples and 150 features, many of which are probably irrelevant. They want a model that keeps only a small number of features so clinicians can read it. Which approach fits best?","explanation":"Lasso's L1 penalty performs automatic feature selection while fitting. Alpha should be tuned on validation folds.","concept":"Need fewer features? Use L1.","source":"Lec 5.1, slide 26, Lec 5.1, slide 27","options":["Ridge, because it removes irrelevant features by setting them to zero","Lasso, with alpha chosen by cross-validation","Ordinary least squares with alpha = 0, to avoid any penalty","Polynomial features of degree 3, to capture more patterns"],"answer":1,"whyWrong":["Ridge shrinks coefficients but never exactly to zero, so all 150 features remain.",null,"No penalty means no selection, and 150 features on 200 samples risks large, unstable weights.","This adds many more features, the opposite of what is needed."]},{"id":"L5-B10-1","lesson":5,"block":10,"topic":"Random forest regressor","type":"mcq","difficulty":"easy","skill":"recall","question":"What 'double randomness' makes the trees in a random forest regressor different from one another?","explanation":"Random data samples plus random feature subsets decorrelate the trees, which is why many trees beat one tree.","concept":"Decorrelated trees average out each other's errors.","source":"Lec 5.1, slide 29","options":["A random sample of rows and a random subset of features","A random learning rate and a random tree depth","Fitting each tree to the residuals of the previous one","A different, randomly chosen target variable"],"answer":0,"whyWrong":[null,"Random forests do not randomise the learning rate; that is a boosting parameter.","That is boosting.","Every tree predicts the same target."]},{"id":"L5-B10-2","lesson":5,"block":10,"topic":"Boosting","type":"tf","difficulty":"easy","skill":"recall","question":"In boosting, the trees are grown independently and in parallel, like in a random forest.","explanation":"Random forests grow trees independently. Boosting grows them one after another, each fitted to the errors left so far.","concept":"Forest: parallel. Boosting: sequential.","source":"Lec 5.1, slide 33","answer":false},{"id":"L5-B10-3","lesson":5,"block":10,"topic":"Gradient boosting hyperparameters","type":"match","difficulty":"easy","skill":"recall","question":"Match each gradient-boosting setting to the reason it is used.","explanation":"Shrinkage is the main guard against overfitting; shallow trees keep boosting meaningful; subsampling adds randomness.","concept":"Small steps, weak learners, random subsets.","source":"Lec 5.1, slide 34","pairs":[{"left":"Smaller learning_rate","right":"Shrinks each tree's contribution, so more trees are needed"},{"left":"max_depth of 2 to 4","right":"Keeps each tree a weak learner"},{"left":"subsample below 1.0","right":"Fits each tree on a random part of the data (stochastic boosting)"}]},{"id":"L5-B10-4","lesson":5,"block":10,"topic":"Random forest regressor","type":"mcq","difficulty":"medium","skill":"analysis","question":"A random forest regressor fits the training data almost perfectly but performs poorly on test data. Which change is most appropriate?","explanation":"Deep trees have high variance and capture noise. Limiting depth, or increasing min_samples_split, forces simpler, more general patterns.","concept":"Shallower trees generalise better.","source":"Lec 5.1, slide 31, Lec 5.1, slide 32","options":["Increase max_depth","Remove the test set and evaluate on training data","Decrease max_depth","Decrease min_samples_split"],"answer":2,"whyWrong":["Deeper trees capture even more noise, increasing overfitting.","This hides the problem rather than fixing it.",null,"Allowing splits on fewer samples lets trees grow more complex."]},{"id":"L5-B10-5","lesson":5,"block":10,"topic":"Feature importance","type":"mcq","difficulty":"hard","skill":"scenario","question":"A random forest on patient data gives these importances: BMI 0.35, S5 0.30, blood pressure 0.12, other serum measures smaller, and sex 0.01. A manager concludes: 'BMI causes disease progression, and sex can be dropped.' Which response is most accurate?","explanation":"Tree-based models rank BMI and S5 as most influential, and features with near-zero importance can often be dropped without losing accuracy. Neither statement establishes cause.","concept":"Importance describes the model, not the world.","source":"Lec 5.1, slide 15, Lec 5.1, slide 35","options":["The model relies most on BMI and S5 and may not need sex, but importance is not causation","Both conclusions are correct, because importance measures each feature's causal effect","Neither conclusion holds, because random forests cannot rank features at all","Sex must be kept, because low importance means the model has not learned it yet"],"answer":0,"whyWrong":[null,"Feature importance shows what the model uses; the lecture warns that associations are not proof of cause.","Random forests provide feature importances, as the lecture's code shows.","Near-zero importance suggests the feature adds little, so dropping it is reasonable after checking accuracy."]},{"id":"L5-B11-1","lesson":5,"block":11,"topic":"Assumptions of linear regression","type":"match","difficulty":"easy","skill":"recall","question":"If an assumption of linear regression fails, what goes wrong? Match each assumption or warning to its consequence.","explanation":"These are the lecture's four L-I-N-E conditions plus the multicollinearity warning, each with what happens when it fails.","concept":"Each assumption protects a different part of the result.","source":"Lec 5.1, slide 7","pairs":[{"left":"Linearity","right":"The model underfits and the errors follow a pattern"},{"left":"Independence","right":"The model looks better than it really is"},{"left":"Normality of errors","right":"p-values and confidence intervals cannot be trusted"},{"left":"Equal variance","right":"The model is accurate for some values and poor for others"},{"left":"Multicollinearity","right":"The weights become unstable and lose their meaning"}]},{"id":"L5-B11-2","lesson":5,"block":11,"topic":"Assumptions of linear regression","type":"tf","difficulty":"easy","skill":"recall","question":"In the lecture's L-I-N-E memory aid, the E stands for 'Equal variance': the spread of the residuals stays the same across the range.","explanation":"True. L is linearity, I independence, N normality of errors and E equal variance. Multicollinearity is listed separately as a warning.","concept":"L-I-N-E: linearity, independence, normality, equal variance.","source":"Lec 5.1, slide 7","answer":true},{"id":"L5-B11-3","lesson":5,"block":11,"topic":"Assumptions of linear regression","type":"mcq","difficulty":"easy","skill":"recall","question":"Which assumption states that one row of the data tells you nothing about another row?","explanation":"Independence is the I in L-I-N-E. If it fails, the model looks better than it really is.","concept":"Independence is about rows, not features.","source":"Lec 5.1, slide 7","options":["Linearity","Normality of errors","Equal variance","Independence"],"answer":3,"whyWrong":["Linearity is about each feature moving the target in a straight line.","Normality is about residuals being spread symmetrically around zero.","Equal variance is about residual spread staying the same across the range.",null]},{"id":"L5-B11-4","lesson":5,"block":11,"topic":"Assumptions of linear regression","type":"mcq","difficulty":"medium","skill":"analysis","question":"A model predicts one shop's daily sales. Its residuals show that today's error is strongly related to yesterday's error. Which assumption is violated, and what is the risk?","explanation":"Consecutive rows that carry information about each other break independence, which the lecture says makes the model look better than it really is.","concept":"Linked rows violate independence.","source":"Lec 5.1, slide 7","options":["Linearity; the model will underfit the curve","Normality of errors; predictions will be biased upward","Independence; the model will look better than it really is","Equal variance; errors will grow as sales grow"],"answer":2,"whyWrong":["The pattern is between consecutive rows, not a curved feature relationship.","Related errors break independence; normality is about the shape of the error distribution.",null,"That would be a funnel shape, not errors linked from one day to the next."]},{"id":"L5-B11-5","lesson":5,"block":11,"topic":"Assumptions of linear regression","type":"mcq","difficulty":"hard","skill":"scenario","question":"A house-price model uses area in m², the same area in ft², and number of rooms. Between training runs the two area coefficients swing wildly and one even turns negative. Its residual plot also fans out for expensive houses. Which two problems are present?","explanation":"Two columns carrying the same information make the weights unstable and meaningless (multicollinearity). A funnel-shaped residual plot means heteroscedasticity: the model is accurate for cheaper houses and poor for expensive ones.","concept":"Unstable weights mean duplicated features; a funnel means unequal variance.","source":"Lec 5.1, slides 7, 21","options":["Non-linearity, and too few features in the model overall","Dependent rows, plus residuals that are perfectly normal","Underfitting, plus an intercept that is much too large","Multicollinearity, and unequal residual variance"],"answer":3,"whyWrong":["A fan shape signals unequal variance; a U-shape would signal non-linearity.","Nothing suggests linked rows, and normal residuals would not be a problem.","Swinging coefficients point to duplicated information, not underfitting.",null]},{"id":"L5-B12-1","lesson":5,"block":12,"topic":"The diabetes dataset","type":"tf","difficulty":"easy","skill":"recall","question":"In the diabetes dataset, the progression target lies between 0 and 1 because it is standardised like the features.","explanation":"False. The features are standardised, but the target is a raw progression score from about 25 to 346.","concept":"Scaled inputs, unscaled target.","source":"Lec 5.1, slides 10, 11","answer":false},{"id":"L5-B12-2","lesson":5,"block":12,"topic":"Interpreting coefficients","type":"mcq","difficulty":"easy","skill":"recall","question":"In the simple diabetes model, the intercept is about 152. Because the features are centred, what does 152 represent?","explanation":"With centred features, x = 0 is the average, so the intercept is the predicted score for a patient at average BMI.","concept":"With centred data, the intercept is the prediction at the average.","source":"Lec 5.1, slides 14, 15","options":["The progression score for a patient with a BMI of zero","The increase in progression per unit of BMI","The number of patients in the dataset","The expected progression score for a patient at average BMI"],"answer":3,"whyWrong":["Centred data makes x = 0 the average, not a real BMI of zero.","That is the slope (about 949).","There are 442 patients; 152 is a prediction.",null]},{"id":"L5-B12-3","lesson":5,"block":12,"topic":"The diabetes dataset","type":"mcq","difficulty":"easy","skill":"recall","question":"According to the lecture, which features do tree-based models rank as the most influential for diabetes progression?","explanation":"The feature-importance slide says tree-based models rank BMI and S5 highest, while features like gender have near-zero importance.","concept":"BMI and S5 dominate; gender contributes little.","source":"Lec 5.1, slide 35","options":["Age and sex","Blood pressure and S1","BMI and S5","S2 and S3"],"answer":2,"whyWrong":["Sex (gender) is mentioned as having near-zero importance.","These are not the two features the lecture names as most influential.",null,"These serum measurements are not the ones the lecture highlights."]},{"id":"L5-B12-4","lesson":5,"block":12,"topic":"Interpreting coefficients","type":"mcq","difficulty":"medium","skill":"understanding","question":"The lecture says the upward BMI-progression trend shows correlation, not proof of cause. Why?","explanation":"A regression slope measures association. Confounding variables (the lecture mentions blood pressure versus BMI) can drive both. Adding predictors helps account for confounders but still does not prove cause.","concept":"A fitted slope is association, not causation.","source":"Lec 5.1, slides 15, 16","options":["Other factors linked to BMI could explain part of the trend","The slope of 949 is too large to be a causal effect","Correlation can only be measured in classification tasks","BMI is standardised, so its coefficient cannot be read at all"],"answer":0,"whyWrong":[null,"Size does not decide causality.","Correlation applies to numeric targets as well.","Scaling changes the units, but the coefficient can still be read."]},{"id":"L5-B12-5","lesson":5,"block":12,"topic":"Using the test set","type":"mcq","difficulty":"hard","skill":"scenario","question":"A researcher using the 442-patient diabetes data makes one 80/20 split. They try ten values of max_depth, check test R² after each, and report the best test R² of 0.52. They also drop sex because its importance is near zero. What is the main flaw?","explanation":"Hyperparameters must be tuned on validation folds only, and the test set touched once at the end. With only 442 patients, K-fold cross-validation gives a far more stable estimate than one hold-out split.","concept":"Never tune on the test set.","source":"Lec 5.1, slides 13, 24, 35","options":["Dropping a feature with near-zero importance invalidates the whole model","R² is not a valid metric for judging any regression model at all","Tuning on the test set inflates 0.52; tune with K-fold CV, then test once","An 80/20 split is not allowed for a dataset of this size at all"],"answer":2,"whyWrong":["The lecture says such features can often be dropped without losing accuracy.","R² is one of the lecture's standard regression metrics.",null,"The lecture calls 80/20 standard practice for medium-sized datasets."]},{"id":"L5-X1","lesson":5,"block":0,"topic":"Boosting","type":"mcq","difficulty":"medium","skill":"understanding","question":"Does boosting mainly reduce bias or variance, and why?","explanation":"Each tree is fitted to the residuals left behind, so the ensemble steadily reduces systematic error. Gradient boosting is gradient descent in function space.","concept":"Bagging tames variance; boosting attacks bias.","source":"Lec 5.1, slide 33, Lec 5.1, slide 36","options":["Variance, because trees are averaged in parallel","Neither, because boosting only speeds up training","Bias, because each new tree corrects the remaining errors","Variance, because each tree is fully grown"],"answer":2,"whyWrong":["Parallel averaging describes bagging, which mainly reduces variance.","Boosting reduces error tree by tree; it is not a speed technique.",null,"Boosting uses shallow, weak trees."]},{"id":"L5-X2","lesson":5,"block":0,"topic":"Ensemble learning","type":"tf","difficulty":"easy","skill":"recall","question":"Ensembles combine multiple weak learners to create a strong learner, reducing error by averaging out individual models' biases or variances.","explanation":"This is the 'wisdom of the crowd' idea behind random forests and boosting.","concept":"Many weak learners can make one strong learner.","source":"Lec 5.1, slide 28","answer":true},{"id":"L5-X3","lesson":5,"block":0,"topic":"Data partitioning","type":"mcq","difficulty":"easy","skill":"recall","question":"What split does the lecture describe as standard practice for a medium-sized dataset?","explanation":"An 80/20 split trains on one part and judges on the other, so the model is evaluated on unseen data.","concept":"Train on one part, judge on the other.","source":"Lec 5.1, slide 13","options":["50% training, 50% test","80% training, 20% test","100% training, evaluated on the same data","20% training, 80% test"],"answer":1,"whyWrong":["This wastes a large share of data on testing.",null,"Evaluating on training data does not measure generalisation.","This leaves too little data to fit the model."]},{"id":"L5-X4","lesson":5,"block":0,"topic":"Regression metrics","type":"mcq","difficulty":"medium","skill":"understanding","question":"MAE is easier to explain, so why is MSE usually the loss used to train regression models?","explanation":"The lecture's metrics table describes MSE as smooth and differentiable, hence used as the training loss, while MAE is robust and easy to explain to clinicians.","concept":"Train with a loss that is easy to optimise; report metrics that are easy to read.","source":"Lec 5.1, slide 20","options":["MSE is robust to outliers, unlike MAE","MSE is reported in the same units as the target","MSE is smooth and differentiable, which suits gradient descent","MSE always gives a higher R² than MAE"],"answer":2,"whyWrong":["MSE is more sensitive to outliers, because errors are squared.","MSE is in squared units; RMSE returns to the target's units.",null,"R² is a separate metric; the choice of loss does not guarantee a higher R²."]},{"id":"L5-X5","lesson":5,"block":0,"topic":"Assumptions of linear regression","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why does the lecture treat multicollinearity as a warning about the weights rather than a problem with the errors?","explanation":"When two features nearly duplicate each other, many different weight combinations fit equally well, so the individual weights become unstable and lose their meaning even if overall predictions are fine.","concept":"Multicollinearity confuses the weights, not necessarily the predictions.","source":"Lec 5.1, slide 7","options":["Because multicollinearity makes the residuals grow larger for high values","Because multicollinearity only occurs in classification, not regression","Because multicollinearity makes the prediction for every row exactly zero","Near-duplicate features make it unclear how to split credit between weights"],"answer":3,"whyWrong":["That describes unequal variance, which is about the errors.","It is a regression issue the lecture lists right next to L-I-N-E.","Predictions can still be reasonable; it is the individual weights that become unstable.",null]}]}</script>
<script type="application/json" id="guide">{"1":{"toc":[["g1-how-it-all-fits-the-flow","How it all fits (the flow)"],["g1-the-big-picture","The big picture"],["g1-types-of-ai","Types of AI"],["g1-learning-paradigms","Learning paradigms"],["g1-history-in-one-breath","History in one breath"],["g1-ai-agents","AI agents"],["g1-exam-traps","Exam traps"]],"html":"<h2 id=\"g1-how-it-all-fits-the-flow\" class=\"flow\">How it all fits (the flow)<\/h2><ol><li><b>Start with the goal:<\/b> AI means building systems that perceive, reason, learn and act. ML is the part that learns from data; DL is ML with deep neural networks.<\/li><li><b>Pick how it learns:<\/b> labelled data → supervised; no labels → unsupervised; labels made from the data itself → self-supervised; rewards from an environment → reinforcement.<\/li><li><b>Wrap it in a system:<\/b> data layer → model layer → reasoning/orchestration → action (tools/APIs), with monitoring and governance around everything.<\/li><li><b>Make it an agent:<\/b> an agent senses its environment, decides, and acts. Describe the job with <b>PEAS<\/b> (Performance, Environment, Actuators, Sensors), then choose the agent type that fits (simple reflex → model-based → goal-based → utility-based → learning).<\/li><li><b>Check it:<\/b> evaluate on unseen data with task-fit metrics, and look for bias and failure cases.<\/li><\/ol><h2 id=\"g1-the-big-picture\">The big picture<\/h2><ul><li><b>AI<\/b> = systems that perform tasks needing human-like intelligence: perceiving, reasoning, learning, acting.<\/li><li><b>Why now:<\/b> more data, cheaper compute (GPUs/cloud), better algorithms, and easy access through APIs and tools.<\/li><li><b>AI ⊃ ML ⊃ DL.<\/b> ML learns patterns from data instead of hand-written rules. DL is ML with multi-layer neural networks. Data science analyses data to support decisions; automation follows fixed rules and does not learn.<\/li><li><b>AI system stack:<\/b> data layer → model layer → reasoning/orchestration layer (plans, checks, routes) → action layer (tools, APIs) → plus monitoring and governance around it.<\/li><\/ul><h2 id=\"g1-types-of-ai\">Types of AI<\/h2><div class=\"tbl-wrap\"><table><thead><tr><th>By functionality<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Reactive<\/td><td>Responds to the current input only, no memory<\/td><\/tr><tr><td>Limited memory<\/td><td>Uses recent data/experience (most modern AI)<\/td><\/tr><tr><td>Theory of mind<\/td><td>Would understand beliefs and intentions (research)<\/td><\/tr><tr><td>Self-aware<\/td><td>Hypothetical<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Symbolic AI:<\/b> explicit rules and logic; transparent but brittle. <b>Subsymbolic:<\/b> learns from data (neural nets); flexible but harder to explain. <b>Hybrid:<\/b> combines both.<\/li><\/ul><h2 id=\"g1-learning-paradigms\">Learning paradigms<\/h2><div class=\"tbl-wrap\"><table><thead><tr><th>Paradigm<\/th><th>Data<\/th><th>Typical task<\/th><\/tr><\/thead><tbody><tr><td>Supervised<\/td><td>Labelled examples (input → correct answer)<\/td><td>Classification, regression<\/td><\/tr><tr><td>Unsupervised<\/td><td>No labels<\/td><td>Clustering, finding structure<\/td><\/tr><tr><td>Self-supervised<\/td><td>Labels created from the data itself (e.g. predict the next word)<\/td><td>Pre-training large models<\/td><\/tr><tr><td>Reinforcement<\/td><td>Rewards and penalties from an environment<\/td><td>Games, robotics, control<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Deep learning:<\/b> powerful on images, speech and text; needs lots of data and compute, and is harder to interpret.<\/li><li><b>Generative AI:<\/b> creates new text, images, code or audio. Concerns: accuracy, copyright, misuse and evaluation.<\/li><li><b>Evaluation:<\/b> use metrics that fit the task, test on unseen data, and check for bias and failure cases, not just accuracy.<\/li><\/ul><h2 id=\"g1-history-in-one-breath\">History in one breath<\/h2><ul><li>Turing (machine intelligence), Shannon (information theory), Dartmouth 1956 (the term \"AI\") → early <b>symbolic optimism<\/b> (overpromised) → <b>perceptron<\/b> (single layer, limited) → <b>expert systems<\/b> (rules, hard to maintain) → <b>AI winters<\/b> (funding fell when promises failed) → <b>deep learning<\/b> (CNNs + big data + GPUs) → <b>transformers<\/b> (attention; language became an input *and* a control interface for software).<\/li><li>Lesson the lecture draws: hype outruns capability; judge systems by evidence.<\/li><\/ul><h2 id=\"g1-ai-agents\">AI agents<\/h2><ul><li><b>Agent<\/b> = perceives its environment, decides, and <b>acts<\/b> (often with tools) to reach a goal, using feedback. A chatbot only answers; an agent's mistakes become actions, so it needs stronger controls.<\/li><li><b>PEAS:<\/b> Performance measure, Environment, Actuators, Sensors.<\/li><li><b>Environment properties:<\/b> fully vs partially observable; deterministic vs uncertain; episodic vs sequential; static vs dynamic; single vs multi-agent.<\/li><\/ul><div class=\"tbl-wrap\"><table><thead><tr><th>Agent type<\/th><th>Decides by<\/th><\/tr><\/thead><tbody><tr><td>Simple reflex<\/td><td>Condition-action rules on the current input<\/td><\/tr><tr><td>Model-based<\/td><td>Keeps an internal model of the world for what it can't see<\/td><\/tr><tr><td>Goal-based<\/td><td>Chooses actions that reach a goal<\/td><\/tr><tr><td>Utility-based<\/td><td>Chooses the action with the best expected outcome/trade-off<\/td><\/tr><tr><td>Learning<\/td><td>Improves from feedback (performance element, learning element, critic, problem generator)<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>LLM agents:<\/b> an LLM plans and calls tools. Common failures: wrong actions, loops, ignoring limits, false information.<\/li><li><b>Tools<\/b> extend what an agent can do; <b>memory<\/b> (short-term context, long-term stores, retrieval/RAG grounding) and <b>planning<\/b> (break goals into steps, check progress).<\/li><li><b>Multi-agent systems:<\/b> agents share tasks and check each other; can behave unpredictably → need clear roles, communication rules, authority limits, conflict handling and human supervision.<\/li><li><b>Governance / safety controls:<\/b> least privilege, logging, human approval for important actions, red teaming, citing sources.<\/li><li><b>Evaluating agents:<\/b> task success, tool-call accuracy, safety, cost and reliability, not only text quality.<\/li><\/ul><h2 id=\"g1-exam-traps\" class=\"trap\">Exam traps<\/h2><ul><li>Automation ≠ AI: fixed rules that never learn are automation.<\/li><li>Self-supervised is not unsupervised: labels are made from the data itself.<\/li><li>An agent is defined by <b>acting<\/b>, not by being a chatbot.<\/li><li>Tool-call accuracy is agent-specific; precision/F1/AUC are ordinary model metrics.<\/li><\/ul>"},"2":{"toc":[["g2-how-it-all-fits-the-flow","How it all fits (the flow)"],["g2-why-preprocessing","Why preprocessing"],["g2-types-and-scales","Types and scales"],["g2-data-quality-dimensions","Data-quality dimensions"],["g2-cleaning-principles-and-documentation","Cleaning principles and documentation"],["g2-missing-values","Missing values"],["g2-encoding","Encoding"],["g2-scaling","Scaling"],["g2-leakage-and-safe-workflow","Leakage and safe workflow"],["g2-exam-traps","Exam traps"]],"html":"<h2 id=\"g2-how-it-all-fits-the-flow\" class=\"flow\">How it all fits (the flow)<\/h2><p>Raw data is messy, and models only learn what the data shows them. So before modelling:<\/p><ol><li><b>Understand the data:<\/b> identify each column's type and scale (nominal, ordinal, interval, ratio).<\/li><li><b>Check quality:<\/b> accuracy, completeness, consistency, timeliness, validity, uniqueness. Document every change you make.<\/li><li><b>Handle missing values:<\/b> find why they are missing, then drop or impute (mean/median/mode or model-based).<\/li><li><b>Encode categories<\/b> into numbers (one-hot for nominal, ordinal encoding when order matters; watch high cardinality).<\/li><li><b>Scale numbers<\/b> so features are comparable (standardise or min-max; robust scaling when there are outliers).<\/li><li><b>Split first, then fit<\/b> every cleaning step on the training set only, so no test information leaks into the model.<\/li><\/ol><h2 id=\"g2-why-preprocessing\">Why preprocessing<\/h2><ul><li>Raw data is rarely ready: missing values, inconsistent labels, invalid values, duplicates, outliers.<\/li><li><b>Goal:<\/b> data that is *analytically defensible*, not artificially perfect. Preprocessing = understanding, validation, transformation <b>and documentation<\/b>.<\/li><li><b>Hierarchy:<\/b> data (raw value) → information (value in context) → knowledge (interpreted pattern) → decision (action).<\/li><\/ul><h2 id=\"g2-types-and-scales\">Types and scales<\/h2><div class=\"tbl-wrap\"><table><thead><tr><th>Structure<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>Structured<\/td><td>Rows/columns, fixed schema (CSV, SQL)<\/td><\/tr><tr><td>Semi-structured<\/td><td>Tags/keys, flexible schema (JSON, XML, HTML)<\/td><\/tr><tr><td>Unstructured<\/td><td>No table format (images, audio, video, free text)<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tbl-wrap\"><table><thead><tr><th>Scale<\/th><th>Meaning<\/th><th>Usual treatment<\/th><\/tr><\/thead><tbody><tr><td>Nominal<\/td><td>Categories, no order<\/td><td>One-hot (or 0/1 if binary)<\/td><\/tr><tr><td>Ordinal<\/td><td>Ordered categories, unequal gaps<\/td><td>Ordinal encoding, used cautiously<\/td><\/tr><tr><td>Ratio<\/td><td>True zero; ratios meaningful<\/td><td>Impute/scale as needed<\/td><\/tr><tr><td>Identifier<\/td><td>Labels a record<\/td><td>Use for checks, then exclude as a feature<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"g2-data-quality-dimensions\">Data-quality dimensions<\/h2><ul><li><b>Completeness<\/b> (values present), <b>Validity<\/b> (obeys rules, e.g. no negative fare), <b>Consistency<\/b> (same labels), <b>Uniqueness<\/b> (no duplicate records), <b>Relevance<\/b> (helps the question), <b>Timeliness<\/b> (right period).<\/li><li><b>Invalid vs outlier:<\/b> invalid is *impossible* (negative age) → investigate/mark missing; an outlier is *unusual but possibly real* (very high fare) → don't delete blindly.<\/li><li><b>Duplicates<\/b> inflate sample size and bias statistics; check with a unique ID.<\/li><li><b>Category cleaning:<\/b> \"male\", \"Male\", \" m \" → one label, *before* encoding, or you get fake extra columns.<\/li><\/ul><h2 id=\"g2-cleaning-principles-and-documentation\">Cleaning principles and documentation<\/h2><ul><li>Cleaning ≠ deleting inconvenient data. Every rule needs domain knowledge, documentation or statistical evidence.<\/li><li><b>Keep the raw file unchanged<\/b>; work on a copy.<\/li><li><b>Cleaning log:<\/b> for each rule record *which column changed, the condition used, and why*. Supports reproducibility, peer review and error recovery.<\/li><li>Typical log lines: drop a column (missingness too high), impute (numeric, moderate missingness), encode (categories → numbers), scale (much larger range), exclude (identifier).<\/li><\/ul><h2 id=\"g2-missing-values\">Missing values<\/h2><ul><li>Can appear as NaN/NULL, blanks, text like \"Unknown\"/\"N/A\", <b>sentinel codes<\/b> (-999, 9999: dangerous, look like real numbers), or <b>structural missing<\/b> (not applicable; don't always impute).<\/li><\/ul><div class=\"tbl-wrap\"><table><thead><tr><th>Mechanism<\/th><th>Missingness depends on<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>MCAR<\/td><td>Nothing (pure chance)<\/td><td>Random import error<\/td><\/tr><tr><td>MAR<\/td><td>Other *observed* variables<\/td><td>Age missing more for one class<\/td><\/tr><tr><td>MNAR<\/td><td>The missing value itself<\/td><td>High earners refuse to report income<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Deletion:<\/b> listwise (drop rows) is easy but loses data; column deletion for very sparse columns. OK when missingness is small and plausibly random; always report it.<\/li><li><b>Imputation:<\/b> mean (symmetric data; outlier-sensitive), <b>median<\/b> (skewed data, safer for age-like variables), <b>mode<\/b> (categorical), constant such as \"Unknown\" (when meaningful).<\/li><li><b>Missing indicator:<\/b> 1 if missing, 0 otherwise; useful when *being missing carries information*, but it may encode collection bias.<\/li><li><b>Cautions on heavy imputation:<\/b> imputed values are estimates, not facts; many filled values create <b>false precision<\/b>; if missingness follows social or demographic groups it can create <b>unfairness<\/b>. Report what, how and why, and run <b>sensitivity analysis<\/b> in serious work.<\/li><\/ul><h2 id=\"g2-encoding\">Encoding<\/h2><div class=\"tbl-wrap\"><table><thead><tr><th>Method<\/th><th>Use for<\/th><th>Danger<\/th><\/tr><\/thead><tbody><tr><td>Binary 0/1<\/td><td>Two categories<\/td><td>Not for more than two<\/td><\/tr><tr><td>Label encoding<\/td><td>Target labels, ordinal categories<\/td><td>On nominal features it implies a false order (S &gt; Q &gt; C)<\/td><\/tr><tr><td>Ordinal encoding<\/td><td>Ordered categories<\/td><td>Keeps order but assumes equal gaps<\/td><\/tr><tr><td>One-hot<\/td><td>Nominal categories<\/td><td>Adds columns; drop one category for regression<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Order:<\/b> inspect → clean categories → handle missingness → encode.<\/li><li><b>High cardinality<\/b> (many unique values: names, tickets, IDs): one-hot creates many near-unique columns and lets models memorise rows. Exclude, reduce to an indicator, or treat as feature engineering (grouping) later.<\/li><li>Don't put the target into the feature pipeline.<\/li><\/ul><h2 id=\"g2-scaling\">Scaling<\/h2><div class=\"tbl-wrap\"><table><thead><tr><th>Scaler<\/th><th>Formula idea<\/th><th>Outliers<\/th><th>Good for<\/th><\/tr><\/thead><tbody><tr><td>Standardisation (z-score)<\/td><td>(x − mean) / std → mean 0, std 1<\/td><td>Sensitive<\/td><td>Linear models, SVM, neural nets<\/td><\/tr><t
