<style>
/* Layout: an exam paper on a cool desk. One centred column of cards; the question sheet is the hero of every session. */
:root {
  --paper: #F3F5F8;
  --surface: #FFFFFF;
  --surface-2: #F7F8FB;
  --ink: #18213A;
  --ink-2: #4B5571;
  --ink-3: #6E7791;
  --line: #DCE1EA;
  --accent: #1D6B74;
  --accent-ink: #FFFFFF;
  --accent-soft: #E0EFF0;
  --mark: #F2C14E;
  --mark-soft: #FFF4D4;
  --good: #1D7344;
  --good-soft: #E2F2E8;
  --bad: #B0281F;
  --bad-soft: #FBE6E4;
  --warn: #8E5B00;
  --warn-soft: #FFF1D2;
  --shadow: 0 1px 2px rgba(24, 33, 58, .06), 0 4px 16px rgba(24, 33, 58, .05);
  --f-display: "Literata", Georgia, "Times New Roman", serif;
  --f-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10141D; --surface: #181E2B; --surface-2: #1D2433; --ink: #E6E9F1; --ink-2: #A9B1C6; --ink-3: #8790A8;
    --line: #2A3346; --accent: #62C3CC; --accent-ink: #0D1A1C; --accent-soft: #15333A; --mark: #E9B843; --mark-soft: #392D10;
    --good: #67CF94; --good-soft: #14301F; --bad: #F48A82; --bad-soft: #3A1B1B; --warn: #F1C062; --warn-soft: #362A10;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10141D; --surface: #181E2B; --surface-2: #1D2433; --ink: #E6E9F1; --ink-2: #A9B1C6; --ink-3: #8790A8;
  --line: #2A3346; --accent: #62C3CC; --accent-ink: #0D1A1C; --accent-soft: #15333A; --mark: #E9B843; --mark-soft: #392D10;
  --good: #67CF94; --good-soft: #14301F; --bad: #F48A82; --bad-soft: #3A1B1B; --warn: #F1C062; --warn-soft: #362A10;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); }
body { color: var(--ink); font: 15px/1.55 var(--f-ui); }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 0 64px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.7rem, 4vw, 2.3rem); letter-spacing: -.01em; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: .85rem; }
.eyebrow { font-size: .72rem; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.card.raised { box-shadow: var(--shadow); }
.section { display: flex; flex-direction: column; gap: 14px; margin-top: 30px; }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); }
.topbar .wrap { padding-block: 10px; display: flex; align-items: center; gap: 12px; justify-content: space-between; }
.brand { display: flex; align-items: baseline; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; }
.brand b { font-family: var(--f-display); font-size: 1.15rem; font-weight: 600; }
.brand span { font-size: .78rem; color: var(--ink-3); font-family: var(--f-mono); }
.sync { font-size: .75rem; color: var(--ink-3); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; min-height: 40px; text-align: center; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 6px 10px; min-height: 34px; font-size: .88rem; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* chips and pills */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.chip.acc { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.diff { display: inline-flex; gap: 3px; align-items: center; }
.diff i { width: 7px; height: 7px; border-radius: 2px; background: var(--line); display: inline-block; }
.diff.easy i:nth-child(1), .diff.medium i:nth-child(-n+2), .diff.hard i { background: currentColor; }

/* bars */
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; display: flex; }
.bar > span { display: block; height: 100%; }
.bar .m { background: var(--good); }
.bar .a { background: color-mix(in srgb, var(--accent) 55%, transparent); }
.bar .x { background: var(--bad); }

/* stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { padding: 12px 14px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }
.stat b { display: block; font-family: var(--f-mono); font-size: 1.35rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat span { font-size: .8rem; color: var(--ink-2); }

/* lesson cards */
.lesson-card { display: flex; flex-direction: column; gap: 12px; text-align: left; cursor: pointer; transition: border-color .15s, transform .15s; }
.lesson-card:hover { border-color: var(--accent); }
.lesson-num { font-family: var(--f-mono); font-size: .8rem; color: var(--accent); font-weight: 500; }
.lesson-card h3 { font-size: 1.12rem; }
.lesson-card .meta { display: flex; justify-content: space-between; font-size: .82rem; color: var(--ink-2); }
.comp-card { border: 1.5px dashed color-mix(in srgb, var(--accent) 55%, var(--line)); background: var(--accent-soft); }

/* hero */
.hero { padding-top: 28px; display: grid; gap: 18px; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); align-items: end; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } }
.hero p.lede { font-size: 1rem; color: var(--ink-2); max-width: 60ch; margin-top: 8px; }
.resume { border-left: 4px solid var(--mark); }

/* lists */
.list { display: flex; flex-direction: column; }
.list > * { padding: 10px 0; border-top: 1px solid var(--line); }
.list > *:first-child { border-top: 0; }
.topic-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; }

/* forms */
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { font-weight: 600; margin-bottom: 8px; padding: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; cursor: pointer; background: var(--surface); font-size: .9rem; }
.seg input { accent-color: var(--accent); }
.seg label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
input[type="number"] { width: 90px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.field { display: grid; gap: 4px; }
.field input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; }
.field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); max-width: 100%; }

.guide-tabs { gap: 6px; flex-wrap: wrap; }
.guide-toc { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 8px 0 14px; font-size: .88rem; }
.guide-toc a { color: var(--accent); text-decoration: none; }
.guide { line-height: 1.6; max-width: 860px; min-width: 0; }
.guide h2 { font-size: 1.15rem; margin: 22px 0 8px; padding-top: 12px; border-top: 1px solid var(--line); scroll-margin-top: 70px; }
.guide h2:first-child { margin-top: 0; border-top: 0; padding-top: 0; }
.guide h2.trap { color: var(--bad, #b3261e); }
.guide ol { margin: 6px 0 10px; padding-left: 22px; } .guide h2.flow + ol { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px 12px 34px; }
.guide ul { margin: 6px 0 10px; padding-left: 20px; } .guide li { margin: 3px 0; }
.guide table { margin: 8px 0 12px; } .guide code { font-family: var(--f-mono); font-size: .9em; }
/* table */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; }
td.num, th.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* session */
.session { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 18px; margin-top: 18px; align-items: start; }
@media (max-width: 860px) { .session { grid-template-columns: 1fr; } }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: clamp(16px, 3vw, 28px); display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.qtext { font-family: var(--f-display); font-size: 1.12rem; line-height: 1.6; max-width: 68ch; }
.qid { font-family: var(--f-mono); font-size: .76rem; color: var(--ink-3); }
.opts { display: flex; flex-direction: column; gap: 9px; }
.opt { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; text-align: left; border: 1.5px solid var(--line); background: var(--surface); padding: 11px 13px; border-radius: 9px; cursor: pointer; line-height: 1.45; }
.opt:hover:not([disabled]) { border-color: var(--ink-3); }
.opt .key { font-family: var(--f-mono); font-size: .8rem; width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink-2); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .key { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt[disabled] { cursor: default; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match { display: flex; flex-direction: column; gap: 10px; }
.match-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 10px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); }
@media (max-width: 560px) { .match-row { grid-template-columns: 1fr; } }
.match-row select { width: 100%; }
.match-row.right { border-color: var(--good); }
.match-row.wrong { border-color: var(--bad); }
.nav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; }
.nav-grid button { font-family: var(--f-mono); font-size: .8rem; height: 36px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; position: relative; }
.nav-grid button.ans { background: var(--accent-soft); border-color: transparent; }
.nav-grid button.ok { background: var(--good-soft); color: var(--good); border-color: transparent; }
.nav-grid button.no { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.nav-grid button.cur { outline: 2px solid var(--ink); outline-offset: 1px; }
.nav-grid button.flag::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--mark); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: .75rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; border: 1px solid var(--line); }
.sticky-side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 860px) { .sticky-side { position: static; } }
.feedback { border-radius: 9px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line); background: var(--surface-2); }
.feedback.ok { border-color: var(--good); background: var(--good-soft); }
.feedback.no { border-color: var(--bad); background: var(--bad-soft); }
.feedback .verdict { font-weight: 700; }
.why { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.concept { border-left: 3px solid var(--mark); padding: 4px 0 4px 10px; font-size: .92rem; }
details summary { cursor: pointer; color: var(--ink-2); font-size: .85rem; }
.timer { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); font-weight: 600; }

/* results */
.score-ring { display: flex; align-items: baseline; gap: 10px; }
.score-ring b { font-family: var(--f-display); font-size: 3rem; font-weight: 600; line-height: 1; }
.review-item { display: flex; flex-direction: column; gap: 10px; }
.ans-line { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px; font-size: .93rem; }
@media (max-width: 520px) { .ans-line { grid-template-columns: 1fr; } }
@media (max-width: 480px) { .brand span, .sync { display: none; } .brand b { white-space: nowrap; } }

/* modal and toast */
.modal-bg { position: fixed; inset: 0; background: rgba(10, 14, 24, .5); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--surface); color: var(--ink); border-radius: 12px; border: 1px solid var(--line); max-width: 460px; width: 100%; padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; z-index: 60; font-size: .9rem; max-width: calc(100% - 32px); }
.banner { border-radius: 9px; padding: 12px 14px; background: var(--warn-soft); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
.empty { text-align: center; padding: 28px 16px; color: var(--ink-2); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.crumbs { margin-top: 18px; font-size: .85rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script type="application/json" id="bank">{"version":1,"course":"IT7101 / IT7103 Advanced AI Applications","lessons":[{"id":1,"title":"Artificial Intelligence & AI Agents","short":"AI & Agents"},{"id":2,"title":"Data Cleaning & Preprocessing","short":"Data Cleaning"},{"id":3,"title":"Advanced Data Processing","short":"Adv. Data Processing"},{"id":4,"title":"Classification & Ensemble Classification","short":"Classification"},{"id":5,"title":"Regression & Ensemble Regression","short":"Regression"}],"questions":[{"id":"L1-B01-1","lesson":1,"block":1,"topic":"AI, ML, DL, data science and automation","type":"tf","difficulty":"easy","skill":"recall","question":"Deep learning is a family within machine learning that uses multi-layer neural networks to learn representations automatically.","explanation":"The lecture places deep learning inside machine learning, and machine learning inside the broad field of AI. Its defining feature is multi-layer neural networks that learn representations rather than relying on hand-crafted features.","concept":"AI is the broad field; ML is one approach within it; DL is one family within ML.","source":"Lec 1, slide 7","answer":true},{"id":"L1-B01-2","lesson":1,"block":1,"topic":"AI, ML, DL, data science and automation","type":"mcq","difficulty":"easy","skill":"recall","question":"Which term describes a system that follows fixed procedures without learning from data?","explanation":"The lecture defines automation as following rules or fixed procedures, possibly without any learning. Invoice routing by fixed rules is the slide's example.","concept":"Automation follows rules; machine learning learns from data.","source":"Lec 1, slide 7","options":["Machine learning","Deep learning","Automation","Data science"],"answer":2,"whyWrong":["ML systems improve from data or experience instead of following only hand-written rules.","Deep learning learns representations with multi-layer neural networks; it is a learning method.",null,"Data science extracts insight using statistics, databases, visualization and domain analysis."]},{"id":"L1-B01-3","lesson":1,"block":1,"topic":"AI, ML, DL, data science and automation","type":"match","difficulty":"easy","skill":"recall","question":"Match each term to its core idea.","explanation":"These are the core ideas from the comparison table. AI is the umbrella; ML and DL are learning approaches; data science overlaps with AI but also includes statistics and visualization; automation can work without learning.","concept":"Each term answers a different question: what it aims for, and how it gets there.","source":"Lec 1, slide 7","pairs":[{"left":"Artificial intelligence","right":"Goal-directed intelligent behaviour"},{"left":"Machine learning","right":"Learns from data"},{"left":"Deep learning","right":"Learns representations"},{"left":"Data science","right":"Extracts insight"},{"left":"Automation","right":"Follows rules"}]},{"id":"L1-B01-4","lesson":1,"block":1,"topic":"Working definition of AI","type":"mcq","difficulty":"medium","skill":"understanding","question":"The lecture says definitions of AI change over time. What is the reason it gives?","explanation":"Once a task becomes well understood and routine, people stop calling it intelligent, so the boundary of what counts as AI moves.","concept":"AI is defined by what it does (maps observations and objectives to decisions or actions), and the bar for 'intelligent' moves as tasks become routine.","source":"Lec 1, slide 6","options":["Tasks once seen as intelligent can later become routine automation","AI research stopped during the AI winters, so old definitions were lost","Only deep learning systems are considered AI today","A rigorous definition must leave out social consequences"],"answer":0,"whyWrong":[null,"AI winters slowed progress, but they are not given as the reason definitions shift.","The lecture explicitly includes symbolic, search, planning and rule-based approaches within AI.","The lecture says the opposite: a rigorous definition must include technical mechanisms and social consequences."]},{"id":"L1-B01-5","lesson":1,"block":1,"topic":"AI, ML, DL, data science and automation","type":"mcq","difficulty":"hard","skill":"scenario","question":"A city council's complaints office uses a program that applies a fixed table of keywords and if-then rules to forward each complaint to a department. Staff call it 'our AI'. A consultant proposes replacing it with a model trained on three years of complaints that staff have already tagged with the correct department. Which description of the two systems is most accurate?","explanation":"The existing program follows fixed rules and does not improve from data, which the lecture calls automation. The proposal learns a mapping from inputs to known labels (departments) using historical labelled examples, which is supervised machine learning.","concept":"Ask two questions: does the system learn from data, and are there labels? Fixed rules with no learning is automation; learning from labelled examples is supervised ML.","source":"Lec 1, slide 7, Lec 1, slide 12","options":["Both are deep learning, because both process written text","The current program is rule-based automation; the proposal is supervised machine learning","The proposal is data science rather than AI, because it uses historical data","Both are unsupervised learning, because no human reads the complaints at prediction time"],"answer":1,"whyWrong":["Processing text does not make a system deep learning. The current program learns nothing, and the proposal does not say it uses multi-layer neural networks.",null,"A model that learns to predict a department from labelled examples is machine learning. Data science centres on extracting insight, for example in dashboards.","Whether a human reads new complaints is irrelevant. The proposal learns from tagged examples, which makes it supervised."]},{"id":"L1-B02-1","lesson":1,"block":2,"topic":"Working definition of AI","type":"mcq","difficulty":"easy","skill":"recall","question":"Which sequence matches the lecture's core abstraction of an AI system?","explanation":"The slide's core abstraction is: observation, then internal state, then decision, then action, then feedback that informs the next cycle.","concept":"AI perceives, represents, reasons or learns, then acts toward goals and uses feedback.","source":"Lec 1, slide 6","options":["Observation, internal state, decision, action, feedback","Decision, observation, action, internal state, feedback","Action, feedback, observation, decision, internal state","Observation, action, internal state, feedback, decision"],"answer":0,"whyWrong":[null,"A system cannot decide before it has observed anything; observation comes first.","Action is driven by a decision; it does not start the cycle.","Acting before forming an internal state and a decision skips the reasoning step."]},{"id":"L1-B02-2","lesson":1,"block":2,"topic":"AI system stack","type":"tf","difficulty":"easy","skill":"recall","question":"In the AI system stack, user interfaces, APIs, audit logs, human approval and rollback procedures belong to the action layer.","explanation":"The action layer is where the system touches the world: interfaces, APIs, tools, robots, monitoring, audit logs, human approval and rollback.","concept":"Data layer, model layer, reasoning/orchestration layer, action layer: each has its own responsibilities.","source":"Lec 1, slide 8","answer":true},{"id":"L1-B02-3","lesson":1,"block":2,"topic":"Why AI matters now","type":"tf","difficulty":"easy","skill":"recall","question":"According to the lecture, institutional governance of AI is moving faster than adoption, so evaluation, accountability and safety are ahead of capability.","explanation":"The lecture says the reverse. Adoption is moving faster than institutional governance, and evaluation, accountability, privacy and safety still lag behind capability.","concept":"Capability and adoption are ahead of governance, which is why responsible deployment is part of the course.","source":"Lec 1, slide 5","answer":false},{"id":"L1-B02-4","lesson":1,"block":2,"topic":"AI system stack","type":"mcq","difficulty":"medium","skill":"application","question":"A team adds a component that checks every generated plan against budget limits and runs a simulation before any tool is called. Which layer of the AI system stack does this component belong to?","explanation":"The reasoning and orchestration layer contains retrieval, memory, constraints, planning, simulation, testing and decision logic. Checking plans against constraints and simulating them fits there.","concept":"Orchestration sits between the model and the action: it decides what to do with model outputs.","source":"Lec 1, slide 8","options":["Data layer","Model layer","Reasoning and orchestration layer","Action layer"],"answer":2,"whyWrong":["The data layer covers collection, labels, cleaning, consent, lineage and governance of data.","The model layer holds the rules, statistical models, neural networks or foundation models that produce outputs.",null,"The action layer executes or exposes actions (APIs, tools, approval). Checking plans before acting is orchestration."]},{"id":"L1-B02-5","lesson":1,"block":2,"topic":"AI system stack","type":"mcq","difficulty":"hard","skill":"scenario","question":"A hospital's readmission-risk model scores well in a vendor demo. During review, you find that patient records were collected without consent metadata, different wards labelled 'readmitted' differently, and nobody can say where several columns came from. The vendor proposes switching to a larger neural network. What is the best response?","explanation":"Every issue described (consent, labelling, lineage) belongs to the data layer: collection, labels, cleaning, representativeness, consent, metadata, lineage and governance. Changing the model layer leaves these issues in place.","concept":"Locate a problem in the right layer before choosing a fix. Data problems need data fixes.","source":"Lec 1, slide 8","options":["Accept the larger neural network, because more capacity will learn around inconsistent labels","Add audit logs and a human approval button in the action layer, which solves the problem","Add more planning steps in the orchestration layer so the model reasons more carefully","Fix the data layer first: consent, consistent labels and lineage, because a bigger model cannot repair them"],"answer":3,"whyWrong":["A model learns whatever the labels say. Inconsistent labels and missing consent are data-layer problems that model capacity cannot fix.","Logging and approval control actions. They do not repair how the training data was collected or labelled.","Better orchestration cannot fix untraceable or inconsistently labelled training data.",null]},{"id":"L1-B03-1","lesson":1,"block":3,"topic":"Types of AI: functionality-based","type":"mcq","difficulty":"easy","skill":"recall","question":"A system responds only to its current input and keeps no memory of past episodes. Under the functionality-based classification, what type is it?","explanation":"Reactive systems respond to current inputs without retaining internal memory of past episodes.","concept":"The functionality-based question is: what does the system remember, why, and who controls that memory?","source":"Lec 1, slide 9","options":["Limited-memory system","Theory-of-mind AI","Self-aware AI","Reactive system"],"answer":3,"whyWrong":["Limited-memory systems use recent or stored information, for example driving perception histories.","Theory-of-mind AI is a mainly conceptual category about modelling others' mental states.","Self-aware AI is a conceptual category, not an ordinary deployed system.",null]},{"id":"L1-B03-2","lesson":1,"block":3,"topic":"Types of AI: functionality-based","type":"tf","difficulty":"easy","skill":"recall","question":"Theory-of-mind AI and self-aware AI are mainly conceptual categories in introductory teaching rather than ordinary deployed systems.","explanation":"The lecture states this directly. Deployed systems are typically reactive or limited-memory.","concept":"Two of the four functionality-based types describe deployed systems; the other two are conceptual.","source":"Lec 1, slide 9","answer":true},{"id":"L1-B03-3","lesson":1,"block":3,"topic":"Types of AI: symbolic, subsymbolic, hybrid","type":"match","difficulty":"easy","skill":"recall","question":"Match each type of AI to its description.","explanation":"Symbolic AI represents knowledge explicitly. Subsymbolic AI learns representations such as embeddings. Hybrid AI combines both. Limited memory comes from the separate functionality-based classification.","concept":"Symbolic is explicit and inspectable; subsymbolic is learned and opaque; hybrid divides the work.","source":"Lec 1, slide 9, Lec 1, slide 10","pairs":[{"left":"Symbolic AI","right":"Rules, logic and knowledge graphs; often interpretable but can be brittle"},{"left":"Subsymbolic AI","right":"Learns patterns from data with neural networks; powerful but often opaque"},{"left":"Hybrid AI","right":"A learned model perceives while rules, retrieval or tests control action"},{"left":"Limited-memory system","right":"Uses recent or stored information to improve decisions"}]},{"id":"L1-B03-4","lesson":1,"block":3,"topic":"Types of AI: symbolic, subsymbolic, hybrid","type":"mcq","difficulty":"medium","skill":"understanding","question":"The lecture says robust deployment depends less on choosing one camp and more on designing the right division of labour. Why?","explanation":"Neural models are strong at perception and language but opaque; symbolic rules are interpretable but brittle. A hybrid system can let a model perceive while rules, retrieval and tests decide what is allowed.","concept":"Choose components by role: learned perception, explicit control, human review where needed.","source":"Lec 1, slide 10","options":["Subsymbolic AI has now fully replaced symbolic AI, so the choice of camp no longer matters","They have complementary strengths, so each part of a task can go to the method that suits it","Symbolic and subsymbolic methods cannot be combined inside a single deployed system","A hybrid design removes the need for human review, so oversight costs disappear"],"answer":1,"whyWrong":["Symbolic methods (rules, constraints, knowledge graphs) are still used, especially to control action.",null,"Hybrid AI is exactly such a combination.","The slide's hybrid example still includes verification and human review."]},{"id":"L1-B03-5","lesson":1,"block":3,"topic":"Types of AI: symbolic, subsymbolic, hybrid","type":"mcq","difficulty":"hard","skill":"scenario","question":"A bank builds a mortgage-document assistant. A neural model reads scanned payslips and extracts figures. Fixed eligibility rules written by compliance officers then decide whether the file is complete, and borderline files go to a human underwriter. How should this system be classified?","explanation":"A learned model handles perception (reading documents), and explicit rules plus human review control the action. That is the lecture's description of hybrid AI.","concept":"Look at which part learns and which part is explicit. When both are present, the system is hybrid.","source":"Lec 1, slide 10","options":["Purely symbolic AI, because the final eligibility decision is made by written rules","Hybrid AI: learned perception combined with explicit rules and human review","Purely subsymbolic AI, because a neural network reads the scanned documents","Self-aware AI, because it recognises on its own when it should ask a human"],"answer":1,"whyWrong":["This ignores the neural model that performs the perception step.",null,"This ignores the explicit compliance rules that control the decision.","Routing borderline cases to a person is a designed rule, not self-awareness, which the lecture treats as a conceptual category."]},{"id":"L1-B04-1","lesson":1,"block":4,"topic":"Learning paradigms","type":"mcq","difficulty":"easy","skill":"recall","question":"Which learning paradigm creates its training signal from the raw data itself, for example by predicting a missing word or masked image patch?","explanation":"Self-supervised learning builds prediction tasks from unlabelled data, which is why it is central to large language and foundation models.","concept":"Self-supervised learning makes its own labels from the data.","source":"Lec 1, slide 11, Lec 1, slide 14","options":["Supervised learning","Unsupervised learning","Self-supervised learning","Reinforcement learning"],"answer":2,"whyWrong":["Supervised learning needs human-provided labels for each example.","Unsupervised learning looks for structure such as clusters; it does not set up a prediction task from the data.",null,"Reinforcement learning learns from rewards received through interaction."]},{"id":"L1-B04-2","lesson":1,"block":4,"topic":"Unsupervised learning","type":"tf","difficulty":"easy","skill":"recall","question":"The lecture says unsupervised learning results should be treated as hypotheses that need expert validation, not as automatic truth.","explanation":"Because there may be no single correct answer, clusters or anomalies found without labels need domain interpretation.","concept":"Unsupervised output is a starting point for expert interpretation.","source":"Lec 1, slide 13","answer":true},{"id":"L1-B04-3","lesson":1,"block":4,"topic":"Learning paradigms","type":"match","difficulty":"easy","skill":"recall","question":"Match each learning paradigm to what it learns from.","explanation":"Each paradigm differs in its learning signal: labels, structure, rewards, or self-generated tasks.","concept":"Identify the paradigm by its learning signal.","source":"Lec 1, slide 11","pairs":[{"left":"Supervised learning","right":"Examples paired with target labels"},{"left":"Unsupervised learning","right":"Data without labels, searching for hidden structure"},{"left":"Reinforcement learning","right":"States, actions and rewards over time"},{"left":"Self-supervised learning","right":"Prediction tasks created from raw data"}]},{"id":"L1-B04-4","lesson":1,"block":4,"topic":"Unsupervised learning","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why is evaluating unsupervised learning harder than evaluating supervised learning?","explanation":"Supervised learning has known labels to measure against. Clusters, latent dimensions and anomalies often have no ground truth, so experts must judge whether they are meaningful.","concept":"No labels means no answer key, so meaning must come from domain experts.","source":"Lec 1, slide 13","options":["Unsupervised models need far more human-provided labels than supervised models do","There may be no single correct answer, so domain interpretation becomes essential","Unsupervised models cannot work with high-dimensional data such as text or images","Unsupervised results are wrong until a supervised neural network has checked them"],"answer":1,"whyWrong":["Unsupervised learning uses no labels at all.",null,"PCA/UMAP for high-dimensional data is listed as an unsupervised use case.","The lecture asks for expert validation, not a neural network check."]},{"id":"L1-B04-5","lesson":1,"block":4,"topic":"Learning paradigms","type":"mcq","difficulty":"hard","skill":"scenario","question":"An online-learning platform has three goals. A: predict whether a new essay needs instructor review, using past essays that instructors already marked 'review' or 'no review'. B: discover groups of learners with similar study habits; no groups have been defined. C: a tutoring bot that changes its hint strategy based on whether students eventually solve problems. Which pairing is correct?","explanation":"Labelled historical outcomes give supervised learning. Finding unknown groups is unsupervised clustering. Adjusting behaviour from the consequences of actions is reinforcement learning.","concept":"Labels, structure or rewards: identify the learning signal in each goal.","source":"Lec 1, slide 11, Lec 1, slide 12, Lec 1, slide 13, Lec 1, slide 15","options":["A unsupervised, B supervised, C reinforcement learning","A supervised, B self-supervised, C supervised","A self-supervised, B unsupervised, C supervised","A supervised, B unsupervised, C reinforcement learning"],"answer":3,"whyWrong":["A has labels (review/no review), so it is supervised. B has no predefined groups, so it cannot be supervised.","B looks for groups (clusters), which is unsupervised. C learns from outcomes of its actions, which is a reward signal.","A uses human-provided labels, so it is supervised. C has no labelled 'correct hint' for each case; it learns from consequences.",null]},{"id":"L1-B05-1","lesson":1,"block":5,"topic":"Supervised learning","type":"tf","difficulty":"easy","skill":"recall","question":"Once a supervised model has been validated on held-out data, its performance cannot drop when real-world data differs from the training data.","explanation":"The lecture lists performance drops when real-world data differs from training data as a key supervised-learning risk, along with label bias, leakage and class imbalance.","concept":"Validation on held-out data does not protect against distribution shift after deployment.","source":"Lec 1, slide 12","answer":false},{"id":"L1-B05-2","lesson":1,"block":5,"topic":"Deep learning and neural networks","type":"mcq","difficulty":"easy","skill":"recall","question":"Which of the following is NOT one of the trade-offs of deep models listed in the lecture?","explanation":"Deep models work well for complex patterns in images, speech, language, code and multimodal data. Their trade-offs are data needs, compute cost, interpretability and fragility.","concept":"Deep learning is powerful at perception, but at a cost in data, compute and transparency.","source":"Lec 1, slide 16","options":["They can be data-hungry","They are hard to interpret","They cannot learn patterns from images or speech","They can be fragile outside their training distribution"],"answer":2,"whyWrong":["This is listed: deep models often need large datasets.","This is listed: internal representations are difficult to explain.",null,"This is listed as a trade-off."]},{"id":"L1-B05-3","lesson":1,"block":5,"topic":"Generative and multimodal AI","type":"mcq","difficulty":"easy","skill":"recall","question":"Which list contains only risks of generative AI named in the lecture?","explanation":"The slide lists hallucination, deepfakes, provenance problems, copyright disputes and overreliance as risks of generative AI.","concept":"Generative AI creates content, so its risks concern truthfulness, authenticity and ownership.","source":"Lec 1, slide 17","options":["Hallucination, multicollinearity, heteroscedasticity, deepfakes","Hallucination, deepfakes, provenance problems, copyright disputes","Label leakage, class imbalance, deepfakes, overfitting","Slow training, high memory use, overfitting, underfitting"],"answer":1,"whyWrong":["Multicollinearity and heteroscedasticity are regression issues, not generative-AI risks.",null,"Label leakage and class imbalance are supervised-learning risks.","These are general training concerns, not the generative-AI risks listed."]},{"id":"L1-B05-4","lesson":1,"block":5,"topic":"Reinforcement learning","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why does the lecture call reward specification the core difficulty of reinforcement learning?","explanation":"Poor reward design can encourage unsafe or undesirable behaviour even when the algorithm is optimising correctly. The system can satisfy the measured reward while violating the real goal.","concept":"Optimisation follows the measure; design the measure carefully.","source":"Lec 1, slide 15","options":["Reinforcement learning cannot handle tasks that need several steps over time","The agent optimises what is measured, so a poorly chosen reward encourages shortcuts","Rewards must be human labels attached to every single training example","Reinforcement learning has no policy, so there is nothing to update after feedback"],"answer":1,"whyWrong":["RL is designed for sequential tasks such as games and control.",null,"Per-example labels are supervised learning; RL receives rewards from interaction.","RL updates a policy after each state, action and reward."]},{"id":"L1-B05-5","lesson":1,"block":5,"topic":"Reinforcement learning","type":"mcq","difficulty":"hard","skill":"scenario","question":"A telecom company trains a call-handling agent with reinforcement learning and rewards it for short average call duration. After deployment, calls are much shorter, but many customers call back because their problems were never solved. What is the best diagnosis?","explanation":"The agent maximised exactly what was rewarded. Because call duration is not the same as customer resolution, the agent found a shortcut. The fix is to redesign the reward, for example to reflect resolution.","concept":"Reward design: a system can satisfy the measured reward while violating the intended outcome.","source":"Lec 1, slide 15","options":["The reward measured a shortcut, not the real goal, so the agent learned to end calls early","The learning algorithm has a bug, because a correctly optimised agent cannot behave badly","The task should be switched to unsupervised clustering of the recorded customer calls","The agent needs more GPUs and a deeper network so it can learn the real goal"],"answer":0,"whyWrong":[null,"The lecture warns that poor rewards cause undesirable behaviour even when the algorithm optimises correctly.","Clustering finds groups; it would not teach the agent to resolve problems.","More capacity optimises the same reward even harder; it does not change what is rewarded."]},{"id":"L1-B06-1","lesson":1,"block":6,"topic":"Evaluation and limits of AI methods","type":"match","difficulty":"easy","skill":"recall","question":"Match each metric category to an example the lecture lists for it.","explanation":"Evaluation has three families. Technical metrics measure model performance, human metrics measure the experience of people using it, and risk metrics measure potential harm.","concept":"Measure what matters, not only what is easy to measure.","source":"Lec 1, slide 18","pairs":[{"left":"Technical metrics","right":"Accuracy, F1, calibration, robustness"},{"left":"Human metrics","right":"Trust, usability, workload, appealability"},{"left":"Risk metrics","right":"Fairness, privacy, security, safety, auditability"}]},{"id":"L1-B06-2","lesson":1,"block":6,"topic":"Foundation models","type":"tf","difficulty":"easy","skill":"recall","question":"Under the risk-based governance idea for foundation models, uses classed as 'unacceptable' risk are handled through transparency duties.","explanation":"Unacceptable-risk uses are prohibited. Transparency duties apply to limited-risk uses; high-risk uses face strict requirements; minimal-risk uses get normal use plus monitoring.","concept":"Governance scales with risk: monitoring, transparency, strict requirements, prohibition.","source":"Lec 1, slide 50","answer":false},{"id":"L1-B06-3","lesson":1,"block":6,"topic":"Evaluating agents","type":"mcq","difficulty":"easy","skill":"recall","question":"Which metric is specific to evaluating AI agents, as opposed to an ordinary classifier?","explanation":"Agents call tools and take actions, so they are judged on task completion, tool-call accuracy, cost, time, recovery from errors and human override rates.","concept":"Agents act, so evaluation includes how well they act, not only how well they predict.","source":"Lec 1, slide 18, Lec 1, slide 49","options":["Tool-call accuracy","Precision","ROC-AUC","F1-score"],"answer":0,"whyWrong":[null,"Precision is a standard classification metric.","ROC-AUC measures class separation for classifiers.","F1 combines precision and recall for classifiers."]},{"id":"L1-B06-4","lesson":1,"block":6,"topic":"Evaluation and limits of AI methods","type":"mcq","difficulty":"medium","skill":"understanding","question":"What does the principle 'Measure what matters, not only what is easy to measure' mean in practice?","explanation":"Accuracy-style metrics are convenient but incomplete. The lecture pairs technical metrics with human and risk metrics so that evaluation reflects real goals.","concept":"Evaluation should reflect real goals and real risks.","source":"Lec 1, slide 18","options":["Use accuracy alone, because it is the easiest metric to compare across models","Ignore human metrics such as trust and workload, because they are subjective","A system can score well on easy metrics while failing on fairness, usability or safety","Measure risk only after deployment, once real problems have started to appear"],"answer":2,"whyWrong":["This is exactly the habit the principle warns against.","Human metrics are one of the three metric families the lecture asks for.",null,"Risk metrics such as fairness and safety belong in evaluation, not only after harm occurs."]},{"id":"L1-B06-5","lesson":1,"block":6,"topic":"Evaluation and limits of AI methods","type":"mcq","difficulty":"hard","skill":"scenario","question":"A university's AI essay-feedback tool reports 94% accuracy on its test set. In a pilot, students say the feedback is hard to act on, the tool is noticeably less accurate for non-native English writers, and there is no way to contest a mark. What is the best conclusion?","explanation":"The pilot reveals problems in the human metrics (usability, appealability) and the risk metrics (subgroup fairness) that one overall technical number hides.","concept":"Overall accuracy can hide subgroup errors and human costs.","source":"Lec 1, slide 18","options":["94% accuracy shows the tool is ready to deploy; the student complaints are only subjective","The only real problem is the small test set, so retesting on more essays will settle it","Accuracy cannot be measured for text tasks, so the 94% figure is meaningless here","Accuracy alone is not enough: fairness across groups, usability and appeals also need evaluating"],"answer":3,"whyWrong":["Lower accuracy for one group is a measurable fairness issue, and usability and appealability are named human metrics.","More essays would refine the accuracy estimate but would not address fairness, usability or appeals.","Accuracy can be measured for text classification; the issue is that it is incomplete, not meaningless.",null]},{"id":"L1-B07-1","lesson":1,"block":7,"topic":"History of AI","type":"mcq","difficulty":"easy","skill":"recall","question":"Who founded information theory and built early ideas about game-playing machines?","explanation":"Shannon founded information theory and linked communication, uncertainty and computation.","concept":"Each founder contributed a different foundation: behaviour tests, information, feedback, architecture.","source":"Lec 1, slide 22","options":["Claude Shannon","Alan Turing","Norbert Wiener","John von Neumann"],"answer":0,"whyWrong":[null,"Turing proposed the imitation game and argued intelligence should be judged by observable behaviour.","Wiener developed cybernetics, with its focus on feedback and control.","Von Neumann shaped stored-program computing and computer architecture."]},{"id":"L1-B07-2","lesson":1,"block":7,"topic":"History of AI","type":"match","difficulty":"easy","skill":"recall","question":"Match each person to their contribution as described in the lecture.","explanation":"Boole is from the pre-history slide; the others are from the founders slide.","concept":"AI built on logic, computation, information and feedback.","source":"Lec 1, slide 21, Lec 1, slide 22","pairs":[{"left":"Alan Turing","right":"The imitation game: judging machine intelligence by observable behaviour"},{"left":"Norbert Wiener","right":"Cybernetics: feedback, control and communication"},{"left":"John von Neumann","right":"Stored-program computing and formal computer architecture"},{"left":"George Boole","right":"Expressing logic using mathematics"}]},{"id":"L1-B07-3","lesson":1,"block":7,"topic":"History of AI","type":"tf","difficulty":"easy","skill":"recall","question":"Single-layer perceptrons had important limitations, and interest in neural networks decreased for some time as a result.","explanation":"The perceptron showed machines could learn simple decisions, but single-layer limitations reduced interest until suitable mathematics, data, hardware and support arrived.","concept":"Algorithms need suitable maths, data, hardware and support to succeed.","source":"Lec 1, slide 24","answer":true},{"id":"L1-B07-4","lesson":1,"block":7,"topic":"History of AI","type":"mcq","difficulty":"medium","skill":"understanding","question":"What lesson does the lecture draw from early symbolic optimism?","explanation":"Symbols, rules and search could find solutions in well-defined settings, but real environments are open, changing and full of common-sense knowledge.","concept":"Closed-world success does not imply open-world readiness.","source":"Lec 1, slide 23","options":["Symbolic systems failed because they relied too heavily on data","Success in closed worlds does not automatically scale to open-world complexity","Symbolic AI was abandoned because it could not solve any problem","Early programs failed only because GPUs had not been invented"],"answer":1,"whyWrong":["Early symbolic systems used symbols, rules and search, not data-driven learning.",null,"It solved problems in limited, closed settings; the issue was scaling.","The lesson concerns open-world complexity, not a single hardware gap."]},{"id":"L1-B07-5","lesson":1,"block":7,"topic":"AI winters","type":"mcq","difficulty":"hard","skill":"scenario","question":"A start-up demonstrates a rule-based assistant that schedules meetings perfectly in a demo office with five fixed rooms and ten staff. Investors now want it to run scheduling for a large hospital next quarter, with emergencies, staff changes and conflicting priorities. Based on the history of AI, what is the best warning?","explanation":"AI winters followed expectations that outran results. Expert systems were expensive to maintain, inflexible and unable to adapt to changing situations. A closed demo does not show open-world readiness.","concept":"A successful demonstration does not always mean the system is ready for real-world use.","source":"Lec 1, slide 23, Lec 1, slide 25, Lec 1, slide 28","options":["Rule-based systems never work, so the start-up should replace everything with deep learning immediately","AI winters happened because expectations were too low, so investors should raise their expectations","Expert systems failed because they lacked human knowledge, so adding staff interviews will fix it","A closed demo does not show real-world readiness, and rule bases are costly to maintain as things change"],"answer":3,"whyWrong":["Expert systems worked well in limited areas. The lesson is about scaling and maintenance, not that rules never work.","AI winters happened when expectations were higher than real results.","Expert systems were built on human knowledge; their problems were cost, inflexibility and difficulty adapting.",null]},{"id":"L1-B08-1","lesson":1,"block":8,"topic":"Applications: business and operations","type":"tf","difficulty":"easy","skill":"recall","question":"The lecture argues that the value of AI in business should be measured mainly by model accuracy.","explanation":"Value should be measured by saved time, fewer errors, better quality, lower risk and user satisfaction, not accuracy alone.","concept":"A model is not a strategy; impact comes from redesigned systems.","source":"Lec 1, slide 31","answer":false},{"id":"L1-B08-2","lesson":1,"block":8,"topic":"Applications: software engineering","type":"mcq","difficulty":"easy","skill":"recall","question":"According to the lecture, what should students do before using code produced by an AI coding tool?","explanation":"The software-engineering slide lists risks such as false confidence, wrong explanations, hidden bugs and security gaps.","concept":"AI-generated work needs human verification.","source":"Lec 1, slide 32","options":["Use it if it compiles without errors","Ask the same AI tool to confirm that the code is correct","Read the code, run tests and check its assumptions","Check only formatting and naming"],"answer":2,"whyWrong":["Code that compiles can still contain hidden bugs and security gaps.","The tool can give wrong explanations; confirmation from it is not verification.",null,"Correctness, security, licences and quality must be checked, not only style."]},{"id":"L1-B08-3","lesson":1,"block":8,"topic":"Applications: science and engineering","type":"tf","difficulty":"easy","skill":"recall","question":"In science, AI-generated ideas and designs must be reproducible, checked by experts and confirmed through experiments.","explanation":"The lecture says AI can suggest ideas and designs, but results must be reproducible, expert-checked and experimentally confirmed.","concept":"AI suggestions in science are hypotheses until verified.","source":"Lec 1, slide 33","answer":true},{"id":"L1-B08-4","lesson":1,"block":8,"topic":"Applications: business and operations","type":"mcq","difficulty":"medium","skill":"understanding","question":"What does 'A model is not a strategy; impact comes from redesigned systems' mean?","explanation":"The slide's cycle runs Problem, Workflow, Model, People, Measurement. Success requires staff training, good data management, process improvement and monitoring.","concept":"AI impact depends on the whole system around the model.","source":"Lec 1, slide 31","options":["A more accurate model will automatically produce business impact on its own","Businesses should avoid models entirely and rely on process changes alone","Company strategy should be decided directly by the model's predictions","A model creates value only when the workflow, people and measurement around it change"],"answer":3,"whyWrong":["This contradicts the slide, which ties impact to workflow, people and measurement.","The slide includes the model as one step in the cycle.","The slide is about integrating models into systems, not letting models set strategy.",null]},{"id":"L1-B08-5","lesson":1,"block":8,"topic":"Applications: education","type":"mcq","difficulty":"hard","skill":"scenario","question":"A school gives every student an AI tutor. After one term, homework completion rises from 60% to 95%, but exam results show no improvement in understanding, and teachers notice many answers copied from AI explanations. What is the best response based on the lecture?","explanation":"AI tutors work best with clear goals, practice, reflection and teacher guidance. Risks include plagiarism, weak learning and overdependence.","concept":"Judge educational AI by learning outcomes, not activity metrics.","source":"Lec 1, slide 30","options":["Higher completion proves that learning improved, so the current setup should stay unchanged","Remove teacher involvement so the AI can personalise each student's learning without interference","Check whether it truly improves understanding, and add goals, practice, reflection and teacher guidance","Upgrade to a larger model, because weak learning shows the current model lacks capability"],"answer":2,"whyWrong":["Completion is not understanding. The lecture asks teachers to check whether AI truly improves learning.","The lecture says AI tutors work best with teacher guidance.",null,"The issues described (copying, overdependence, weak learning) are use and design risks, not model-capability gaps."]},{"id":"L1-B09-1","lesson":1,"block":9,"topic":"What is an AI agent","type":"mcq","difficulty":"easy","skill":"recall","question":"What distinguishes an AI agent from a chatbot, according to the lecture?","explanation":"An AI agent observes its environment and takes actions. Agent = perceptions + goals + action choices + feedback.","concept":"Agents act; chatbots respond.","source":"Lec 1, slide 36","options":["It can use tools to take actions that change things","It always runs on a larger language model than a chatbot does","It never needs to handle uncertain or missing information","It only answers questions in a conversation, without acting"],"answer":0,"whyWrong":[null,"Model size does not define an agent.","The main challenge for agents is controlling actions when information is uncertain.","That describes a chatbot."]},{"id":"L1-B09-2","lesson":1,"block":9,"topic":"PEAS framework","type":"match","difficulty":"easy","skill":"recall","question":"Match each PEAS element to the design question it answers.","explanation":"PEAS specifies an agent before building it: how success is measured, where it works, what it can do and what it can perceive.","concept":"PEAS forces a designer to define success, setting, actions and inputs.","source":"Lec 1, slide 37","pairs":[{"left":"Performance measure","right":"What counts as success, cost and acceptable error?"},{"left":"Environment","right":"Where does the agent operate, and what changes independently of it?"},{"left":"Actuators","right":"What can the agent do?"},{"left":"Sensors","right":"What can the agent observe?"}]},{"id":"L1-B09-3","lesson":1,"block":9,"topic":"Environment properties","type":"tf","difficulty":"easy","skill":"recall","question":"In a partially observable environment, the agent can see all of the state information it needs.","explanation":"In a partially observable environment the agent sees only some of the information. A fully observable environment is the easy case.","concept":"Hidden context is what makes an environment partially observable.","source":"Lec 1, slide 38","answer":false},{"id":"L1-B09-4","lesson":1,"block":9,"topic":"Environment properties","type":"mcq","difficulty":"medium","skill":"application","question":"An agent trades on a stock exchange alongside thousands of other automated traders. Prices change unpredictably, it cannot see other traders' strategies, and each trade affects later options. Which description fits this environment?","explanation":"Hidden strategies make it partially observable, unpredictable prices make it uncertain, dependence between trades makes it sequential, and competing traders make it multi-agent and adversarial.","concept":"Environment properties shape how hard an agent's task is.","source":"Lec 1, slide 38","options":["Partially observable, uncertain, sequential and multi-agent/adversarial","Fully observable, deterministic, episodic and single-agent","Fully observable, uncertain, episodic and multi-agent","Partially observable, deterministic, sequential and single-agent"],"answer":0,"whyWrong":[null,"These are the easy-case properties, the opposite of what is described.","It cannot see other traders' strategies, and each trade affects later options, so it is neither fully observable nor episodic.","Prices change unpredictably and many other traders act, so it is neither deterministic nor single-agent."]},{"id":"L1-B09-5","lesson":1,"block":9,"topic":"PEAS framework","type":"mcq","difficulty":"hard","skill":"scenario","question":"A team specifies an agent that reschedules students' exam appointments. P: number of appointments rescheduled per hour. E: the university booking system and student email. A: read calendars, send confirmations, cancel and create bookings. S: student emails, calendars, exam policy documents. A reviewer says one element is likely to cause harmful behaviour. Which one, and why?","explanation":"Optimisation follows the measure. A performance measure that counts only throughput ignores correctness, policy compliance, fairness and satisfaction, which the lecture lists as parts of success.","concept":"Poorly defined goals can lead to harmful or unwanted actions.","source":"Lec 1, slide 37, Lec 1, slide 41","options":["The sensors: reading a calendar is an action, so it belongs under actuators instead","The environment: student email cannot appear under both E and S at the same time","The performance measure: it rewards speed only, so the agent may break policy to go faster","The actuators: an agent should never be allowed to create or cancel bookings"],"answer":2,"whyWrong":["Reading a calendar is observing, which is sensing. Actuators change the world.","The environment contains information that the sensors observe, so overlap is expected.",null,"Actuators may include actions like booking; the lecture's answer is to control risky actions, not to forbid all actions."]},{"id":"L1-B10-1","lesson":1,"block":10,"topic":"Agent architectures","type":"mcq","difficulty":"easy","skill":"recall","question":"A greenhouse vent opens whenever the temperature passes 30°C and does nothing else. Which agent architecture is this?","explanation":"Simple reflex agents follow direct condition-action rules. They are fast and easy to understand but fail when information is missing.","concept":"Use the simplest architecture that can satisfy the task, risk and environment.","source":"Lec 1, slide 39, Lec 1, slide 40","options":["Model-based agent","Utility-based agent","Learning agent","Simple reflex agent"],"answer":3,"whyWrong":["Model-based agents keep an internal view of the world to handle hidden state.","Utility-based agents balance trade-offs such as speed, cost and safety.","Learning agents improve through feedback via a critic and learning element.",null]},{"id":"L1-B10-2","lesson":1,"block":10,"topic":"Memory, retrieval and grounding","type":"tf","difficulty":"easy","skill":"recall","question":"The lecture says giving an agent more memory improves service and carries no additional risk.","explanation":"The slide states a trade-off: more memory can mean better service and greater privacy risk. Memory needs consent, minimisation, retention rules and deletion options.","concept":"Memory is a trade-off between personalisation and privacy.","source":"Lec 1, slide 45","answer":false},{"id":"L1-B10-3","lesson":1,"block":10,"topic":"Agent safety and governance","type":"match","difficulty":"easy","skill":"recall","question":"Match each safety control to its purpose.","explanation":"Least privilege (read-only by default) limits damage, logging records tool calls, approval adds human sign-off, and red teaming tests attacks such as prompt injection.","concept":"Each control addresses a different governance need.","source":"Lec 1, slide 48","pairs":[{"left":"Least privilege","right":"Reduce harm"},{"left":"Logging","right":"Auditability"},{"left":"Human approval","right":"Accountability"},{"left":"Red teaming","right":"Find failures"}]},{"id":"L1-B10-4","lesson":1,"block":10,"topic":"Planning, reflection and stopping criteria","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why does the lecture say every agent loop needs a maximum step count, an error path and a handoff path?","explanation":"Agents follow plan, act, observe, reflect, revise. Stopping rules prevent infinite loops, repeated harmful actions, cost overruns and user frustration.","concept":"An agent must know when to stop, what to do on errors, and when to hand off.","source":"Lec 1, slide 46","options":["Step limits make the agent's plans more creative by forcing it to try new ideas","Handoff paths let the agent avoid calling tools when a task looks difficult","Error paths are only needed when several agents work together in one system","Without them an agent can loop forever, repeat harmful actions and overrun costs"],"answer":3,"whyWrong":["Step limits are a safety and cost control, not a creativity aid.","A handoff passes the task to a human or another process when the agent should stop.","Any agent loop can fail, so every loop needs an error path.",null]},{"id":"L1-B10-5","lesson":1,"block":10,"topic":"Tools and action spaces","type":"mcq","difficulty":"hard","skill":"scenario","question":"A university deploys an LLM agent that can read student records, draft emails and change grades. During testing, a student's message containing hidden instructions makes the agent call the grade-change tool. Which redesign best follows the lecture?","explanation":"The lecture classes changing records as critical risk, requiring policy, audit and review. Least privilege, logging, human approval and red-team tests address the failure directly.","concept":"Limit what an agent can do, record what it does, and require human approval for important actions.","source":"Lec 1, slide 44, Lec 1, slide 48","options":["Give the agent long-term memory of university policy so it remembers not to change grades","Least privilege, human approval with audit for grade changes, logged tool calls and red-team tests","Add two more agents that must vote together before any grade change is made","Switch to a larger foundation model that is better at understanding user intent"],"answer":1,"whyWrong":["Memory does not enforce permissions. Changing records is a critical-risk action that needs controls outside the model.",null,"Multi-agent systems can behave unpredictably and still need authority limits and human supervision.","A better model does not replace least privilege, approval and logging for a critical action."]},{"id":"L1-X1","lesson":1,"block":0,"topic":"Learning agents","type":"match","difficulty":"medium","skill":"recall","question":"Match each part of the classic learning-agent architecture to its role.","explanation":"The lecture lists performance element, learning element, critic and problem generator as the classic learning-agent architecture. Because learning changes the system over time, monitoring must be continuous.","concept":"A learning agent acts, gets feedback, updates and re-tests.","source":"Lec 1, slide 42 (the slide names the four parts; the role wording is the standard textbook definition, marked supplementary)","pairs":[{"left":"Performance element","right":"Chooses the actions the agent takes"},{"left":"Critic","right":"Judges how well the agent is doing using feedback"},{"left":"Learning element","right":"Updates the agent based on the critic's feedback"},{"left":"Problem generator","right":"Suggests new experiences or actions to try"}]},{"id":"L1-X2","lesson":1,"block":0,"topic":"LLM-based agents and multi-agent systems","type":"tf","difficulty":"easy","skill":"recall","question":"Common problems of LLM agents include wrong actions, repeated loops, ignoring limits and false information.","explanation":"These are the common problems the lecture lists. Safe systems require approval for important actions.","concept":"LLM agents plan and use tools, so their failures are action failures as well as text errors.","source":"Lec 1, slide 43","answer":true},{"id":"L1-X3","lesson":1,"block":0,"topic":"Memory, retrieval and grounding","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why does the lecture say an agent should cite or expose its source when it makes a decision using retrieved information?","explanation":"Retrieval-augmented generation grounds answers in external documents. Exposing sources lets people check that the decision is supported.","concept":"Grounding plus visible sources makes decisions checkable.","source":"Lec 1, slide 45","options":["So that the agent can skip asking for approval","Because retrieval-augmented generation cannot work without citations","So that humans can verify the decision against the evidence it used","To increase how much long-term memory the agent stores"],"answer":2,"whyWrong":["Citing sources supports verification; it does not replace approval for risky actions.","Retrieval can work without citations; citations are for human verification.",null,"Citations do not add to memory; they expose evidence."]},{"id":"L1-X4","lesson":1,"block":0,"topic":"What is an AI agent","type":"mcq","difficulty":"medium","skill":"understanding","question":"Why does an AI agent need stronger controls than a chatbot that only answers questions?","explanation":"An agent observes its environment and takes actions with tools. Controlling those actions when information is uncertain is the main challenge, which is why the lecture stresses least privilege, logging and human approval.","concept":"The ability to act is what raises the stakes.","source":"Lec 1, slide 36, Lec 1, slide 44","options":["Because its mistakes become actions with real consequences","Because agents always use larger and less accurate models than chatbots","Because agents never receive feedback, so they cannot correct their errors","Because chatbots are never wrong, so they need no controls at all"],"answer":0,"whyWrong":[null,"Model size is not what distinguishes agents; their ability to act is.","Agents do receive feedback; the agent formula includes it.","Chatbots can be wrong too; the difference is that an agent's errors become actions."]},{"id":"L1-X5","lesson":1,"block":0,"topic":"History of AI","type":"mcq","difficulty":"easy","skill":"recall","question":"According to the lecture, which two developments allowed deep networks to begin outperforming older methods?","explanation":"The deep learning slide says CNNs became useful for images and handwriting, and that with large datasets and powerful GPUs deep networks began to outperform older methods.","concept":"Deep learning took off when data and compute caught up with the ideas.","source":"Lec 1, slide 26","options":["Hand-written expert rules and faster hard disks","Large datasets and powerful GPUs","Single-layer perceptrons and logic programming","Smaller datasets and simpler activation functions"],"answer":1,"whyWrong":["Expert rules belong to the symbolic era; the slide credits data and GPU compute.",null,"Single-layer perceptrons had the limits that caused interest to fall; they are not the cause of the comeback.","The slide points to larger datasets, not smaller ones."]},{"id":"L1-X6","lesson":1,"block":0,"topic":"Transformers and generative AI","type":"mcq","difficulty":"medium","skill":"understanding","question":"The lecture's 'key shift' is that language became both an input method and a control interface for software. What does this mean in practice?","explanation":"Transformers use attention to relate tokens and build representations that support generation. Because of this, a natural-language instruction can now steer what the software does, not just supply data to it.","concept":"Plain language now both feeds and steers software.","source":"Lec 1, slide 27","options":["People can describe what they want in plain words and the system acts on it","Software must now be written only in natural language instead of code","Transformers can only process text, so other data is converted to words","Users must learn a new formal command language for each AI tool"],"answer":0,"whyWrong":[null,"Code still exists; language became an additional way to drive software.","The slide says transformers work with text, code, images, audio and video.","That is the opposite of the shift; plain language becomes the interface."]},{"id":"L1-X7","lesson":1,"block":0,"topic":"Transformers and generative AI","type":"tf","difficulty":"easy","skill":"recall","question":"The lecture presents generative AI as widely available and free of serious concerns once transformers were introduced.","explanation":"False. The slide says generative AI became widely available but raised concerns about accuracy, copyright, misuse and evaluation.","concept":"Wide availability came with new risks.","source":"Lec 1, slide 27","answer":false},{"id":"L1-X8","lesson":1,"block":0,"topic":"LLM-based agents and multi-agent systems","type":"mcq","difficulty":"hard","skill":"scenario","question":"A company links three AI agents: one drafts supplier contracts, one reviews them, and one sends approved contracts to suppliers. In testing, the drafter and reviewer sometimes pass a contract back and forth endlessly, and once the sender emailed a contract nobody had approved. Which change best addresses both problems, following the lecture?","explanation":"Multi-agent systems can share tasks and check each other but may behave unpredictably. The lecture says safe systems need clear roles, communication rules, authority limits, conflict handling and human supervision. The loop is a conflict-handling gap; the unapproved send is an authority and supervision gap.","concept":"Multiple agents need roles, limits, conflict rules and human oversight.","source":"Lec 1, slide 47","options":["Add a fourth agent that also reviews contracts, so there are more checks","Replace the three agents with one larger model that does every step alone","Let the agents decide among themselves who has final authority each time","Set roles, authority limits and conflict rules, and require human approval to send"],"answer":3,"whyWrong":["More agents without roles, limits or conflict rules can add to the unpredictability rather than fix it.","This removes the cross-checking benefit and still leaves no limit on sending.","Leaving authority to the agents is what allowed the unapproved send; authority limits should be set by people.",null]},{"id":"L2-B01-1","lesson":2,"block":1,"topic":"Data types and structure","type":"mcq","difficulty":"easy","skill":"recall","question":"Data stored as JSON or XML, with flexible keys or tags rather than a fixed table schema, is classified as:","explanation":"The lecture lists JSON, XML and HTML as semi-structured: they have a flexible schema organised with tags or keys.","concept":"Structural type describes how data is organised, not what it measures.","source":"Lec 2.1, slide 6","options":["Structured data","Semi-structured data","Unstructured data","Ordinal data"],"answer":1,"whyWrong":["Structured data has rows and columns with a fixed schema, such as CSV files and SQL tables.",null,"Unstructured data has no predefined format at all, such as images, audio, video or open text.","Ordinal is a measurement scale for ordered categories, not a structural type."]},{"id":"L2-B01-2","lesson":2,"block":1,"topic":"Data, information, knowledge, decision","type":"tf","difficulty":"easy","skill":"recall","question":"In the data-information-knowledge-decision hierarchy, 'knowledge' means a raw recorded value.","explanation":"A raw recorded value is data. Information is an organised value in context, knowledge is an interpreted pattern, and a decision is an action based on that interpretation.","concept":"Each level adds context and interpretation to the one below.","source":"Lec 2.1, slide 5","answer":false},{"id":"L2-B01-3","lesson":2,"block":1,"topic":"Data, information, knowledge, decision","type":"match","difficulty":"easy","skill":"recall","question":"Match each level of the hierarchy to its meaning.","explanation":"The hierarchy moves from raw values to context, then to patterns, then to actions such as preprocessing choices.","concept":"Preprocessing decisions sit at the top: they depend on interpreting the data correctly.","source":"Lec 2.1, slide 5","pairs":[{"left":"Data","right":"Raw recorded value"},{"left":"Information","right":"Organised value in context"},{"left":"Knowledge","right":"Interpreted pattern"},{"left":"Decision","right":"Action based on interpretation"}]},{"id":"L2-B01-4","lesson":2,"block":1,"topic":"Purpose of preprocessing","type":"mcq","difficulty":"medium","skill":"understanding","question":"The lecture says the goal of preprocessing is to make data 'analytically defensible', not 'artificially perfect'. What does this mean?","explanation":"Good preprocessing preserves meaningful information while reducing noise, inconsistency and measurement problems, and each decision can be explained.","concept":"Defensible means justified, documented and faithful to the data's meaning.","source":"Lec 2.1, slide 10","options":["Every row with a missing value or unusual number should be removed so the data is clean","Every numeric variable should be transformed until it follows a normal distribution","Preprocessing means cleaning only; understanding and documentation come later","Keep meaningful information and reduce noise using choices that can be justified"],"answer":3,"whyWrong":["Removing inconvenient data can discard real, meaningful information. The lecture warns against this.","The lecture does not require normality; it requires justified, documented decisions.","The lecture says preprocessing is broader than cleaning: it includes understanding, validation, transformation and documentation.",null]},{"id":"L2-B01-5","lesson":2,"block":1,"topic":"Data types and structure","type":"mcq","difficulty":"hard","skill":"scenario","question":"A clinic wants to combine four sources for analysis: visit records in a SQL table, laboratory results exported as JSON, doctors' free-text notes, and chest X-ray images. An analyst plans to load everything into one CSV and treat every source as numeric columns. Which classification should guide a better plan?","explanation":"Structured data has a fixed schema, semi-structured data uses flexible tags or keys, and unstructured data such as text and images has no predefined table format. Each needs its own handling before analysis.","concept":"Identify the structural type before choosing how to process a source.","source":"Lec 2.1, slide 6","options":["All four are structured, because they are all stored on a computer","SQL: structured; JSON: semi-structured; notes and X-rays: unstructured","JSON is unstructured, because it has no columns","Free-text notes are semi-structured, because they contain words in sentences"],"answer":1,"whyWrong":["Being stored digitally does not give data a fixed row-and-column schema.",null,"JSON has keys and tags, which the lecture classes as semi-structured.","Open text has no predefined table format, so it is unstructured."]},{"id":"L2-B02-1","lesson":2,"block":2,"topic":"Measurement scales","type":"mcq","difficulty":"easy","skill":"recall","question":"Which measurement scale has a true zero, so that ratios such as 'twice as much' are meaningful?","explanation":"Ratio variables such as age or fare have a true zero, so ratios are meaningful. They may need imputation and scaling.","concept":"The scale of a variable determines which preprocessing makes sense.","source":"Lec 2.1, slide 8","options":["Ratio","Nominal","Ordinal","Identifier"],"answer":0,"whyWrong":[null,"Nominal values are unordered categories; ratios between them have no meaning.","Ordinal categories are ordered, but the spacing between them is not defined, so ratios are meaningless.","An identifier only labels a record; it is not a measurement."]},{"id":"L2-B02-2","lesson":2,"block":2,"topic":"Variable roles","type":"tf","difficulty":"easy","skill":"recall","question":"An identifier column, such as a record ID, is usually used for checks like uniqueness and then excluded as a predictive feature.","explanation":"Identifiers label records rather than describe them. They are useful for uniqueness checks but are usually dropped before modelling.","concept":"Use identifiers for checking, not for predicting.","source":"Lec 2.1, slide 8, Lec 2.1, slide 20","answer":true},{"id":"L2-B02-3","lesson":2,"block":2,"topic":"Measurement scales","type":"match","difficulty":"easy","skill":"application","question":"A hotel-booking dataset has the columns below. Match each column to its measurement scale.","explanation":"Payment methods have no order. Satisfaction levels are ordered. Money has a true zero. A reference number only labels a record.","concept":"Ask: is there an order, is there a true zero, or is it just a label?","source":"Lec 2.1, slide 8","pairs":[{"left":"Payment method (card, cash, transfer)","right":"Nominal"},{"left":"Guest satisfaction (low, medium, high)","right":"Ordinal"},{"left":"Booking amount in dollars","right":"Ratio"},{"left":"Booking reference number","right":"Identifier"}]},{"id":"L2-B02-4","lesson":2,"block":2,"topic":"Measurement scales","type":"tf","difficulty":"medium","skill":"understanding","question":"Encoding an ordinal v
