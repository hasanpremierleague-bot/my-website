r><td>Min-max normalisation<\/td><td>(x − min) / (max − min) → 0 to 1<\/td><td>Very sensitive<\/td><td>Bounded ranges<\/td><\/tr><tr><td>Robust scaling<\/td><td>(x − median) / IQR<\/td><td>Less sensitive<\/td><td>Skewed data with outliers<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Distance-based and gradient-based methods need scaling (big-range features dominate). Trees care much less.<\/li><li>Scale <b>after<\/b> cleaning and imputation. Scaling doesn't replace outlier reasoning.<\/li><\/ul><h2 id=\"g2-leakage-and-safe-workflow\" class=\"flow\">Leakage and safe workflow<\/h2><ul><li><b>Leakage:<\/b> test information influences training decisions (e.g. fitting imputer/scaler/encoder on the full data).<\/li><li><b>Correct order:<\/b> split first → fit preprocessing on training data → transform train and test with the training parameters → use <b>pipelines<\/b>.<\/li><\/ul><h2 id=\"g2-exam-traps\" class=\"trap\">Exam traps<\/h2><ul><li>Outlier ≠ invalid. Median beats mean for skewed data. Mode for categories.<\/li><li>Label-encoding a nominal feature is wrong; one-hot is safer.<\/li><li>Min-max is the most outlier-sensitive scaler; robust scaling the least.<\/li><li>Anything \"fitted\" (median, mean/std, categories) must come from training data only.<\/li><\/ul>"},"3":{"toc":[["g3-how-it-all-fits-the-flow","How it all fits (the flow)"],["g3-features-and-why-they-matter","Features and why they matter"],["g3-feature-engineering","Feature engineering"],["g3-good-vs-bad-features","Good vs bad features"],["g3-feature-selection","Feature selection"],["g3-pca","PCA"],["g3-exam-traps","Exam traps"]],"html":"<h2 id=\"g3-how-it-all-fits-the-flow\" class=\"flow\">How it all fits (the flow)<\/h2><p>After the data is clean, the question becomes *which inputs* the model should see:<\/p><ol><li><b>Features<\/b> are the columns the model learns from; better features usually beat a fancier model.<\/li><li><b>Engineer<\/b> new ones from domain knowledge (ratios, dates, interactions, binning, transforms).<\/li><li><b>Check each feature:<\/b> relevant, available at prediction time (no leakage), not redundant, reliable.<\/li><li><b>Select<\/b> the useful ones: filter methods (fast statistics), wrapper methods (try subsets with a model), embedded methods (selection happens during training, e.g. Lasso, tree importance).<\/li><li><b>Or compress<\/b> with <b>PCA:<\/b> combine correlated features into fewer components that keep most of the variance (at the cost of interpretability).<\/li><\/ol><h2 id=\"g3-features-and-why-they-matter\">Features and why they matter<\/h2><ul><li>A <b>feature<\/b> is a measurable property: numerical, categorical or ordinal. X is an n × p matrix (n samples, p features); y is the target (G3, 0–20 → regression).<\/li><li><b>Garbage in, garbage out.<\/b> Good features can make a simple model beat a complex one on raw data.<\/li><li>Where it fits: after cleaning, before modelling. Split → fit transformations on train → apply to test. Feature work is iterative.<\/li><\/ul><div class=\"tbl-wrap\"><table><thead><tr><th>Approach<\/th><th>What it does<\/th><th>Result<\/th><\/tr><\/thead><tbody><tr><td>Feature engineering<\/td><td>Creates new features from old<\/td><td>Richer representation<\/td><\/tr><tr><td>Feature selection<\/td><td>Keeps a subset of existing features<\/td><td>Smaller, interpretable set<\/td><\/tr><tr><td>PCA<\/td><td>Builds new orthogonal components<\/td><td>Compressed space<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"g3-feature-engineering\">Feature engineering<\/h2><ul><li>X_new = f(X_raw): arithmetic, ratios, recoding, grouping, interactions, domain transformations. Must be <b>reproducible, documented and available at prediction time<\/b>.<\/li><li>A good engineered feature adds useful information, not just more columns, and reflects the real process.<\/li><li><b>Difference<\/b> (grade_progress = G2 − G1): sign = direction (+ improving, − declining, 0 stable). Read it with a <b>level<\/b> feature (G2 or average), since \"stable at 18\" ≠ \"stable at 8\".<\/li><li><b>Summary<\/b> (avg_early_grade = (G1+G2)/2): more stable, less noisy; may keep raw features too.<\/li><li><b>Ratio<\/b> (e.g. absences per grade): compares on a common scale; beware small denominators and meaningless ratios.<\/li><li><b>Interaction<\/b> (study_effect = studytime × G2): one variable's effect depends on another; too many → overfitting.<\/li><li><b>Polynomial<\/b> (G2²): lets a linear model bend; can amplify noise and multicollinearity.<\/li><li><b>Encoding:<\/b> binary → 0/1; nominal → one-hot (<code>pd.get_dummies(df[\"school\"], prefix=\"school\")<\/code> makes school_GP, school_MS); ordinal (studytime) → keep order but state the equal-gap assumption.<\/li><\/ul><h2 id=\"g3-good-vs-bad-features\">Good vs bad features<\/h2><div class=\"tbl-wrap\"><table><thead><tr><th>Good feature<\/th><th>Bad feature (warning signs)<\/th><\/tr><\/thead><tbody><tr><td>High correlation with the target<\/td><td><b>Leaky<\/b>: uses information not available at prediction (most dangerous)<\/td><\/tr><tr><td>Low redundancy<\/td><td>Constant: variance 0<\/td><\/tr><tr><td>Model agnostic<\/td><td>Sparse: almost all 0 or empty<\/td><\/tr><tr><td>Cheap to compute at prediction time<\/td><td>Overfitting: too specific (e.g. Student ID)<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Domain knowledge<\/b> beats blind trial and error: ask \"what would a teacher or advisor find informative?\" Features should be plausible, interpretable and ethically defensible.<\/li><li><b>Common mistakes:<\/b> arbitrary features, target leakage (using G3 or later grades for early warning), too many interactions, unstable ratios, features unavailable at prediction time.<\/li><\/ul><h2 id=\"g3-feature-selection\">Feature selection<\/h2><ul><li>Keeps columns, doesn't change values. Benefits: <b>speed, explainability, robustness<\/b> (less overfitting).<\/li><li><b>Relevant<\/b> (useful about the target, not necessarily causal; may still be excluded if not available), <b>irrelevant<\/b> (noise; but may help in interactions), <b>redundant<\/b> (overlapping info → unstable linear coefficients).<\/li><\/ul><div class=\"tbl-wrap\"><table><thead><tr><th>Family<\/th><th>How<\/th><th>Character<\/th><\/tr><\/thead><tbody><tr><td>Filter<\/td><td>Statistic per feature (correlation \\<\/td><td>r\\<\/td><td>, variance threshold)<\/td><td>Fast, model-free, first screen<\/td><\/tr><tr><td>Wrapper<\/td><td>Trains a model on candidate subsets<\/td><td>Slower (repeated fits), model-aware, often more accurate<\/td><\/tr><tr><td>Embedded<\/td><td>Model selects while training (e.g. Lasso)<\/td><td>Linked to regularisation<\/td><\/tr><tr><td>Permutation importance<\/td><td>Shuffle a feature, measure the prediction drop<\/td><td>Model-based relevance<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Pearson r<\/b> ranges −1 to +1; rank by |r|. Misses nonlinear links and ignores redundancy.<\/li><li><b>Mistakes:<\/b> selecting before the split (leakage), correlation = causation, dropping low-correlation features that matter in interactions, ignoring redundancy, putting the target in the input matrix.<\/li><li>Selection is a <b>decision aid<\/b>, not a mechanical rule.<\/li><\/ul><h2 id=\"g3-pca\">PCA<\/h2><ul><li>Linear dimensionality reduction: rotates axes so <b>PC1<\/b> follows the direction of maximum variance; PC2 the next, <b>orthogonal<\/b> to PC1.<\/li><li><b>Standardise first<\/b> (variance-based, scale-sensitive).<\/li><li>Maths: covariance matrix → eigenvectors (directions) and eigenvalues (variance captured), sorted largest first.<\/li><li><b>Loadings<\/b> = weights of original features in a component; read the largest-magnitude ones; sign shows direction. Loadings are <b>not causal<\/b> and change with data and preprocessing.<\/li><li><b>Explained variance ratio<\/b> and <b>scree plot<\/b> guide how many components (k) to keep; the threshold depends on the task.<\/li><li><b>Selection vs PCA:<\/b> selection keeps original, interpretable columns and can use the target; PCA makes new, less interpretable components, usually unsupervised, good for compactness and removing multicollinearity.<\/li><li><b>PCA mistakes:<\/b> no scaling, naming PC1 \"ability\" without checking loadings, keeping too few components, using PCA when interpretability is the goal, fitting PCA on the full dataset (leakage).<\/li><\/ul><h2 id=\"g3-exam-traps\" class=\"trap\">Exam traps<\/h2><ul><li>Engineering creates; selection keeps; PCA combines.<\/li><li>Filter = fast/statistical; wrapper = slow/iterative; embedded = inside the model.<\/li><li>Fit selection, scaling and PCA on training data only.<\/li><li>A feature that would not exist at prediction time is leakage, however predictive it looks.<\/li><\/ul>"},"4":{"toc":[["g4-how-it-all-fits-the-flow","How it all fits (the flow)"],["g4-classification-basics","Classification basics"],["g4-logistic-regression","Logistic regression"],["g4-k-nearest-neighbours-knn","K-nearest neighbours (KNN)"],["g4-decision-trees","Decision trees"],["g4-evaluation","Evaluation"],["g4-ensembles","Ensembles"],["g4-exam-traps","Exam traps"]],"html":"<h2 id=\"g4-how-it-all-fits-the-flow\" class=\"flow\">How it all fits (the flow)<\/h2><p>Now we predict a <b>category<\/b> (spam / not spam):<\/p><ol><li><b>Choose a classifier:<\/b> logistic regression (probability via the sigmoid, then a threshold), KNN (vote of the nearest neighbours, needs scaling), or a decision tree (if/else splits that reduce impurity).<\/li><li><b>Train on the training set, test on unseen data.<\/b><\/li><li><b>Evaluate with the confusion matrix:<\/b> accuracy can mislead on imbalanced data, so look at precision (how many flagged were right), recall (how many real positives we caught), F1, and ROC-AUC.<\/li><li><b>Improve with ensembles:<\/b> bagging/random forest reduces variance by averaging many trees; boosting reduces bias by training models one after another on previous mistakes; voting/stacking combine different models.<\/li><\/ol><h2 id=\"g4-classification-basics\">Classification basics<\/h2><ul><li>Predicts a <b>category<\/b>. Binary (2 classes), multiclass (one of many), multi-label (several tags at once).<\/li><li>Workflow: preprocessing → feature selection → model induction (training) → evaluation on unseen test data.<\/li><li>Linear regression is a poor classifier: outputs unbounded values and is pulled by outliers.<\/li><\/ul><h2 id=\"g4-logistic-regression\">Logistic regression<\/h2><ul><li>z = w·x + b, then <b>sigmoid<\/b> σ(z) = 1/(1+e^(−z)) gives a probability between 0 and 1 (σ(0) = 0.5). A threshold (usually 0.5) gives the class.<\/li><li>Models <b>log-odds<\/b> linearly: a coefficient = change in log-odds per unit of the feature (not a fixed change in probability).<\/li><li>Cost: <b>log loss / binary cross-entropy<\/b> (MSE is non-convex with the sigmoid). Confident wrong predictions are punished heavily. Minimised by gradient descent.<\/li><li>Strengths: interpretable, efficient, strong baseline.<\/li><\/ul><h2 id=\"g4-k-nearest-neighbours-knn\">K-nearest neighbours (KNN)<\/h2><ul><li><b>Lazy, non-parametric:<\/b> stores the training data; all work happens at prediction (slow on big data; BallTree/KDTree help).<\/li><li>Distance: <b>Euclidean<\/b> (straight line) or <b>Manhattan<\/b> (sum of absolute differences, \"city block\").<\/li><li><b>Scaling is mandatory<\/b>: large-range features dominate distances.<\/li><li><b>K:<\/b> odd K avoids ties in binary problems. Small K → complex boundary, high variance (overfit), outlier-sensitive. Large K → smooth boundary, high bias (underfit).<\/li><li><b>Curse of dimensionality:<\/b> with many features, distances become similar and neighbours lose meaning.<\/li><\/ul><h2 id=\"g4-decision-trees\">Decision trees<\/h2><ul><li>Root → internal nodes (tests) → leaves (predictions); split to make children <b>purer<\/b>.<\/li><li><b>Gini<\/b> = 1 − Σp²: 0 for a pure node, 0.5 for a 50/50 binary node. <b>Entropy<\/b>: 0 pure, 1 for 50/50 binary.<\/li><li><b>Information gain<\/b> = parent entropy − weighted child entropy; choose the split with the highest gain.<\/li><li>Deep trees overfit → <b>pruning<\/b> / limiting depth. Trees are interpretable.<\/li><\/ul><h2 id=\"g4-evaluation\">Evaluation<\/h2><div class=\"tbl-wrap\"><table><thead><tr><th>Term<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>TP / TN<\/td><td>Correct positive / negative<\/td><\/tr><tr><td>FP (Type I)<\/td><td>Predicted positive, actually negative (false alarm)<\/td><\/tr><tr><td>FN (Type II)<\/td><td>Predicted negative, actually positive (miss)<\/td><\/tr><tr><td>Precision<\/td><td>Of predicted positives, how many are right (limits false alarms)<\/td><\/tr><tr><td>Recall<\/td><td>Of actual positives, how many were caught (limits misses)<\/td><\/tr><tr><td>F1<\/td><td>Harmonic mean of precision and recall; good for imbalance<\/td><\/tr><tr><td>Accuracy<\/td><td>Overall correctness; misleading when classes are imbalanced<\/td><\/tr><tr><td>ROC / AUC<\/td><td>TPR vs FPR across thresholds; AUC 1 = perfect, 0.5 = random<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Always read the per-class <b>classification_report<\/b>. Costly misses (disease, fraud) → prioritise recall; costly false alarms → precision.<\/li><\/ul><h2 id=\"g4-ensembles\">Ensembles<\/h2><ul><li><b>Wisdom of the crowd:<\/b> combine diverse models so their errors cancel. Needs <b>diversity<\/b> (different algorithms, data or feature sets); identical models add nothing.<\/li><\/ul><div class=\"tbl-wrap\"><table><thead><tr><th>Type<\/th><th>How<\/th><th>Mainly reduces<\/th><th>Base learner<\/th><\/tr><\/thead><tbody><tr><td>Voting<\/td><td>Different models, same data<\/td><td>Error via averaging<\/td><td>Any<\/td><\/tr><tr><td>Bagging / Random forest<\/td><td>Parallel models on bootstrap samples, majority vote<\/td><td><b>Variance<\/b><\/td><td>Strong, deep trees<\/td><\/tr><tr><td>Boosting<\/td><td>Sequential models fixing previous errors<\/td><td><b>Bias<\/b><\/td><td>Weak learners (stumps, shallow trees)<\/td><\/tr><tr><td>Stacking<\/td><td>Meta-model learns how to combine base models<\/td><td>Learns \"which model to trust\"<\/td><td>Mixed<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Hard voting:<\/b> one vote per model's label. <b>Soft voting:<\/b> average probabilities, then argmax; generally better because confident predictions count more.<\/li><li><b>Random forest:<\/b> bagging rows + random subset of features at each split (decorrelates trees). <b>OOB:<\/b> about 37% of rows left out of each bootstrap give built-in validation. Key settings: n_estimators, max_features.<\/li><li><b>AdaBoost:<\/b> stumps; increase weights of misclassified samples (then normalise) so the next learner focuses on them.<\/li><li><b>Gradient boosting:<\/b> each new tree fits the <b>residuals<\/b> (negative gradient) of the ensemble so far. <b>Learning rate<\/b> shrinks each tree's contribution: lower rate → more trees → usually better generalisation. Keep trees shallow (depth 2–4); subsample &lt; 1 = stochastic boosting.<\/li><li><b>Libraries:<\/b> XGBoost (regularised L1/L2, sparse data, parallel; second-order Taylor; small–medium data), LightGBM (leaf-wise growth; large data), CatBoost (ordered boosting; categorical data).<\/li><li><b>Choosing:<\/b> bagging for stability, boosting for performance, a single tree for interpretability.<\/li><\/ul><h2 id=\"g4-exam-traps\" class=\"trap\">Exam traps<\/h2><ul><li>Bagging ↓ variance (needs complex learners); boosting ↓ bias (uses weak learners). Don't swap them.<\/li><li>Gini 0 / entropy 0 = pure.<\/li><li>Accuracy on 99%-negative data is misleading.<\/li><li>KNN without scaling, or with huge numbers of features, performs badly.<\/li><\/ul>"},"5":{"toc":[["g5-how-it-all-fits-the-flow","How it all fits (the flow)"],["g5-what-regression-is","What regression is"],["g5-the-linear-model","The linear model"],["g5-assumptions-l-i-n-e-one-warning","Assumptions (L-I-N-E + one warning)"],["g5-the-diabetes-dataset","The diabetes dataset"],["g5-evaluation","Evaluation"],["g5-complexity-and-validation","Complexity and validation"],["g5-regularisation","Regularisation"],["g5-ensemble-regression","Ensemble regression"],["g5-exam-traps","Exam traps"]],"html":"<h2 id=\"g5-how-it-all-fits-the-flow\" class=\"flow\">How it all fits (the flow)<\/h2><p>Now we predict a <b>number<\/b> (e.g. disease progression in the diabetes data):<\/p><ol><li><b>Fit a line (or plane):<\/b> linear regression finds coefficients that minimise squared errors.<\/li><li><b>Check the assumptions (LINE):<\/b> Linearity, Independence, Normal residuals, Equal variance, and watch for multicollinearity.<\/li><li><b>Evaluate:<\/b> MAE, MSE/RMSE (error size) and R² (share of variance explained) on test data.<\/li><li><b>Control complexity:<\/b> too simple underfits, too complex overfits; use cross-validation to tell.<\/li><li><b>Regularise:<\/b> Ridge shrinks coefficients, Lasso can set some to zero (feature selection), Elastic Net mixes both.<\/li><li><b>Go non-linear with ensembles:<\/b> random forest and gradient boosting regressors when a straight line is not enough.<\/li><\/ol><h2 id=\"g5-what-regression-is\">What regression is<\/h2><ul><li>Predicts a <b>continuous number<\/b> (price, temperature, progression score). If the answer is a label, it's classification.<\/li><li>Vocabulary: sample (row), feature x (predictor, independent variable), target y (response), model ŷ, parameter β (weight/coefficient), <b>residual e = y − ŷ<\/b> (positive residual = predicted too low), training/test set.<\/li><\/ul><h2 id=\"g5-the-linear-model\">The linear model<\/h2><ul><li>ŷ = β₀ + β₁x₁ + … + βₚxₚ. <b>β₀ intercept<\/b>: prediction when all features are 0 (with centred data, the prediction at the average). <b>βⱼ<\/b>: change in prediction per one-unit rise in xⱼ, *other features held constant*. One feature = line, two = plane, many = hyperplane.<\/li><li><b>Learning:<\/b> guess → measure cost J(β) = mean squared residual → adjust → repeat. Squaring stops positive and negative errors cancelling and punishes big misses more.<\/li><li><b>Normal equation<\/b> (exact, one step, heavy with many features) vs <b>gradient descent<\/b> (small steps of size η; scales to huge data; too large a step overshoots).<\/li><li>Coefficients show <b>association, not causation<\/b>; adding predictors helps account for confounders.<\/li><\/ul><h2 id=\"g5-assumptions-l-i-n-e-one-warning\">Assumptions (L-I-N-E + one warning)<\/h2><div class=\"tbl-wrap\"><table><thead><tr><th>Assumption<\/th><th>Meaning<\/th><th>If it fails<\/th><\/tr><\/thead><tbody><tr><td><b>L<\/b>inearity<\/td><td>Each feature moves y in a straight line<\/td><td>Underfits; residuals show a pattern (U-shape)<\/td><\/tr><tr><td><b>I<\/b>ndependence<\/td><td>Rows don't inform each other<\/td><td>Model looks better than it really is<\/td><\/tr><tr><td><b>N<\/b>ormality of errors<\/td><td>Residuals symmetric around 0<\/td><td>p-values and confidence intervals untrustworthy<\/td><\/tr><tr><td><b>E<\/b>qual variance<\/td><td>Residual spread constant<\/td><td>Accurate for some values, poor for others (funnel = heteroscedasticity)<\/td><\/tr><tr><td>Multicollinearity (warning)<\/td><td>Two features carry the same information<\/td><td>Weights unstable and meaningless<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Check by plotting residuals; never assume.<\/b><\/li><\/ul><h2 id=\"g5-the-diabetes-dataset\">The diabetes dataset<\/h2><ul><li>442 patients, 10 baseline features (age, sex, bmi, bp, s1–s6), target = disease progression one year later (about 25–346).<\/li><li>Features are <b>already standardised<\/b> in scikit-learn, so linear coefficients can be compared directly as importance.<\/li><li>Simple model on BMI: slope ≈ 949, intercept ≈ 152 (score at average BMI). Upward trend = correlation, not proof of cause.<\/li><li>Tree models rank <b>BMI and S5<\/b> as most important; gender has near-zero importance (could be dropped).<\/li><li>80/20 split is standard for medium data; with only 442 rows, <b>K-fold CV<\/b> gives a more stable estimate.<\/li><\/ul><h2 id=\"g5-evaluation\">Evaluation<\/h2><div class=\"tbl-wrap\"><table><thead><tr><th>Metric<\/th><th>Unit<\/th><th>Behaviour<\/th><\/tr><\/thead><tbody><tr><td>MAE<\/td><td>Target's unit<\/td><td>Treats errors equally; robust; easiest to explain<\/td><\/tr><tr><td>MSE<\/td><td>Target squared<\/td><td>Squares errors → outliers dominate; smooth, used as training loss<\/td><\/tr><tr><td>RMSE<\/td><td>Target's unit<\/td><td>MSE's sensitivity in readable units; usual reporting metric<\/td><\/tr><tr><td>R²<\/td><td>Unitless, (−∞, 1]<\/td><td>Share of variance explained; 0 = predicting the mean; negative = worse than the mean<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Report <b>RMSE with R²<\/b>. <b>Actual vs predicted plot:<\/b> perfect = 45° line. <b>Residual plot:<\/b> random around 0 is good; U-shape = non-linearity; funnel = unequal variance.<\/li><\/ul><h2 id=\"g5-complexity-and-validation\">Complexity and validation<\/h2><ul><li><b>Bias-variance:<\/b> high bias = too simple (underfit); high variance = too complex (overfit). Aim for the complexity that minimises total error.<\/li><li><b>Hold-out<\/b> (e.g. 60/20/20): cheap, one fit, but depends on which rows land in validation. <b>K-fold CV:<\/b> K fits, each row validates once, average + standard deviation; preferred for small data.<\/li><li><b>Rule:<\/b> tune hyperparameters on validation folds only; touch the test set <b>once<\/b>, at the end.<\/li><li><b>Polynomial regression:<\/b> adds x², x³ columns; still <b>linear in β<\/b>. Degree 1 underfits, 2–3 usually best, 10 overfits. Choose the degree with CV.<\/li><\/ul><h2 id=\"g5-regularisation\">Regularisation<\/h2><ul><li>Loss = MSE + λ × penalty. λ = 0 → ordinary least squares; very large λ → coefficients flattened, model drifts to predicting the mean.<\/li><li><b>Ridge (L2):<\/b> Σβ²; shrinks all weights towards 0, never exactly 0; best with correlated features.<\/li><li><b>Lasso (L1):<\/b> Σ|β|; can set weights <b>exactly to 0<\/b> → automatic feature selection.<\/li><li>In scikit-learn, <b>alpha<\/b> = λ.<\/li><\/ul><h2 id=\"g5-ensemble-regression\">Ensemble regression<\/h2><ul><li><b>Random forest regressor:<\/b> many trees on random rows and random feature subsets (double randomness → decorrelated); <b>reduces variance<\/b>. If it overfits, <b>decrease max_depth<\/b> (or raise min_samples_split); more trees rarely hurt.<\/li><li><b>Gradient boosting:<\/b> Fₘ(x) = Fₘ₋₁(x) + η·hₘ(x); sequential, each tree fits the remaining residuals; <b>reduces bias<\/b>. Sensitive to learning rate and too many trees. Smaller η needs more trees; max_depth 2–4 keeps trees weak; subsample &lt; 1 = stochastic boosting.<\/li><li>Gradient boosting = gradient descent in function space.<\/li><\/ul><h2 id=\"g5-exam-traps\" class=\"trap\">Exam traps<\/h2><ul><li>Polynomial regression is still a linear model (linear in its coefficients).<\/li><li>Lasso deletes features; Ridge only shrinks.<\/li><li>MSE punishes outliers most; MAE is the robust one.<\/li><li>Never tune on the test set.<\/li><li>Bagging/RF ↓ variance; boosting ↓ bias.<\/li><\/ul>"}}</script>
<script>
"use strict";
// ---------- data ----------
const RAW = JSON.parse(document.getElementById("bank").textContent);
const LESSON_NO = { 1: "Lec 1", 2: "Lec 2.1", 3: "Lec 3.1", 4: "Lec 4.1", 5: "Lec 5.1" };
const TYPE_NAME = { tf: "True/False", mcq: "Multiple choice", match: "Matching" };
const DIFF_NAME = { easy: "Easy", medium: "Medium", hard: "Difficult" };
const SKILL_NAME = { recall: "Recall", understanding: "Understanding", application: "Application", analysis: "Analysis", scenario: "Scenario reasoning" };

function validateBank(raw) {
  const issues = [], ok = [], seen = new Set();
  for (const q of raw.questions || []) {
    const bad = (m) => issues.push(`${q.id || "?"}: ${m}`);
    if (!q.id || seen.has(q.id)) { bad("missing or duplicate id"); continue; }
    if (![1,2,3,4,5].includes(q.lesson)) { bad("unknown lesson"); continue; }
    if (!TYPE_NAME[q.type] || !DIFF_NAME[q.difficulty] || !SKILL_NAME[q.skill]) { bad("bad type, difficulty or skill"); continue; }
    if (!q.question || !q.explanation) { bad("missing text"); continue; }
    if (q.type === "tf" && typeof q.answer !== "boolean") { bad("true/false answer missing"); continue; }
    if (q.type === "mcq" && (!Array.isArray(q.options) || q.options.length < 2 || !(q.answer >= 0 && q.answer < q.options.length))) { bad("MCQ answer out of range"); continue; }
    if (q.type === "match") {
      const L = new Set((q.pairs || []).map(p => p.left)), R = new Set((q.pairs || []).map(p => p.right));
      if (!q.pairs || q.pairs.length < 2 || L.size !== q.pairs.length || R.size !== q.pairs.length) { bad("matching key is not one-to-one"); continue; }
    }
    seen.add(q.id); ok.push(q);
  }
  return { ok, issues };
}
const VALID = validateBank(RAW);
const QS = VALID.ok;
const Q = Object.fromEntries(QS.map((q, i) => [q.id, Object.assign(q, { _i: i })]));
const LESSONS = RAW.lessons;
const byLesson = (l) => QS.filter(q => q.lesson === l);
const topicsOf = (qs) => [...new Set(qs.map(q => q.topic))];

// ---------- storage ----------
const KEY = "midterm-mastery-v1";
const STANDALONE = !(window.claude && window.claude.use);
if (STANDALONE && navigator.storage && navigator.storage.persist) { try { navigator.storage.persist().catch(() => {}); } catch (e) {} }
let store = { v: 1, updatedAt: 0, progress: {}, flags: {}, session: null, lastView: "dashboard", theme: null };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.v === 1) store = Object.assign(store, s); } catch (e) {}
let remote = null, syncTimer = null;
const ACCOUNT = { enabled: false, ready: false, user: null, busy: false, msg: "", err: false, mode: "in", lastSync: 0, syncErr: "" };
function save(touch = true) {
  if (touch) store.updatedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
  if (remote) { clearTimeout(syncTimer); syncTimer = setTimeout(pushRemote, 2500); }
}
async function pushRemote() {
  if (!remote) return;
  try {
    await remote.doc.set({ blob: JSON.stringify(store), updatedAt: store.updatedAt });
    ACCOUNT.lastSync = Date.now(); ACCOUNT.syncErr = ""; setSync("Synced to your account");
  } catch (e) { ACCOUNT.syncErr = syncError(e); setSync(ACCOUNT.syncErr); }
}
function setSync(t) { const el = document.getElementById("sync"); if (el) el.textContent = t; }
// Combine two copies of the saved state (this device and the account) without losing answers:
// for each question keep the more recent record; flags and the unfinished session come from
// whichever copy changed last, except that a session in progress on this device is never replaced.
function mergeStores(local, incoming) {
  const out = Object.assign({}, local);
  const lp = local.progress || {}, ip = incoming.progress || {};
  const progress = Object.assign({}, lp);
  for (const id in ip) {
    const a = lp[id], b = ip[id];
    if (!a || (b.at || 0) > (a.at || 0) || ((b.at || 0) === (a.at || 0) && (b.a || 0) > (a.a || 0))) progress[id] = b;
  }
  out.resetAt = Math.max(local.resetAt || 0, incoming.resetAt || 0);
  for (const id in progress) if ((progress[id].at || 0) <= out.resetAt) delete progress[id];
  out.progress = progress;
  const incomingNewer = (incoming.updatedAt || 0) > (local.updatedAt || 0);
  if (incomingNewer) out.flags = incoming.flags || {};
  const localLive = local.session && !local.session.submitted;
  if (!localLive && incomingNewer) out.session = incoming.session || null;
  out.updatedAt = Math.max(local.updatedAt || 0, incoming.updatedAt || 0);
  out.theme = local.theme; out.lastView = local.lastView;
  return out;
}
let pulling = false;
async function pullRemote() {
  if (!remote || pulling) return;
  pulling = true;
  try {
    const snap = await remote.doc.get();
    const data = snap && snap.exists ? snap.data() : null;
    let incoming = null;
    try { incoming = data && data.blob ? JSON.parse(data.blob) : null; } catch (e) {}
    if (incoming && incoming.v === 1) {
      const before = JSON.stringify([store.progress, store.flags, store.session]);
      store = mergeStores(store, incoming);
      try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
      if (JSON.stringify([store.progress, store.flags, store.session]) !== before && view.name !== "session") render();
    }
    await pushRemote();
  } catch (e) { setSync(syncError(e)); }
  finally { pulling = false; }
}
async function connectRemote() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    remote = { doc: db.doc("data/users/" + id + "/state"), label: "your account" };
    await pullRemote();
  } catch (e) { remote = null; }
}

// ---------- optional sign-in (standalone site with a Firebase project) ----------
// The hosted copy can include firebase-config.js, which sets window.FIREBASE_CONFIG. Without it the
// sign-in card stays hidden and progress is saved in this browser only.
const FB_VERSION = "10.12.2";
function syncError(e) {
  const code = (e && e.code) || "";
  if (code.includes("permission-denied")) return "Sync blocked: check the Firestore rules";
  if (code.includes("unavailable") || code.includes("network")) return "Offline: saved on this phone, will sync later";
  return "Saved on this phone (sync failed)";
}
function loadScript(src) {
  return new Promise((ok, fail) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => fail(new Error("load " + src)); document.head.appendChild(s); });
}
async function connectFirebase() {
  const cfg = window.FIREBASE_CONFIG;
  if (!STANDALONE || !cfg || !cfg.apiKey || !cfg.projectId) return;
  ACCOUNT.enabled = true; render();
  try {
    const base = "https://www.gstatic.com/firebasejs/" + FB_VERSION + "/";
    await loadScript(base + "firebase-app-compat.js");
    await Promise.all([loadScript(base + "firebase-auth-compat.js"), loadScript(base + "firebase-firestore-compat.js")]);
    const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg);
    ACCOUNT.auth = app.auth(); ACCOUNT.db = app.firestore();
    await ACCOUNT.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
    ACCOUNT.auth.onAuthStateChanged(async (u) => {
      ACCOUNT.ready = true; ACCOUNT.user = u;
      if (u) {
        remote = { doc: ACCOUNT.db.collection("users").doc(u.uid), label: u.email };
        setSync("Syncing…");
        await pullRemote();
      } else { remote = null; setSync("Saved in this browser"); }
      if (view.name !== "session") render();
    });
  } catch (e) {
    ACCOUNT.ready = true; ACCOUNT.msg = "Sign-in could not load. Check your connection and reload the page."; ACCOUNT.err = true; render();
  }
}
function authMessage(e) {
  const code = (e && e.code) || "";
  const m = {
    "auth/invalid-email": "That email address doesn't look right.",
    "auth/missing-password": "Enter your password.",
    "auth/invalid-credential": "Wrong email or password.",
    "auth/wrong-password": "Wrong email or password.",
    "auth/user-not-found": "No account with that email. Choose 'Create account' instead.",
    "auth/email-already-in-use": "An account with that email already exists. Sign in instead.",
    "auth/weak-password": "Use a password of at least 6 characters.",
    "auth/too-many-requests": "Too many attempts. Wait a few minutes and try again.",
    "auth/network-request-failed": "No connection. Check your internet and try again.",
    "auth/operation-not-allowed": "Email sign-in is not switched on in the Firebase project yet.",
  };
  return m[code] || "Something went wrong" + (code ? " (" + code + ")" : "") + ".";
}
async function accountAction(kind) {
  if (!ACCOUNT.auth || ACCOUNT.busy) return;
  const email = (document.getElementById("acEmail")?.value || "").trim();
  const pass = document.getElementById("acPass")?.value || "";
  ACCOUNT.busy = true; ACCOUNT.msg = ""; ACCOUNT.err = false; render();
  try {
    if (kind === "in") await ACCOUNT.auth.signInWithEmailAndPassword(email, pass);
    else if (kind === "up") await ACCOUNT.auth.createUserWithEmailAndPassword(email, pass);
    else if (kind === "reset") {
      if (!email) throw { code: "auth/invalid-email" };
      await ACCOUNT.auth.sendPasswordResetEmail(email);
      ACCOUNT.msg = "If an account exists for " + email + ", a reset link is on its way. Check spam too.";
    } else if (kind === "out") { await pushRemote(); await ACCOUNT.auth.signOut(); toast("Signed out. Progress stays on this phone."); }
  } catch (e) { ACCOUNT.msg = authMessage(e); ACCOUNT.err = true; }
  ACCOUNT.busy = false; render();
  if (ACCOUNT.err) { const el = document.getElementById("acEmail"); if (el) el.value = email; }
}
function renderAccountCard() {
  if (!ACCOUNT.enabled) return "";
  const A = ACCOUNT;
  const note = A.msg ? `<p class="small" role="${A.err ? "alert" : "status"}" style="color:var(${A.err ? "--bad" : "--good"})">${esc(A.msg)}</p>` : "";
  if (!A.ready) return `<section class="section"><div class="card"><h3>Your account</h3><p class="small muted">Loading sign-in…</p></div></section>`;
  if (A.user) return `<section class="section"><div class="card row between">
      <div class="stack" style="gap:4px;min-width:0"><h3>Signed in</h3><p class="small muted" style="overflow-wrap:anywhere">${esc(A.user.email || "")} · progress syncs to every phone where you sign in with this account.</p><p class="small" style="color:var(${A.syncErr ? "--bad" : "--ink-3"})">${A.syncErr ? esc(A.syncErr) : A.lastSync ? "Last synced " + new Date(A.lastSync).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "Syncing…"}</p>${note}</div>
      <button class="btn" data-act="acOut" ${A.busy ? "disabled" : ""}>Sign out</button></div></section>`;
  const up = A.mode === "up";
  return `<section class="section"><form class="card stack" id="acForm" style="gap:12px" autocomplete="on">
      <div class="stack" style="gap:4px"><h3>${up ? "Create an account" : "Sign in to sync your progress"}</h3>
        <p class="small muted">${up ? "Use any email and a password of at least 6 characters. Your progress on this phone is kept and uploaded." : "Sign in with the same email on any phone and your progress follows you."}</p></div>
      <label class="field"><span class="small">Email</span><input type="email" id="acEmail" autocomplete="email" inputmode="email" required></label>
      <label class="field"><span class="small">Password</span><input type="password" id="acPass" autocomplete="${up ? "new-password" : "current-password"}" minlength="6" required></label>
      ${note}
      <div class="row"><button class="btn primary" type="submit" ${A.busy ? "disabled" : ""}>${A.busy ? "Please wait…" : up ? "Create account" : "Sign in"}</button>
        <button class="btn ghost" type="button" data-act="acMode">${up ? "I already have an account" : "Create account"}</button>
        ${up ? "" : `<button class="linkish small" type="button" data-act="acReset">Forgot password?</button>`}</div>
    </form></section>`;
}

// ---------- progress ----------
function prog(id) { return store.progress[id] || null; }
function record(id, correct) {
  const p = store.progress[id] || { a: 0, c: 0, w: 0, last: null, at: 0 };
  p.a++; if (correct) p.c++; else p.w++; p.last = correct ? 1 : 0; p.at = Date.now();
  store.progress[id] = p;
}
const isMastered = (id) => prog(id)?.last === 1;
const isWrong = (id) => prog(id)?.last === 0;
const isAttempted = (id) => !!prog(id);
function summary(qs) {
  let att = 0, mas = 0, wrong = 0, a = 0, c = 0;
  for (const q of qs) { const p = prog(q.id); if (!p) continue; att++; if (p.last === 1) mas++; else wrong++; a += p.a; c += p.c; }
  return { total: qs.length, att, mas, wrong, acc: a ? c / a : null, attempts: a, correct: c };
}
function topicStats(qs) {
  const m = {};
  for (const q of qs) {
    const t = m[q.topic] || (m[q.topic] = { topic: q.topic, lesson: q.lesson, n: 0, a: 0, c: 0, att: 0 });
    t.n++; const p = prog(q.id); if (p) { t.a += p.a; t.c += p.c; t.att++; }
  }
  return Object.values(m).map(t => Object.assign(t, { acc: t.a ? t.c / t.a : null }));
}
function weakTopics(qs, limit = 6) {
  return topicStats(qs).filter(t => t.a >= 2 && t.acc < 0.7).sort((x, y) => x.acc - y.acc).slice(0, limit);
}

// ---------- helpers ----------
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (x) => x == null ? "–" : Math.round(x * 100) + "%";
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmtTime = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(ss).padStart(2, "0"); };
const diffPips = (d) => `<span class="diff ${d}" title="${DIFF_NAME[d]}" aria-label="${DIFF_NAME[d]}"><i></i><i></i><i></i></span>`;
function progressBar(s) {
  const t = s.total || 1;
  return `<div class="bar" role="img" aria-label="${s.mas} mastered, ${s.wrong} to fix, of ${s.total}"><span class="m" style="width:${100 * s.mas / t}%"></span><span class="x" style="width:${100 * s.wrong / t}%"></span></div>`;
}
function toast(msg) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2600);
}
function confirmBox({ title, body, ok = "Confirm", danger = false, cancel = "Cancel", onOk }) {
  const layer = document.getElementById("layer");
  layer.innerHTML = `<div class="modal-bg" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="modal">

  const close = () => { layer.innerHTML = ""; };

// ---------- grading ----------
function grade(q, ans) {
  if (ans == null || (q.type === "match" && !Object.keys(ans).length)) return { answered: false, correct: false, credit: 0 };
  if (q.type === "tf") return { answered: true, correct: ans === q.answer, credit: ans === q.answer ? 1 : 0 };
  if (q.type === "mcq") return { answered: true, correct: ans === q.answer, credit: ans === q.answer ? 1 : 0 };
  let right = 0;
  q.pairs.forEach((p, i) => { if (ans[i] === p.right) right++; });
  const n = q.pairs.length;
  return { answered: true, correct: right === n, credit: right / n, right, n, complete: Object.keys(ans).filter(k => ans[k]).length === n };
}
function answerText(q, ans) {
  if (ans == null) return "No answer";
  if (q.type === "tf") return ans ? "True" : "False";
  if (q.type === "mcq") return q.options[ans];
  return q.pairs.map((p, i) => `${p.left} → ${ans[i] || "(blank)"}`).join("; ");
}
function correctText(q) {
  if (q.type === "tf") return q.answer ? "True" : "False";
  if (q.type === "mcq") return q.options[q.answer];
  return q.pairs.map(p => `${p.left} → ${p.right}`).join("; ");
}

// ---------- sessions ----------
function makeSession({ kind, title, qids, origin, cfg = {} }) {
  const optOrder = {}, rightOrder = {};
  for (const id of qids) {
    const q = Q[id];
    if (q.type === "mcq") optOrder[id] = cfg.shuffleOpts ? shuffle(q.options.map((_, i) => i)) : q.options.map((_, i) => i);
    if (q.type === "match") rightOrder[id] = shuffle(q.pairs.map(p => p.right));
  }
  return { kind, title, qids, origin, cfg, optOrder, rightOrder, answers: {}, checked: {}, flags: {}, idx: 0,
           startedAt: Date.now(), elapsed: 0, limit: cfg.timer ? cfg.timer * 60000 : 0, submitted: false, result: null };
}
function startSession(opts) {
  if (!opts.qids.length) { toast("There are no questions in this selection yet."); return; }
  const go = () => {
    store.session = makeSession(opts);
    // flags carry over from the review list
    for (const id of store.session.qids) if (store.flags[id]) store.session.flags[id] = true;
    store.lastView = "session"; save(); nav({ name: "session" });
  };
  const s = store.session;
  if (s && !s.submitted && Object.keys(s.answers).length) {
    confirmBox({ title: "Replace your unfinished session?", ok: "Start new session", danger: true,
      body: `You have an unfinished session, “${esc(s.title)}”, with ${Object.keys(s.answers).length} answered question(s). Starting a new one discards it.`, onOk: go });
  } else go();
}
function lessonOrigin(l) { return l ? { view: "lesson", lesson: l } : { view: "comp" }; }

function submitSession(auto = false) {
  const s = store.session; if (!s || s.submitted) return;
  tickTimer(true);
  const items = s.qids.map(id => ({ id, ans: s.answers[id] ?? null, g: grade(Q[id], s.answers[id] ?? null), flagged: !!s.flags[id] }));
  if (s.kind === "exam") for (const it of items) if (it.g.answered) record(it.id, it.g.correct);
  // practice records on check; unchecked-but-answered practice items are graded now
  if (s.kind === "practice") for (const it of items) if (it.g.answered && !s.checked[it.id]) record(it.id, it.g.correct);
  const score = items.reduce((t, it) => t + it.g.credit, 0);
  s.result = { items, score, total: items.length, at: Date.now(), elapsed: s.elapsed, auto };
  s.submitted = true; store.lastView = "results"; save();
  nav({ name: "results" });
  if (auto) toast("Time is up. Your exam was submitted.");
}

// ---------- timer ----------
let timerHandle = null, lastTick = 0;
function tickTimer(final = false) {
  const s = store.session; if (!s || s.submitted) return;
  const now = Date.now(); if (lastTick) s.elapsed += now - lastTick; lastTick = now;
  const el = document.getElementById("timer");
  if (el) {
    if (s.limit) { const left = s.limit - s.elapsed; el.textContent = fmtTime(left) + " left"; el.classList.toggle("low", left < 60000); if (left <= 0 && !final) { submitSession(true); return; } }
    else el.textContent = fmtTime(s.elapsed);
  }
  if (!final && Math.floor(s.elapsed / 5000) !== Math.floor((s.elapsed - 1000) / 5000)) save(false);
}
function startTimer() { stopTimer(); lastTick = Date.now(); timerHandle = setInterval(tickTimer, 1000); }
function stopTimer() { if (timerHandle) { tickTimer(true); clearInterval(timerHandle); timerHandle = null; lastTick = 0; save(false); } }
document.addEventListener("visibilitychange", () => { if (document.hidden) stopTimer(); else if (view.name === "session") startTimer(); });

// ---------- selection ----------
function stratify(items, keyFn) {
  const groups = {};
  for (const it of shuffle(items)) (groups[keyFn(it)] ||= []).push(it);
  const lists = shuffle(Object.values(groups)), out = [];
  let more = true;
  while (more) { more = false; for (const l of lists) if (l.length) { out.push(l.shift()); more = true; } }
  return out;
}
function poolFor(cfg) {
  return QS.filter(q => cfg.lessons.includes(q.lesson) && (cfg.type === "all" || q.type === cfg.type) &&
    (["easy", "medium", "hard"].includes(cfg.diff) ? q.difficulty === cfg.diff : true));
}
function drawSet(cfg) {
  const pool = poolFor(cfg);
  let chosen;
  const key = q => q.lesson + "|" + q.type;
  if (cfg.full) chosen = pool.slice();
  else {
    const N = Math.min(cfg.n, pool.length);
    if (cfg.diff === "block") {
      const tE = Math.round(N * 3 / 5), tM = Math.round(N / 5), tH = N - tE - tM;
      const take = (d, t) => stratify(pool.filter(q => q.difficulty === d), key).slice(0, t);
      chosen = [...take("easy", tE), ...take("medium", tM), ...take("hard", tH)];
      if (chosen.length < N) { const have = new Set(chosen.map(q => q.id)); chosen.push(...stratify(pool.filter(q => !have.has(q.id)), key).slice(0, N - chosen.length)); }
    } else chosen = stratify(pool, key).slice(0, N);
  }
  chosen = cfg.shuffleQ ? shuffle(chosen) : chosen.sort((a, b) => a._i - b._i);
  return chosen.map(q => q.id);
}

}

}

}
function readBuilder() {
  const f = document.getElementById("builder"); if (!f) return;
  const c = bcfg;
  if (!c.lockLesson) c.lessons = [...f.querySelectorAll('input[name="lessons"]:checked')].map(i => +i.value);
  c.mode = f.querySelector('input[name="mode"]:checked').value;
  c.type = f.querySelector('input[name="type"]:checked').value;
  c.diff = f.querySelector('input[name="diff"]:checked').value;
  c.full = f.querySelector('input[name="len"]:checked').value === "full";
  c.n = Math.max(1, Math.min(QS.length, parseInt(f.querySelector("#nq").value, 10) || 1));
  c.shuffleQ = f.querySelector("#shQ").checked; c.shuffleOpts = f.querySelector("#shO").checked;
  c.timer = Math.max(0, Math.min(600, parseInt(f.querySelector("#tm").value, 10) || 0));
}
function updatePreview() {
  readBuilder();
  const c = bcfg, el = document.getElementById("preview"); if (!el) return;
  c.draw = c.lessons.length ? drawSet(c) : [];
  const qs = c.draw.map(id => Q[id]);
  const pool = c.lessons.length ? poolFor(c) : [];
  const cnt = (f, keys) => keys.map(k => [k, qs.filter(q => f(q) === k).length]);
  const rows = (pairs, name) => pairs.map(([k, v]) => `<tr><td>${name(k)}</td><td class="num">${v}</td></tr>`).join("");
  if (!qs.length) { el.innerHTML = `<div class="empty"><b>No questions match</b><p class="small">Select at least one lesson, or widen the type or difficulty filters.</p></div>`; return; }

  el.innerHTML = `
    <div class="row between"><h3>${qs.length} question${qs.length > 1 ? "s" : ""}</h3><button type="button" class="btn ghost sm" data-act="redraw" ${c.full ? "disabled" : ""}>Draw again</button></div>
    <p class="small muted">${c.full ? `Full bank: all ${pool.length} eligible questions, each exactly once.` : `Drawn from ${pool.length} eligible questions, spread across lessons and types.`}${short ? " Fewer are available than you asked for." : ""}</p>
    <div class="tbl-wrap"><table><tbody>
      ${rows(cnt(q => q.lesson, [...new Set(qs.map(q => q.lesson))].sort()), k => LESSON_NO[k])}
    </tbody></table></div>
    <div class="tbl-wrap"><table><tbody>
      ${rows(cnt(q => q.type, ["tf", "mcq", "match"]).filter(r => r[1]), k => TYPE_NAME[k])}
      ${rows(cnt(q => q.difficulty, ["easy", "medium", "hard"]).filter(r => r[1]), k => DIFF_NAME[k])}

// ---------- views: session ----------
function renderSession() {
  const s = store.session;
  if (!s) return `<div class="empty"><p>No session in progress.</p><button class="btn" data-act="home">Back to dashboard</button></div>`;
  if (s.submitted) { view = { name: "results" }; return renderResults(); }
  const id = s.qids[s.idx], q = Q[id], exam = s.kind === "exam";
  const ans = s.answers[id], checked = !!s.checked[id];
  const answered = s.qids.filter(x => s.answers[x] != null && !(Q[x].type === "match" && !Object.values(s.answers[x]).some(Boolean))).length;
  const g = checked ? grade(q, ans) : null;
  let body = "";
  if (q.type === "mcq") {
    body = `<div class="opts" role="radiogroup" aria-label="Answer options">${s.optOrder[id].map((oi, k) => {
      let cls = ans === oi ? "sel" : "";
      if (checked) cls = oi === q.answer ? "right" : (ans === oi ? "wrong" : "");
      return `<button class="opt ${cls}" role="radio" aria-checked="${ans === oi}" data-act="pick" data-v="${oi}" ${checked ? "disabled" : ""}><span class="key">${"ABCD"[k] || k + 1}</span><span>${esc(q.options[oi])}</span></button>`;
    }).join("")}</div>`;
  } else if (q.type === "tf") {
    body = `<div class="tf" role="radiogroup" aria-label="True or false">${[true, false].map((v, k) => {
      let cls = ans === v ? "sel" : "";
      if (checked) cls = v === q.answer ? "right" : (ans === v ? "wrong" : "");
      return `<button class="opt ${cls}" role="radio" aria-checked="${ans === v}" data-act="pickTF" data-v="${v}" ${checked ? "disabled" : ""}><span class="key">${k + 1}</span><span>${v ? "True" : "False"}</span></button>`;
    }).join("")}</div>`;
  } else {
    const a = ans || {};
    body = `<p class="small muted">Choose the matching description for each item. Each description is used once.</p><div class="match">${q.pairs.map((p, i) => {
      const cls = checked ? (a[i] === p.right ? "right" : "wrong") : "";
      return `<div class="match-row ${cls}"><label for="m${i}">${esc(p.left)}</label>
        <select id="m${i}" data-act="matchSel" data-i="${i}" ${checked ? "disabled" : ""}><option value="">Select…</option>${s.rightOrder[id].map(r => `<option ${a[i] === r ? "selected" : ""}>${esc(r)}</option>`).join("")}</select>
        ${checked && a[i] !== p.right ? `<div class="small" style="grid-column:1/-1;color:var(--good)">Correct: ${esc(p.right)}</div>` : ""}</div>`;
    }).join("")}</div>`;
  }
  const navBtns = s.qids.map((x, i) => {
    let cls = i === s.idx ? "cur " : "";
    const a = s.answers[x];
    if (s.checked[x]) cls += grade(Q[x], a).correct ? "ok" : "no";
    else if (a != null) cls += "ans";
    if (s.flags[x]) cls += " flag";
    return `<button class="${cls}" data-act="goto" data-i="${i}" aria-label="Question ${i + 1}${a != null ? ", answered" : ", unanswered"}${s.flags[x] ? ", flagged" : ""}">${i + 1}</button>`;
  }).join("");
  const unanswered = s.qids.length - answered;
  return `
  <div class="row between" style="margin-top:16px">
    <div class="stack" style="gap:2px"><div class="eyebrow">${exam ? "Exam mode" : "Practice mode"}</div><h2>${esc(s.title)}</h2></div>
    <div class="row"><span class="chip"><span class="timer" id="timer">${s.limit ? fmtTime(s.limit - s.elapsed) + " left" : fmtTime(s.elapsed)}</span></span>
      <button class="btn ghost sm" data-act="leave">Save &amp; exit</button>
      <button class="btn ${exam ? "primary" : ""} sm" data-act="submit">${exam ? "Submit exam" : "Finish & see results"}</button></div>
  </div>
  <div class="session">
    <article class="sheet" aria-labelledby="qtext">
      <div class="row between">
        <div class="row" style="gap:6px">
          <span class="chip acc">${LESSON_NO[q.lesson]}</span><span class="chip">${TYPE_NAME[q.type]}</span><span class="chip">${diffPips(q.difficulty)} ${DIFF_NAME[q.difficulty]}</span>
          ${exam ? "" : `<span class="chip">${esc(q.topic)}</span><span class="chip">${SKILL_NAME[q.skill]}</span>`}
        </div>
        <span class="qid">Q${s.idx + 1} of ${s.qids.length}</span>
      </div>
      <div class="bar" aria-hidden="true"><span class="a" style="width:${100 * answered / s.qids.length}%"></span></div>
      <p class="qtext" id="qtext">${esc(q.question)}</p>
      ${body}
      ${checked ? feedbackBlock(q, ans, g) : ""}
      <div class="row between">
        <div class="row"><button class="btn" data-act="prev" ${s.idx === 0 ? "disabled" : ""}>← Previous</button>
          <button class="btn ${s.flags[id] ? "" : "ghost"}" data-act="flag" aria-pressed="${!!s.flags[id]}">${s.flags[id] ? "★ Flagged" : "☆ Flag for review"}</button></div>
        <div class="row">
          ${!exam && !checked ? `<button class="btn primary" data-act="check" ${ans == null ? "disabled" : ""}>Check answer</button>` : ""}
          ${s.idx < s.qids.length - 1 ? `<button class="btn ${exam || checked ? "primary" : ""}" data-act="next">Next →</button>` : `<button class="btn primary" data-act="submit">${exam ? "Submit exam" : "Finish"}</button>`}
        </div>
      </div>
    </article>
    <aside class="sticky-side">
      <div class="card stack">
        <div class="row between"><b>Questions</b><span class="small muted">${answered} answered · ${unanswered} left</span></div>
        <div class="nav-grid">${navBtns}</div>
        <div class="legend"><span><i style="background:var(--accent-soft)"></i>Answered</span>${exam ? "" : `<span><i style="background:var(--good-soft)"></i>Right</span><span><i style="background:var(--bad-soft)"></i>Wrong</span>`}<span><i style="background:var(--mark);border-radius:50%"></i>Flagged</span><span><i></i>Unanswered</span></div>
      </div>
      <p class="small muted">Keys: ← → to move, 1–4 to choose an answer.</p>
    </aside>
  </div>`;
}
function feedbackBlock(q, ans, g) {
  const ok = g.correct;
  let why = "";
  if (q.type === "mcq" && q.whyWrong) why = `<ul class="why">${q.options.map((o, i) => i === q.answer ? "" : `<li><b>${esc(o)}</b>: ${esc(q.whyWrong[i])}</li>`).join("")}</ul>`;
  let verdict = ok ? "Correct" : (ans == null ? "Not answered" : "Incorrect");
  if (q.type === "match" && g.answered) verdict += ` · ${g.right} of ${g.n} pairs right`;
  return `<div class="feedback ${ok ? "ok" : "no"}" role="status">
    <div class="verdict">${verdict}</div>
    ${!ok ? `<div><span class="muted small">Correct answer: </span>${q.type === "match" ? `<ul class="why">${q.pairs.map(p => `<li>${esc(p.left)} → <b>${esc(p.right)}</b></li>`).join("")}</ul>` : `<b>${esc(correctText(q))}</b>`}</div>` : ""}
    <p>${esc(q.explanation)}</p>
    ${why ? `<div><div class="small muted" style="margin-bottom:4px">Why the other options are wrong</div>${why}</div>` : ""}
    <p class="concept"><b>Concept:</b> ${esc(q.concept)}</p>
    <details><summary>Source and labels</summary><p class="small muted" style="margin-top:6px">${esc(q.source)} · ${esc(q.topic)} · ${SKILL_NAME[q.skill]} · <span class="mono">${esc(q.id)}</span></p></details>
  </div>`;
}

// ---------- views: results ----------
let resFilter = "all";
function breakdown(items, keyFn, labelFn) {
  const m = new Map();
  for (const it of items) { const k = keyFn(Q[it.id]); const r = m.get(k) || { k, n: 0, c: 0, u: 0, credit: 0 }; r.n++; if (it.g.correct) r.c++; if (!it.g.answered) r.u++; r.credit += it.g.credit; m.set(k, r); }
  return [...m.values()].map(r => `<tr><td>${esc(labelFn(r.k))}</td><td class="num">${r.c}/${r.n}</td><td class="num">${r.u}</td><td class="num">${pct(r.credit / r.n)}</td></tr>`).join("");
}
function renderResults() {

  return `

  </section>
  <section class="section">

      <div class="seg" role="group" aria-label="Filter review">
        ${[["all", "All"], ["wrong", "Incorrect & blank"], ["flagged", "Flagged"]].map(([v, l]) => `<label><input type="radio" name="rf" value="${v}" data-act="resFilter" ${resFilter === v ? "checked" : ""}> ${l}</label>`).join("")}</div></div>
    ${shown.length ? shown.map(it => reviewCard(Q[it.id], it.ans, it.g, s.qids.indexOf(it.id) + 1, it.flagged)).join("") : `<div class="card empty">Nothing in this filter.</div>`}

}
function reviewCard(q, ans, g, n, flagged) {
  const status = g.correct ? `<span class="chip good">Correct</span>` : (!g.answered ? `<span class="chip warn">Unanswered</span>` : `<span class="chip bad">Incorrect${q.type === "match" ? ` · ${g.right}/${g.n} pairs` : ""}</span>`);
  let yours = esc(answerText(q, ans));
  if (q.type === "match" && ans) yours = `<ul class="why">${q.pairs.map((p, i) => `<li>${esc(p.left)} → ${ans[i] ? esc(ans[i]) : "<i>blank</i>"} ${ans[i] === p.right ? "✓" : `<span style="color:var(--bad)">✗</span>`}</li>`).join("")}</ul>`;
  const corr = q.type === "match" ? `<ul class="why">${q.pairs.map(p => `<li>${esc(p.left)} → <b>${esc(p.right)}</b></li>`).join("")}</ul>` : `<b>${esc(correctText(q))}</b>`;
  const why = q.type === "mcq" ? `<div><div class="small muted" style="margin-bottom:4px">Why the other options are wrong</div><ul class="why">${q.options.map((o, i) => i === q.answer ? "" : `<li><b>${esc(o)}</b>: ${esc(q.whyWrong[i])}</li>`).join("")}</ul></div>` : "";
  return `<article class="card review-item" style="margin-top:10px">
    <div class="row between"><div class="row" style="gap:6px">${n ? `<span class="mono small muted">#${n}</span>` : ""}${status}${flagged ? `<span class="chip warn">★ Flagged</span>` : ""}</div>
      <div class="row" style="gap:6px"><span class="chip acc">${LESSON_NO[q.lesson]}</span><span class="chip">${TYPE_NAME[q.type]}</span><span class="chip">${diffPips(q.difficulty)} ${DIFF_NAME[q.difficulty]}</span><span class="chip">${SKILL_NAME[q.skill]}</span></div></div>
    <p class="qtext" style="font-size:1rem">${esc(q.question)}</p>
    ${ans !== undefined ? `<div class="ans-line"><span class="muted small">Your answer</span><div>${yours}</div></div>` : ""}
    <div class="ans-line"><span class="muted small">Correct answer</span><div>${corr}</div></div>
    <p>${esc(q.explanation)}</p>
    ${why}
    <p class="concept"><b>Concept to understand:</b> ${esc(q.concept)}</p>
    <div class="small muted">Topic: ${esc(q.topic)}</div>
    <details><summary>Source reference</summary><p class="small muted" style="margin-top:6px">${esc(q.source)} · <span class="mono">${esc(q.id)}</span></p></details>
  </article>`;
}

// ---------- views: review & mastery ----------
function renderReview() {
  const wrong = QS.filter(q => isWrong(q.id));
  const repeated = QS.filter(q => (prog(q.id)?.w || 0) >= 2 && !isMastered(q.id));
  const scen = QS.filter(q => q.difficulty === "hard" && !isMastered(q.id));
  const flagged = QS.filter(q => store.flags[q.id]);
  const unatt = QS.filter(q => !isAttempted(q.id));
  const weak = weakTopics(QS, 50);
  const weakQs = QS.filter(q => weak.some(t => t.topic === q.topic && t.lesson === q.lesson));
  const bucket = (title, desc, list, act) => `<div class="card stack"><div class="row between"><h3>${title}</h3><span class="mono">${list.length}</span></div><p class="small muted">${desc}</p>
    <div class="row"><button class="btn sm" data-act="bucket" data-v="${act}" ${list.length ? "" : "disabled"}>Practise these</button></div></div>`;
  return `
  <div class="crumbs"><button class="linkish" data-act="home">Dashboard</button> / Review &amp; mastery</div>
  <section class="hero" style="padding-top:12px"><div><h1>Review &amp; mastery</h1>

      <button class="btn primary" data-act="mastery">Start mastery session</button></div></section>

    ${bucket("Incorrect answers", "Your latest answer was wrong.", wrong, "wrong")}

    ${bucket("Difficult scenarios", "Scenario questions you have not mastered.", scen, "scen")}
    ${bucket("Weak topics", `${weak.length} topic(s) under 70% accuracy.`, weakQs, "weak")}
    ${bucket("Flagged", "Questions you flagged during a session.", flagged, "flagged")}
    ${bucket("Not attempted", "Questions you have never answered.", unatt, "new")}
  </div></section>
  ${weak.length ? `<section class="section"><h2>Low-accuracy topics</h2><div class="card"><div class="list">${weak.map(t => `<div class="topic-row"><div style="min-width:0">${esc(t.topic)}<div class="small muted">${LESSON_NO[t.lesson]} · ${t.c}/${t.a} correct</div></div><span class="chip bad">${pct(t.acc)}</span><button class="btn sm" data-act="topic" data-l="${t.lesson}" data-t="${esc(t.topic)}">Practise</button></div>`).join("")}</div></div></section>` : ""}
  ${flagged.length ? `<section class="section"><div class="row between"><h2>Flagged questions</h2><button class="btn ghost sm" data-act="clearFlags">Clear all flags</button></div></section>` : ""}`;
}
function bucketIds(v) {
  const weak = weakTopics(QS, 50);
  const f = {
    wrong: q => isWrong(q.id), repeated: q => (prog(q.id)?.w || 0) >= 2 && !isMastered(q.id), scen: q => q.difficulty === "hard" && !isMastered(q.id),
    weak: q => weak.some(t => t.topic === q.topic && t.lesson === q.lesson), flagged: q => store.flags[q.id], new: q => !isAttempted(q.id)
  }[v];
  return QS.filter(f).map(q => q.id);
}
function masteryIds() {
  const out = [], have = new Set();
  const add = (ids) => { for (const id of ids) if (!have.has(id) && out.length < 20) { have.add(id); out.push(id); } };
  add(shuffle(bucketIds("repeated"))); add(shuffle(bucketIds("wrong"))); add(shuffle(bucketIds("flagged")));
  add(shuffle(bucketIds("scen").filter(isAttempted))); add(shuffle(bucketIds("weak"))); add(stratify(QS.filter(q => !isAttempted(q.id)), q => q.lesson + q.type).map(q => q.id));
  return out;
}

// ---------- events ----------
function applyTheme() {
  const t = store.theme;
  if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
  const b = document.getElementById("themeBtn"); if (b) b.textContent = t === "dark" ? "Dark" : t === "light" ? "Light" : "Auto theme";
}
function practice(title, qids, origin, shuffleQ = false) {
  startSession({ kind: "practice", title, qids: shuffleQ ? shuffle(qids) : qids, origin, cfg: { shuffleOpts: true } });
}
const lessonQs = (l, f = () => true) => byLesson(l).filter(f).map(q => q.id);

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]"); if (!t || t.disabled) return;
  const a = t.dataset.act, l = +t.dataset.l || null, v = t.dataset.v;
  const s = store.session;
  const L = l ? LESSON_NO[l] : "";
  switch (a) {
    case "home": nav({ name: "dashboard" }); break;
    case "theme": store.theme = store.theme == null ? "dark" : store.theme === "dark" ? "light" : null; applyTheme(); save(false); break;
    case "lesson": nav({ name: "lesson", lesson: l }); break;
    case "comp": bcfg = defaultCfg(null); nav({ name: "builder" }); break;
    case "lessonExam": bcfg = defaultCfg(l); nav({ name: "builder" }); break;
    case "review": nav({ name: "review" }); break;
    case "guide": nav({ name: "guide", lesson: l || 1 }); break;
    case "browse": browseF = { topic: "", type: "" }; nav({ name: "browse", lesson: l }); break;
    case "resume": store.lastView = "session"; save(false); nav({ name: "session" }); break;
    case "lastResults": nav({ name: "results" }); break;
    case "discard": confirmBox({ title: "Discard this session?", body: "Your answers in the unfinished session will be lost. Progress already recorded stays.", ok: "Discard", danger: true, onOk: () => { store.session = null; save(); render(); } }); break;
    case "reset": confirmBox({ title: "Reset all progress?", body: "This deletes every recorded attempt, flag and unfinished session. It cannot be undone.", ok: "Reset everything", danger: true,
      onOk: () => { store.progress = {}; store.flags = {}; store.session = null; store.resetAt = Date.now(); save(); render(); toast("Progress reset."); } }); break;
    case "acOut": accountAction("out"); break;
    case "acReset": accountAction("reset"); break;
    case "acMode": ACCOUNT.mode = ACCOUNT.mode === "up" ? "in" : "up"; ACCOUNT.msg = ""; render(); break;
    case "exportProg": {
      const blob = new Blob([JSON.stringify(Object.assign({}, store, { exportedAt: new Date().toISOString() }))], { type: "application/json" });
      const url = URL.createObjectURL(blob), link = document.createElement("a");
      link.href = url; link.download = "midterm-mastery-progress-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast("Backup downloaded."); break; }
    case "importProg": document.getElementById("importFile").click(); break;
    case "practiceAll": practice(`${L} · All questions`, lessonQs(l), lessonOrigin(l)); break;
    case "practiceAllShuffled": practice(`${L} · All questions (shuffled)`, lessonQs(l), lessonOrigin(l), true); break;
    case "byType": practice(`${L} · ${TYPE_NAME[v]}`, lessonQs(l, q => q.type === v), lessonOrigin(l)); break;
    case "byDiff": practice(`${L} · ${DIFF_NAME[v]}`, lessonQs(l, q => q.difficulty === v), lessonOrigin(l)); break;
    case "retryWrong": practice(`${L} · Incorrect answers`, lessonQs(l, q => isWrong(q.id)), lessonOrigin(l)); break;
    case "topic": practice(`${LESSON_NO[l]} · ${t.dataset.t}`, lessonQs(l, q => q.topic === t.dataset.t), lessonOrigin(l)); break;
    case "bucket": practice({ wrong: "Incorrect answers", repeated: "Repeated mistakes", scen: "Difficult scenarios", weak: "Weak topics", flagged: "Flagged questions", new: "New questions" }[v], bucketIds(v), { view: "review" }); break;
    case "mastery": practice("Mastery session", masteryIds(), { view: "review" }); break;
    case "clearFlags": confirmBox({ title: "Clear all flags?", body: "Questions stay in the bank; only the flags are removed.", ok: "Clear flags", onOk: () => { store.flags = {}; save(); render(); } }); break;
    case "redraw": updatePreview(); break;
    case "startBuilt": {
      readBuilder(); const c = bcfg; if (!c.draw || !c.draw.length) return;
      const scope = c.lockLesson ? LESSON_NO[c.lessons[0]] : (c.lessons.length === 5 ? "All lessons" : c.lessons.map(x => LESSON_NO[x]).join(", "));
      const bits = [c.type === "all" ? null : TYPE_NAME[c.type], c.diff === "mixed" ? null : c.diff === "block" ? "3:1:1" : DIFF_NAME[c.diff], c.full ? "full bank" : `${c.draw.length} questions`].filter(Boolean).join(", ");
      startSession({ kind: c.mode, title: `${scope} ${c.mode === "exam" ? "exam" : "practice"} · ${bits}`, qids: c.draw.slice(), origin: lessonOrigin(c.lockLesson ? c.lessons[0] : null),
        cfg: { shuffleOpts: c.shuffleOpts, timer: c.timer, builder: Object.assign({}, c, { draw: null }) } });
      break; }
    // session actions
    case "pick": case "pickTF": {
      const id = s.qids[s.idx]; if (s.checked[id]) return;
      s.answers[id] = a === "pick" ? +v : v === "true"; save(); render(); break; }
    case "check": {
      const id = s.qids[s.idx]; if (s.answers[id] == null) return;
      s.checked[id] = true; record(id, grade(Q[id], s.answers[id]).correct); save(); render(); break; }
    case "prev": if (s.idx > 0) { s.idx--; save(false); render(); } break;
    case "next": if (s.idx < s.qids.length - 1) { s.idx++; save(false); render(); } break;
    case "goto": s.idx = +t.dataset.i; save(false); render(); break;
    case "flag": { const id = s.qids[s.idx]; if (s.flags[id]) { delete s.flags[id]; delete store.flags[id]; } else { s.flags[id] = true; store.flags[id] = 1; } save(); render(); break; }
    case "leave": stopTimer(); store.lastView = "dashboard"; save(); nav({ name: "dashboard" }); toast("Session saved. Resume it from the dashboard."); break;
    case "submit": {
      const answered = s.qids.filter(x => s.answers[x] != null).length, flagged = Object.keys(s.flags).length, left = s.qids.length - answered;
      confirmBox({ title: s.kind === "exam" ? "Submit your exam?" : "Finish this practice set?", ok: s.kind === "exam" ? "Submit exam" : "Finish",
        body: `${answered} of ${s.qids.length} answered.${left ? ` <b>${left} unanswered</b> question(s) will score zero.` : ""}${flagged ? ` ${flagged} flagged for review.` : ""} You cannot change answers afterwards.`,
        cancel: "Keep working", onOk: () => submitSession(false) });
      break; }
    // results actions
    case "retryIncorrect": { const ids = s.result.items.filter(i => !i.g.correct).map(i => i.id); restart(s, ids, "incorrect"); break; }
    case "retryAll": restart(s, s.qids.slice(), "retry"); break;
    case "practiseWeak": {
      const topicsBad = new Set(); const by = {};
      for (const it of s.result.items) { const q = Q[it.id], k = q.lesson + "|" + q.topic; (by[k] ||= { n: 0, cr: 0 }); by[k].n++; by[k].cr += it.g.credit; }
      for (const [k, r] of Object.entries(by)) if (r.cr / r.n < 0.7) topicsBad.add(k);
      const ids = QS.filter(q => topicsBad.has(q.lesson + "|" + q.topic)).map(q => q.id);
      if (!ids.length) { toast("No topic in this result scored under 70%."); return; }
      practice("Weak topics from your last result", ids, s.origin); break; }
  }
});
function restart(s, ids, why) {
  if (!ids.length) { toast("Nothing to retry."); return; }
  startSession({ kind: s.kind, title: (why === "incorrect" ? "Retry incorrect · " : "") + s.title.replace(/^Retry incorrect · /, ""), qids: why === "retry" && s.cfg.builder?.shuffleQ ? shuffle(ids) : ids, origin: s.origin, cfg: s.cfg });
}
document.addEventListener("change", (e) => {
  if (e.target.id === "importFile") {
    const f = e.target.files && e.target.files[0]; e.target.value = "";
    if (!f) return;
    f.text().then(txt => {
      let data = null; try { data = JSON.parse(txt); } catch (err) {}
      if (!data || data.v !== 1 || typeof data.progress !== "object") { toast("That file is not a Midterm Mastery backup."); return; }
      const n = Object.keys(data.progress).filter(id => Q[id]).length;
      confirmBox({ title: "Load this backup?", body: `It has ${n} answered question(s). It replaces the progress currently saved in this browser.`, ok: "Load backup", danger: true,
        onOk: () => { store = Object.assign({ v: 1, progress: {}, flags: {}, session: null, lastView: "dashboard", theme: store.theme }, data); delete store.exportedAt; save(); applyTheme(); render(); toast("Backup loaded."); } });
    });
    return;
  }

  const t = e.target;
  if (t.closest("#builder")) { updatePreview(); return; }
  const a = t.dataset.act;
  if (a === "matchSel") {
    const s = store.session, id = s.qids[s.idx], cur = Object.assign({}, s.answers[id] || {});
    const i = +t.dataset.i;
    if (t.value) { for (const k of Object.keys(cur)) if (cur[k] === t.value && +k !== i) delete cur[k]; cur[i] = t.value; } else delete cur[i];
    if (Object.keys(cur).length) s.answers[id] = cur; else delete s.answers[id];
    save(); render(); const el = document.getElementById("m" + i); if (el) el.focus();
  } else if (a === "resFilter") { resFilter = t.value; render(); }
  else if (a === "browseTopic") { browseF.topic = t.value; render(); }
  else if (a === "browseType") { browseF.type = t.value; render(); }
});
document.addEventListener("submit", (e) => {
  if (e.target.id === "acForm") { e.preventDefault(); accountAction(ACCOUNT.mode === "up" ? "up" : "in"); }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && remote) pullRemote(); });
document.addEventListener("input", (e) => { if (e.target.closest("#builder") && e.target.type === "number") updatePreview(); });
document.addEventListener("keydown", (e) => {
  if (view.name !== "session" || document.getElementById("layer").innerHTML) return;
  if (["SELECT", "INPUT", "TEXTAREA"].includes(e.target.tagName) || e.altKey || e.ctrlKey || e.metaKey) return;
  const s = store.session; if (!s || s.submitted) return;
  const id = s.qids[s.idx], q = Q[id];
  if (e.key === "ArrowRight" && s.idx < s.qids.length - 1) { s.idx++; save(false); render(); }
  else if (e.key === "ArrowLeft" && s.idx > 0) { s.idx--; save(false); render(); }
  else if (/^[1-4]$/.test(e.key) && !s.checked[id]) {
    const k = +e.key - 1;
    if (q.type === "mcq" && k < q.options.length) { s.answers[id] = s.optOrder[id][k]; save(); render(); }
    else if (q.type === "tf" && k < 2) { s.answers[id] = k === 0; save(); render(); }
  }
});

// ---------- boot ----------
applyTheme();
// Resume straight into an unfinished session after an accidental reload.
if (store.session && !store.session.submitted && store.lastView === "session") view = { name: "session" };
render();
connectRemote();
connectFirebase();
</script>
